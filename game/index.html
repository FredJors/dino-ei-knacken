  /* ---------- Szene komplett zeichnen ---------- */
  drawScene(ctx, t) {
    const cave = World.cave();
    const sh = Game.shake * Game.shake * 22;
    ctx.save();
    if (sh > 0.3) ctx.translate(rand(-sh, sh), rand(-sh, sh));
    if (cave) World.drawCave(ctx, t); else World.drawSky(ctx);
    if (Game.phase === 'play' && Game.timeLeft < CONFIG.timer.urgentAt) {
      const u = clamp((CONFIG.timer.urgentAt - Game.timeLeft) / CONFIG.timer.urgentAt, 0, 1);
      ctx.fillStyle = `rgba(255,70,40,${u * (0.12 + Math.sin(t * 5) * 0.05)})`; ctx.fillRect(0, 0, 1080, cave ? 1920 : 1060 + LAND_DY);
    }
    if (cave) World.drawFlyers(ctx);
    if (Game.meteor && Game.meteor.state !== 'dive') World.drawMeteor(ctx, Game.meteor);
    if (!cave) {
      World.drawLand(ctx);
      World.drawHerd(ctx);
      World.drawGrassAndFerns(ctx);
      World.drawNightTint(ctx);
    }
    // Nester + Eier
    const xs = Game.eggs.length ? Game.eggs.map(e => [e.x, e.rx, e]) : Game.eggXs(Game.mode).map(x => [x, (EGG_SIZES[Game.mode] || EGG_SIZES.normal)[0], null]);
    const gy = CONFIG.layout.groundY;
    for (const [x, rx, e] of xs) if (!e || e.state !== 'roll') this.drawNest(ctx, x, gy, rx, 'back');
    if (Game.phase === 'intro' && Game.mode === 'boss') this.drawBossShadow(ctx, t);
    if (Game.phase === 'impact' && Game._boomed) this.drawCrater(ctx, xs);
    for (const e of Game.eggs) this.drawEgg(ctx, e, t);
    for (const [x, rx, e] of xs) if (!e || e.state !== 'roll') this.drawNest(ctx, x, gy, rx, 'front');
    if (Game.phase === 'hatch' && Game.hatchInfo) this.drawHatchDino(ctx, t);
    const hs = Game.helpers.slice().sort((a, b) => a.y - b.y);
    for (const h of hs) h.draw(ctx);
    if (cave) World.drawHerd(ctx);                    // Herde auf dem Höhlenboden (vor der Felskante)
    const tn = now();
    // Namensschilder: Könige immer, sonst die zuletzt aktiven – max. 6, versetzt
    const tagged = Game.helpers.filter(h => h.state !== 'leave' && (Game.kings.has(h.uid) || tn < h.tagUntil))
      .sort((a, b) => (Game.kings.has(b.uid) - Game.kings.has(a.uid)) || (b.tagUntil - a.tagUntil)).slice(0, 6);
    // überlappungsfrei: wichtigste zuerst, wer kollidiert, rutscht eine Etage höher
    const placed = [];
    for (const h of tagged) {
      const b = h.tagBox(ctx);
      for (let k = 0; k < 4 && placed.some(p => Math.abs(p.x - b.x) < (p.w + b.w) / 2 + 6 && Math.abs(p.y - b.y) < b.hgt + 4); k++) b.y -= b.hgt + 6;
      placed.push(b);
    }
    placed.sort((a, b) => b.y - a.y).forEach(b => b.h.drawTag(ctx, b));
    this.drawFlyHearts(ctx);
    FX.draw(ctx, 1);
    if (Game.meteor && Game.meteor.state === 'dive') World.drawMeteor(ctx, Game.meteor);
    if (cave) World.drawCaveFront(ctx);
    World.drawFront(ctx);
    FX.draw(ctx, 2);
    this.drawPops(ctx);
    ctx.restore();
    if (Game.flash > 0.01) { ctx.globalAlpha = Math.min(1, Game.flash) * 0.85; ctx.fillStyle = Game.flashColor; ctx.fillRect(0, 0, 1080, 1920); ctx.globalAlpha = 1; }
    // HYPE: Bildrand glüht
    if (Hype.active > 0) { const a = 0.35 + Math.sin(t * 10) * 0.15; const g = ctx.createRadialGradient(540, 960, 600, 540, 960, 1150); g.addColorStop(0, 'rgba(255,120,40,0)'); g.addColorStop(1, `rgba(255,110,30,${a})`); ctx.fillStyle = g; ctx.fillRect(0, 0, 1080, 1920); }
    if (cave) Grain.drawVignette(ctx);
    // HUD
    this.drawCTA(ctx, t);
    this.drawStatusRow(ctx, t);
    this.drawLex(ctx);
    this.drawInfo(ctx, t);
    this.drawMission(ctx, t);
    this.drawBoard(ctx, t);
    this.drawHype(ctx, t);
    this.drawDuelLabels(ctx, t);
    this.drawBubble(ctx, t);
    this.drawCallouts(ctx);
    this.drawAnnounce(ctx, t);
    this.drawImpactText(ctx, t);
    this.drawCard(ctx, t);
    this.drawToasts(ctx);
    this.drawPause(ctx, t);
    this.drawHints(ctx, t);
    if (!cave) Grain.draw(ctx);                       // Wiesen-Ersatz: Papierkörnung über allem
  },
  /* Like-Herzen fliegen auf einer Kurve zum Ei */
  drawFlyHearts(ctx) {
    for (const h of Game.flyHearts) {
      if (h.t < 0) continue;
      const k = easeInOutSine(clamp(h.t / h.dur, 0, 1)), u = 1 - k;
      const x = u * u * h.x0 + 2 * u * k * h.cx + k * k * h.x1, y = u * u * h.y0 + 2 * u * k * h.cy + k * k * h.y1;
      const s = h.s * (0.7 + Math.sin(k * Math.PI) * 0.5) / 20;
      ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.rotate(Math.sin(h.t * 8) * 0.2);
      ctx.beginPath(); ctx.moveTo(0, 7); ctx.bezierCurveTo(-24, -8, -11, -26, 0, -12); ctx.bezierCurveTo(11, -26, 24, -8, 0, 7);
      ctx.fillStyle = h.col; ctx.fill(); ctx.lineWidth = 3.5; ctx.strokeStyle = '#2a0f12'; ctx.stroke();
      ctx.restore();
    }
  },
  drawEgg(ctx, e, t) {
    if (e.state === 'gone') return;
    if (e.wantsImg) e.retex();                         // Ei-Bild ist inzwischen geladen
    const cy = e.ry * 0.95, cave = World.cave();
    ctx.save();
    ctx.globalAlpha = e.alpha;
    // Lava-Schein hinter dem Ei: wächst mit dem Fortschritt, ab 90 % pulsiert es ("gleich schlüpft's!")
    if ((e.state === 'idle' || e.state === 'drop') && e.progress > 0.15 && cave) {
      const p = e.progress, gs = e.rx * (1.4 + p * 0.9) * (1 + Math.sin(t * (p >= 0.9 ? 8 : 3)) * (p >= 0.9 ? 0.08 : 0.03));
      ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = e.alpha * (0.12 + p * 0.38); ctx.drawImage(softBlob('#ff7a1f'), e.x - gs, e.groundY - cy - e.h - gs, gs * 2, gs * 2); ctx.restore();
    } else if (e.state === 'idle' && e.progress >= 0.9) { const gs = e.rx * 2.2 * (1 + Math.sin(t * 8) * 0.08); ctx.globalAlpha = 0.6 * e.alpha; ctx.drawImage(softBlob('#ffe27a'), e.x - gs, e.groundY - cy - gs, gs * 2, gs * 2); ctx.globalAlpha = e.alpha; }
    if (e.boss && e.state !== 'burst') { const gs = e.rx * 2.1 * (1 + Math.sin(t * 3) * 0.05); ctx.save(); ctx.globalCompositeOperation = cave ? 'lighter' : 'source-over'; ctx.globalAlpha = (cave ? 0.4 : 0.55) * e.alpha; ctx.drawImage(softBlob('#b86bff'), e.x - gs, e.groundY - cy - gs, gs * 2, gs * 2); ctx.restore(); }
    if (e.state === 'idle' || e.state === 'drop' || e.state === 'roll') {
      // Schatten
      ctx.fillStyle = cave ? 'rgba(0,0,0,0.45)' : 'rgba(30,20,10,0.22)'; ctx.beginPath(); ctx.ellipse(e.x, e.groundY + 4, e.rx * (0.9 - Math.min(e.h, 120) / 400), 16, 0, 0, TAU); ctx.fill();
      const breathe = Math.sin(t * 2.2 + e.phase) * 0.012 * (1 - (e.intensity || 0) * 0.5);
      const sq = e.squash;
      ctx.translate(e.x, e.groundY - e.h - e.drop);
      ctx.rotate(e.a);
      ctx.scale(1 + breathe + sq * 0.6, 1 - breathe - sq);
      ctx.translate(0, -cy);
      ctx.drawImage(e.tex, -e.tex.width / 2, -e.tex.height / 2);
      if (e.stage > 0) EggArt.drawCracks(ctx, e, e.progress, Game.t);
      if (e.flash > 0.01) { ctx.globalAlpha = e.flash * 0.55 * e.alpha; const w = EggArt.tint(e.tex, '#fff8e8'); ctx.drawImage(w, -w.width / 2, -w.height / 2); ctx.globalAlpha = e.alpha; }
      if (e.bigCrack > 0) {                         // Follow: Riesenriss-Blitz
        ctx.save(); ctx.clip(EggArt.path(e.rx * 0.97, e.ry * 0.98));
        ctx.strokeStyle = `rgba(255,240,150,${Math.min(1, e.bigCrack * 1.6)})`; ctx.lineWidth = 12; ctx.lineJoin = 'miter';
        const r = mulberry32(e.seed + Math.floor(e.bigCrack * 10));
        ctx.beginPath(); let x = -e.rx, y = -e.ry * 0.2; ctx.moveTo(x, y);
        while (x < e.rx) { x += e.rx * (0.15 + r() * 0.15); y += (r() - 0.5) * e.ry * 0.35; ctx.lineTo(x, y); }
        ctx.stroke(); ctx.strokeStyle = '#2a0f05'; ctx.lineWidth = 4; ctx.stroke(); ctx.restore();
      }
    } else if (e.state === 'burst') {
      const k = e.burstT;
      const zz = EggArt.zigzag(e.rx, -e.ry * 0.15);
      const clipTop = c => { c.beginPath(); c.moveTo(zz[0][0], zz[0][1]); for (const p of zz) c.lineTo(p[0], p[1]); c.lineTo(e.rx * 1.3, -e.ry * 1.3); c.lineTo(-e.rx * 1.3, -e.ry * 1.3); c.closePath(); };
      const clipBot = c => { c.beginPath(); c.moveTo(zz[0][0], zz[0][1]); for (const p of zz) c.lineTo(p[0], p[1]); c.lineTo(e.rx * 1.3, e.ry * 1.3); c.lineTo(-e.rx * 1.3, e.ry * 1.3); c.closePath(); };
      const fade = clamp(1 - (k - 1.1) / 0.6, 0, 1);
      // Licht bricht aus dem Ei
      if (k < 1.2) { const gs = e.rx * (1.6 + k * 2.5); ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = clamp(1 - k / 1.2, 0, 1) * 0.8; ctx.drawImage(softBlob('#ffd27a'), e.x - gs, e.groundY - cy - gs, gs * 2, gs * 2); ctx.restore(); }
      // untere Schale bleibt
      ctx.save(); ctx.globalAlpha = fade * e.alpha; ctx.translate(e.x, e.groundY - cy); clipBot(ctx); ctx.clip(); ctx.drawImage(e.tex, -e.tex.width / 2, -e.tex.height / 2); ctx.restore();
      // obere Kappe fliegt weg
      ctx.save(); ctx.globalAlpha = clamp(1 - k / 1.4, 0, 1);
      ctx.translate(e.x + k * 260, e.groundY - cy - k * 900 + k * k * 700); ctx.rotate(k * 5);
      clipTop(ctx); ctx.clip(); ctx.drawImage(e.tex, -e.tex.width / 2, -e.tex.height / 2); ctx.restore();
    }
    ctx.restore();
  },
  drawHatchDino(ctx, t) {
    const info = Game.hatchInfo, k = Game.phaseT;
    if (k < 0.15) return;
    const s = easeOutBack(clamp((k - 0.15) / 0.45, 0, 1));
    const R = RARITIES[info.rarity];
    const glow = R.aura || R.glow;
    if (glow) { const gs = 210 * s; ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.65; ctx.drawImage(softBlob(glow), info.x - gs, info.y - 120 - gs, gs * 2, gs * 2); ctx.restore(); }
    const jump = Math.abs(Math.sin(k * 7)) * 30 * s;
    if (DinoArt.has(info.species)) {
      const size = 210 * s; if (size < 4) return;
      const p = DinoArt.pose(info.species, t, 0, size);
      DinoArt.draw(ctx, info.species, info.x, info.y - jump - p.bob, { size, rarity: info.rarity, palIdx: info.palIdx, face: 1, sx: p.sx, sy: p.sy });
    } else {
      const pal = PALETTES[info.rarity][info.palIdx % PALETTES[info.rarity].length];
      const sc = Math.min(0.75, 200 / SPECIES_H[info.species]) * s;
      Art.drawDino(ctx, info.species, info.x, info.y - jump, { pal, t, scale: sc, seed: info.seed, face: 1 });
    }
  },
  drawBossShadow(ctx, t) {
    const [rx, ry] = EGG_SIZES.boss, x = Game.eggXs('boss')[0], gy = CONFIG.layout.groundY;
    const k = Game.phaseT / Game.introDur;
    if (!this.bossTex || (!this.bossTex.isImg && Assets.has('egg_boss'))) this.bossTex = EggArt.texture({ rx, ry, base: '#57536a', pat: '#b46bff', pattern: 'spots', seed: 9, boss: true });
    const tex = this.bossTex, dark = EggArt.tint(tex, '#1a0c2e'), rim = EggArt.tint(tex, '#d9a0ff');
    ctx.save(); ctx.translate(x, gy - ry * 0.95 + Math.sin(t * 2) * 6); ctx.scale(1 + Math.sin(t * 4) * 0.02, 1);
    ctx.globalAlpha = 0.35 + Math.sin(t * 5) * 0.25;
    ctx.save(); ctx.scale(1.04, 1.03); ctx.drawImage(rim, -rim.width / 2, -rim.height / 2); ctx.restore();
    ctx.globalAlpha = 0.35 + k * 0.4; ctx.drawImage(dark, -dark.width / 2, -dark.height / 2);
    ctx.restore();
  },
  drawCrater(ctx, xs) {
    const k = Game.phaseT - 0.9;
    for (const [x, rx] of xs) {
      ctx.fillStyle = `rgba(20,12,10,${clamp(0.85 - k * 0.12, 0, 0.85)})`;
      ctx.beginPath(); ctx.ellipse(x, CONFIG.layout.groundY + 6, rx * 1.4, 34, 0, 0, TAU); ctx.fill();
      ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = clamp(0.7 - k * 0.15, 0, 0.7); ctx.drawImage(softBlob('#ff5a1a'), x - rx * 1.3, CONFIG.layout.groundY - 40, rx * 2.6, 90); ctx.restore();
      if (Math.random() < 0.25) FX.spawn({ type: 'blob', layer: 1, x: x + rand(-rx, rx), y: CONFIG.layout.groundY, vx: rand(-10, 10), vy: rand(-50, -30), size: rand(16, 28), grow: 16, life: 2, color: '#6c6066', alpha: 0.5 });
    }
  },
};

/* ==========================================================================
   12. Net – Verbindung zur Bridge (ws://localhost:8787), Event-Queue, Testmodus
   ========================================================================== */
const IS_PANEL = /(^|[?&#])panel\b/.test(location.search.slice(1) + '&' + location.hash.slice(1));

function normalizeEvent(e) {
  if (!e || typeof e !== 'object') return null;
  const type = String(e.type || '');
  if (!['chat', 'like', 'follow', 'share', 'gift', 'member'].includes(type)) return null;
  const uid = String(e.uid || e.name || '').slice(0, 64);
  if (!uid) return null;
  return { type, uid, name: String(e.name || '').slice(0, 64), nick: String(e.nick || '').slice(0, 64), text: String(e.text || '').slice(0, 200),
    count: Math.max(1, Math.min(1000, Number(e.count) || 1)), diamonds: Math.max(0, Math.min(100000, Number(e.diamonds) || 0)), avatar: e.avatar ? 1 : 0 };
}

const EventQueue = {
  q: [], dropped: 0,
  push(ev) {
    if (!ev) return;
    if (this.q.length >= CONFIG.perf.maxQueue) {
      const i = this.q.findIndex(x => x.type === 'like' || x.type === 'member');
      this.q.splice(i >= 0 ? i : 0, 1); this.dropped++;
    }
    this.q.push(ev);
  },
  process(budget) { let n = 0; const G = MONSTER_MODE ? Monster : RACE_MODE ? Race : Game; while (this.q.length && n < budget) { G.handleEvent(this.q.shift()); n++; } },
};

const Net = {
  ws: null, state: 'offline', everConnected: false, forceTest: false, testMode: true, retryMs: CONFIG.bridge.retryMinMs,
  tiktok: { status: 'keine Bridge', message: '', viewers: null, user: '' }, bootAt: now(),
  url() { const p = new URLSearchParams(location.search); return p.get('bridge') || CONFIG.bridge.url; },
  connect() {
    if (this.ws) return;
    let ws;
    try { ws = new WebSocket(this.url()); } catch (e) { this.state = 'offline'; this.scheduleRetry(); return; }
    this.ws = ws; this.state = 'connecting';
    ws.onopen = () => {
      this.state = 'connected'; this.everConnected = true; this.retryMs = CONFIG.bridge.retryMinMs;
      try { ws.send(JSON.stringify({ type: 'hello', role: IS_PANEL ? 'panel' : 'game' })); } catch (e) { /* egal */ }
      this.updateTestMode();
    };
    ws.onmessage = m => { let d; try { d = JSON.parse(m.data); } catch (e) { return; } this.onMessage(d); };
    ws.onclose = () => { this.ws = null; this.state = 'offline'; this.tiktok.status = 'keine Bridge'; this.updateTestMode(); this.scheduleRetry(); };
    ws.onerror = () => { /* onclose folgt */ };
  },
  scheduleRetry() {
    clearTimeout(this._timer);
    this._timer = setTimeout(() => this.connect(), this.retryMs);
    this.retryMs = Math.min(CONFIG.bridge.retryMaxMs, Math.round(this.retryMs * 1.6));
  },
  send(obj) { if (this.ws && this.ws.readyState === 1) { try { this.ws.send(JSON.stringify(obj)); } catch (e) { /* egal */ } } },
  onMessage(d) {
    if (!d || typeof d !== 'object') return;
    if (d.type === 'event' && !IS_PANEL) EventQueue.push(normalizeEvent(d.event));
    else if (d.type === 'events' && !IS_PANEL && Array.isArray(d.events)) d.events.forEach(e => EventQueue.push(normalizeEvent(e)));
    else if (d.type === 'tiktok') this.tiktok = { status: d.status || '?', message: d.message || '', viewers: d.viewers != null ? d.viewers : this.tiktok.viewers, user: d.user || this.tiktok.user };
    else if (d.type === 'relay' && d.payload) PanelLink.onRelay(d.payload);
  },
  /* Testmodus: automatisch, solange nie eine Bridge verbunden war.
     Fällt die Bridge mitten im Stream aus, werden KEINE falschen Zuschauer simuliert. */
  updateTestMode() {
    const was = this.testMode;
    this.testMode = this.forceTest || (!this.everConnected && this.state !== 'connected');
    if (was !== this.testMode) StatsLog.mark('testmode', { on: this.testMode });
    TestBar.refresh();
  },
};

/* --------------------------------------------------------------------------
   Testmodus: simulierte Zuschauer (inkl. Namen, die der Filter erwischen muss)
   -------------------------------------------------------------------------- */
const TestSim = {
  viewers: CONFIG.test.viewers, activity: CONFIG.test.activity, names: [], acc: { chat: 0, like: 0, follow: 0, share: 0, gift: 0 },
  init() {
    const r = mulberry32(2024);
    const a = ['dino', 'rex', 'knack', 'max', 'lena', 'tim', 'mia', 'paul', 'emma', 'leon', 'lia', 'ben', 'sophie', 'noah', 'ella', 'finn', 'luca', 'anna', 'jonas', 'ole', 'klara', 'raptor', 'trici', 'steggi', 'brachi', 'spino', 'ptera', 'ankylo', 'dilo', 'eierkopf', 'schale', 'nest', 'mats', 'jule', 'kai', 'nele', 'tom', 'zoe'];
    const b = ['', '_123', '2010', '_xd', '.de', '_official', '99', '_live', '_fan', '777', '_tv', '.nrw', '_08', 'lein', '_rawr', '.exe', '_2k', '_hh', '_gg', '42'];
    for (let i = 0; i < 520; i++) this.names.push(a[Math.floor(r() * a.length)] + (r() < 0.4 ? a[Math.floor(r() * a.length)] : '') + b[Math.floor(r() * b.length)]);
    const bad = ['fuck_master99', 'h1tl3r_88', 'sch1ampe_xx', 'n4zi_boy', 'p0rnking', 'arschloch2000', 'b1tch.please', 'w1chser_99'];
    [3, 11, 17, 29, 41, 57, 73, 97].forEach((pos, i) => { this.names[pos] = bad[i]; });
  },
  user(i) { return { uid: 'sim' + i, name: this.names[i % this.names.length] }; },
  emit(type, i, extra = {}) {
    const u = this.user(i);
    const ev = Object.assign({ type, uid: u.uid, name: u.name }, extra);
    if (type === 'chat' && ev.text == null && RACE_MODE) ev.text = Race.testText(Users.map.get(u.uid) || { id: u.uid });
    if (type === 'chat' && ev.text == null && MONSTER_MODE) ev.text = Monster.testText();
    if (type === 'chat' && ev.text == null) {
      const usr = Users.map.get(u.uid);
      if (Game.mode === 'duel' && (!usr || !usr.team || Math.random() < 0.08)) ev.text = Math.random() < 0.5 ? '1' : '2';
      else ev.text = pick(['knack!', 'los gehts', 'hallo', '🥚🥚🥚', 'go go go', 'yes', 'wow', 'haha', 'mehr!', 'dino!!']);
    }
    if (type === 'like' && ev.count == null) ev.count = randInt(1, 15);
    if (type === 'gift' && ev.diamonds == null) ev.diamonds = pick([1, 1, 1, 5, 10, 30, 99]);
    EventQueue.push(normalizeEvent(ev));
  },
  manual(k) {
    const i = randInt(0, Math.max(0, Math.min(this.names.length - 1, Math.max(20, Math.round(this.viewers)) - 1)));
    switch (k) {
      case 'C': this.emit('chat', i); break;
      case 'L': this.emit('like', i, { count: 15 }); break;
      case 'F': this.emit('follow', i); break;
      case 'S': this.emit('share', i); break;
      case 'G': this.emit('gift', i, { diamonds: 10 }); break;
      case '1': this.emit('chat', i, RACE_MODE ? {} : { text: '1' }); break;
      case '2': this.emit('chat', i, RACE_MODE ? {} : { text: '2' }); break;
    }
  },
  update(dt) {
    if (!Net.testMode || this.viewers < 1 || now() - Net.bootAt < 2.5) return;
    const act = this.activity / 100, n = Math.round(this.viewers);
    const rates = { chat: 0.045, like: 0.03, follow: 0.0012, share: 0.0006, gift: 0.0004 };
    for (const [type, r] of Object.entries(rates)) {
      this.acc[type] += n * r * act * dt;
      let guard = 0;
      while (this.acc[type] >= 1 && guard++ < 50) { this.acc[type] -= 1; this.emit(type, randInt(0, n - 1)); }
    }
  },
};

/* --------------------------------------------------------------------------
   Start-Bots (nur LIVE mit Bridge, nicht im Testmodus): Solange weniger als
   CONFIG.bots.fill echte Mitspieler da sind, füllen Bots die Höhle auf, damit
   von der ersten Sekunde an etwas passiert. Jeder echte Mitspieler ersetzt nach
   und nach einen Bot (der dienstälteste geht zuerst); wird es später ruhig,
   kommen Bots zurück. Bots heißen sichtbar „Bot …“, kommentieren nur (keine
   Likes/Follows/Shares/Gifts), stehen in keiner Bestenliste, bekommen keine
   Krone, benennen keine Dinos und zählen nicht in der Statistik.
   -------------------------------------------------------------------------- */
const Bots = {
  ids: [], acc: 0, adjAt: 0,
  NAMES: ['Rexi', 'Trixi', 'Steggi', 'Brachi', 'Flitz', 'Anky', 'Paru', 'Spino', 'Ptera', 'Dilo', 'Knacki', 'Krümel', 'Kiesel', 'Funke', 'Glut',
    'Fossil', 'Tropf', 'Zacke', 'Brummi', 'Schuppi', 'Klacker', 'Wackel', 'Pieps', 'Stampf', 'Schnapp', 'Huschi', 'Kralle', 'Knolle', 'Puschel', 'Rumms',
    'Bröckel', 'Lavi', 'Echo', 'Fauchi', 'Grolli', 'Nuggi', 'Schnuffi', 'Tapsi', 'Wumms', 'Zisch'],
  realCount() {
    const lim = gnow() - CONFIG.bots.realWindowSec; let n = 0;
    for (const u of Users.map.values()) if (!u.bot && !u.muted && u.lastActive > 0 && u.lastActive >= lim) n++;
    return n;
  },
  target() { return CONFIG.bots.enabled && !Net.testMode ? clamp(Math.round(CONFIG.bots.fill) - this.realCount(), 0, 40) : 0; },
  update(dt) {
    if (now() - this.adjAt > 1.5) {                          // nach und nach: höchstens ein Bot pro 1,5 s kommt/geht
      this.adjAt = now(); const tgt = this.target();
      if (this.ids.length < tgt) this.add(); else if (this.ids.length > tgt) this.remove();
    }
    if (!this.ids.length || Game.paused) return;
    this.acc += this.ids.length * 0.075 * clamp(CONFIG.bots.activity / 100, 0, 1) * dt;
    let guard = 0;
    while (this.acc >= 1 && guard++ < 20) { this.acc -= 1; this.chat(pick(this.ids)); }
  },
  add() {
    let i = 0; while (this.ids.includes('bot:' + i)) i++;
    const id = 'bot:' + i; this.ids.push(id);
    this.chat(id);                                         // kommt gleich mit einem Treffer ins Bild
  },
  remove() {
    const id = this.ids.shift(), u = Users.map.get(id);
    if (u) { if (u.helper) { u.helper.leave(); u.helper = null; } Users.map.delete(id); }
    Users._activeAt = -9; Game.layoutHelpers();
  },
  chat(id) {
    const i = parseInt(id.slice(4), 10) || 0, u = Users.map.get(id);
    const text = MONSTER_MODE ? (Math.random() < 0.4 ? pick(['pizza', 'keks', 'donut', 'eis', 'burger', 'apfel']) : 'lecker') : RACE_MODE ? (Math.random() < 0.85 ? RACE_COLORS[i % RACE_COLORS.length].key : 'los') : Game.mode === 'duel' && (!u || !u.team) ? (Math.random() < 0.5 ? '1' : '2') : 'knack';
    EventQueue.push(normalizeEvent({ type: 'chat', uid: id, name: 'Bot ' + this.NAMES[i % this.NAMES.length], text }));
  },
};

/* ==========================================================================
   14. StatsLog – pro Stream: Events/Minute, unique Nutzer, Schlüpfzeiten,
       Meteor-Einschläge, Modus. Download als CSV/JSON im Panel.
   ========================================================================== */
const StatsLog = {
  session: null, cur: null, lastMin: 0,
  newBucket() { return { events: 0, chat: 0, like: 0, follow: 0, share: 0, gift: 0, users: new Set() }; },
  init() {
    const all = Store.get(CONFIG.save.logKey, []);
    const last = Array.isArray(all) ? all[all.length - 1] : null;
    if (last && Date.now() - (last.updated || 0) < 30 * 60 * 1000) this.session = last;
    else this.session = { id: new Date().toISOString(), start: Date.now(), updated: Date.now(), minutes: [], events: [], users: 0 };
    this.allUsers = new Set(); this.cur = this.newBucket(); this.lastMin = Date.now();
  },
  count(ev) {
    if (!this.cur) return;
    this.cur.events++; this.cur[ev.type] = (this.cur[ev.type] || 0) + (ev.type === 'like' ? (ev.count || 1) : 1);
    this.cur.users.add(ev.uid); this.allUsers.add(ev.uid);
  },
  mark(kind, data) { this.event(kind, data); },
  event(kind, data) { if (!this.session) return; this.session.events.push(Object.assign({ t: new Date().toISOString(), kind }, data)); if (this.session.events.length > 3000) this.session.events.shift(); },
  tick() {
    if (!this.session || Date.now() - this.lastMin < 60000) return;
    this.lastMin = Date.now();
    const c = this.cur;
    this.session.minutes.push({ t: new Date().toISOString(), events: c.events, chat: c.chat, like: c.like, follow: c.follow, share: c.share, gift: c.gift,
      unique: c.users.size, active: Users.activeCount(), mode: Game.mode, phase: Game.phase, test: Net.testMode ? 1 : 0 });
    if (this.session.minutes.length > 720) this.session.minutes.shift();
    this.session.users = Math.max(this.session.users || 0, this.allUsers.size);
    this.cur = this.newBucket();
    this.persist();
  },
  persist() {
    this.session.updated = Date.now();
    let all = Store.get(CONFIG.save.logKey, []); if (!Array.isArray(all)) all = [];
    const i = all.findIndex(s => s.id === this.session.id);
    if (i >= 0) all[i] = this.session; else all.push(this.session);
    while (all.length > 5) all.shift();
    if (!Store.set(CONFIG.save.logKey, all)) { all = [this.session]; Store.set(CONFIG.save.logKey, all); }
  },
  json() { this.persist(); return JSON.stringify(this.session, null, 1); },
  csv() {
    this.persist();
    const rows = [['typ', 'zeit', 'events', 'kommentare', 'likes', 'follows', 'shares', 'gifts', 'unique_nutzer', 'aktive_nutzer', 'modus', 'phase', 'testmodus', 'details'].join(';')];
    for (const m of this.session.minutes) rows.push(['minute', m.t, m.events, m.chat, m.like, m.follow, m.share, m.gift, m.unique, m.active, m.mode, m.phase, m.test, ''].join(';'));
    for (const e of this.session.events) {
      const det = Object.entries(e).filter(([k]) => !['t', 'kind', 'mode'].includes(k)).map(([k, v]) => k + '=' + v).join(' ');
      rows.push([e.kind, e.t, '', '', '', '', '', '', '', e.active != null ? e.active : '', e.mode || '', '', '', det].join(';'));
    }
    return rows.join('\n');
  },
};

/* ==========================================================================
   13. Host-Panel – lokal (Taste H) oder als eigenes Fenster (?panel).
       Kommunikation: BroadcastChannel (gleicher Browser) + Bridge-Relay
       (z. B. Spiel in OBS-Browserquelle, Panel im Chrome).
   ========================================================================== */
const PanelLink = {
  bc: null, seen: new Set(),
  init() { try { this.bc = new BroadcastChannel('dino-ei-host'); this.bc.onmessage = e => this.onRelay(e.data); } catch (e) { this.bc = null; } },
  post(payload) {
    if (this.bc) { try { this.bc.postMessage(payload); } catch (e) { /* egal */ } }
    Net.send({ type: 'relay', payload });
  },
  dedupe(id) { if (!id) return false; if (this.seen.has(id)) return true; this.seen.add(id); if (this.seen.size > 300) this.seen.delete(this.seen.values().next().value); return false; },
  onRelay(p) {
    if (!p || typeof p !== 'object') return;
    if (IS_PANEL) {
      if (p.kind === 'status') { Panel.status = p.status; Panel.statusAt = now(); }
      else if (p.kind === 'ack' && !this.dedupe(p.id)) Panel.log(p.msg);
      else if (p.kind === 'download' && !this.dedupe(p.id)) downloadFile(p.filename, p.content, p.mime);
    } else if (p.kind === 'cmd' && !this.dedupe(p.id)) {
      const res = Host.command(p.cmd);
      if (res && res.download) this.post({ kind: 'download', id: p.id + 'd', filename: res.download.filename, content: res.download.content, mime: res.download.mime });
      this.post({ kind: 'ack', id: p.id + 'a', msg: res && res.msg ? res.msg : '' });
    }
  },
};

/* Befehle (lokal oder aus dem Panel-Fenster) */
const Host = {
  lastError: '',
  command(cmd) {
    if (!cmd || typeof cmd !== 'object') return null;
    try {
      switch (cmd.c) {
        case 'hotkey': return { msg: MONSTER_MODE ? Monster.hotkey(cmd.k) : RACE_MODE ? Race.hotkey(cmd.k) : Game.hotkey(cmd.k) };
        case 'game': {
          const g = ['monster', 'race', 'egg'].includes(cmd.g) ? cmd.g : 'monster';
          CONFIG.game = g; saveSetting('game', g);
          if (!IS_PANEL && g !== GAME) { saveGame(); const u = new URL(location.href); u.searchParams.delete('spiel'); setTimeout(() => { location.href = u.toString(); }, 400); }
          return { msg: 'Spiel: ' + { monster: 'Monster füttern', race: 'Farb-Rennen', egg: 'Dino-Ei' }[g] + ' – lädt neu …' };
        }
        case 'test': if (!Net.testMode) return { msg: 'Test-Events nur im Testmodus' }; TestSim.manual(cmd.k); return { msg: '' };
        case 'testViewers': TestSim.viewers = clamp(Number(cmd.v) || 0, 0, 500); return { msg: '' };
        case 'testActivity': TestSim.activity = clamp(Number(cmd.v) || 0, 0, 100); return { msg: '' };
        case 'forceTest': Net.forceTest = !!cmd.v; Net.updateTestMode(); return { msg: Net.forceTest ? 'Testmodus erzwungen' : 'Testmodus automatisch' };
        case 'event': return { msg: 'Ereignis: ' + World.randomEvent(cmd.k) };
        case 'set': {
          const def = getPath(CONFIG_DEFAULTS, cmd.path); if (def === undefined) return { msg: 'Unbekannte Einstellung' };
          let v = cmd.value; if (typeof def === 'number') v = Number(v); if (typeof def === 'boolean') v = !!v;
          if (typeof def === 'number' && !isFinite(v)) return { msg: 'Ungültiger Wert' };
          setPath(CONFIG, cmd.path, v); saveSetting(cmd.path, v);
          if (cmd.path.startsWith('audio.')) Sound.applyVolumes();
          if (cmd.path.startsWith('names.')) Users.refilter();
          if (cmd.path === 'race.enabled' && !IS_PANEL && v !== RACE_MODE) { Persist.save(); setTimeout(() => location.reload(), 400); return { msg: v ? 'Farb-Rennen startet …' : 'Ei-Spiel startet …' }; }
          if (cmd.path === 'assets.enabled') { HUD.lexDirty = true; HUD.cta.key = null; HUD.nests = {}; for (const e of Game.eggs) e.retex(); }
          return { msg: '' };
        }
        case 'resetSettings': Store.del(CONFIG.save.settingsKey); for (const k of Object.keys(CONFIG_DEFAULTS)) CONFIG[k] = JSON.parse(JSON.stringify(CONFIG_DEFAULTS[k])); Sound.applyVolumes(); Users.refilter(); return { msg: 'Einstellungen zurückgesetzt' };
        case 'mute': Users.setMuted(cmd.id, !!cmd.v); Persist.save(); return { msg: (cmd.v ? 'Stumm: ' : 'Wieder sichtbar: ') + (Users.map.get(cmd.id) ? Users.map.get(cmd.id).raw : cmd.id) };
        case 'noPic': {
          const u = Users.map.get(cmd.id), nm = u ? u.raw : String(cmd.id);
          if (cmd.v) Persist.noPic[cmd.id] = nm; else delete Persist.noPic[cmd.id];
          Game.boardDirty = true; Persist.save();
          return { msg: (cmd.v ? 'Profilbild ausgeblendet: ' : 'Profilbild wieder an: ') + nm };
        }
        case 'addWord': { const w = String(cmd.w || '').trim().toLowerCase(); if (w.length < 3) return { msg: 'Wort zu kurz (min. 3 Zeichen)' }; const list = CONFIG.filter.extraWords.slice(); if (!list.includes(w)) list.push(w); CONFIG.filter.extraWords = list; saveSetting('filter.extraWords', list); Users.refilter(); Game.boardDirty = true; return { msg: 'Filterwort hinzugefügt' }; }
        case 'removeWord': { const list = CONFIG.filter.extraWords.filter(x => x !== cmd.w); CONFIG.filter.extraWords = list; saveSetting('filter.extraWords', list); Users.refilter(); return { msg: 'Filterwort entfernt' }; }
        case 'export': return { msg: 'Export erstellt', download: { filename: `dino-ei-spielstand-${todayStr()}.json`, content: Persist.exportJSON(), mime: 'application/json' } };
        case 'import': Persist.importJSON(cmd.data); return { msg: 'Import erfolgreich' };
        case 'log': return { msg: 'Log erstellt', download: cmd.fmt === 'csv' ? { filename: `dino-ei-log-${todayStr()}.csv`, content: '﻿' + StatsLog.csv(), mime: 'text/csv' } : { filename: `dino-ei-log-${todayStr()}.json`, content: StatsLog.json(), mime: 'application/json' } };
        case 'resetAll':
          if (MONSTER_MODE) { Monster.reset(); return { msg: 'Monster-Statistik zurückgesetzt' }; }
          if (RACE_MODE) { Race.reset(); return { msg: 'Rennen-Statistik zurückgesetzt' }; }
          Store.del(CONFIG.save.key); World.herd = []; Board.today = { date: todayStr(), map: {} }; Board.all = {}; Coll.users = {}; Coll.lexikon = {}; Coll.firsts = {};
          Game.totals = { eggs: 0, hatches: 0, impacts: 0 }; Game.hatchTimes = []; Game.eggNumber = 0; HUD.lexDirty = true; Game.boardDirty = true; Game.resetRound(); Persist.save();
          return { msg: 'Alles zurückgesetzt' };
      }
    } catch (e) { console.error(e); return { msg: 'Fehler: ' + e.message }; }
    return null;
  },
  status() {
    const e = Game.eggs;
    return {
      bridge: Net.state, tiktok: Net.tiktok, testMode: Net.testMode, forceTest: Net.forceTest, everConnected: Net.everConnected,
      active: Users.activeCount(), bots: Bots.ids.length, ipm: Host.ipm(), timeLeft: Game.phase === 'play' ? Game.timeLeft : null, mode: Game.mode, phase: Game.phase,
      paused: Game.paused, muted: Sound.muted, audioReady: Sound.ready, eggNumber: Game.eggNumber, next: Game.peekNextMode(),
      game: GAME,
      monster: MONSTER_MODE ? { no: Monster.no, level: Monster.level, xp: Math.round(Monster.xp * 10) / 10, need: Monster.need, hunger: Math.round(Monster.hunger * 100), sleeping: Monster.sleeping, vote: !!Monster.vote, party: Monster.party > 0, fav: FOODS[Monster.fav.key].name } : null,

      eggs: e.map(x => ({ team: x.team, hp: Math.round(x.hp * 10) / 10, maxHp: x.maxHp, p: Math.round(x.progress * 100) })),
      helpers: Game.helpers.length, herd: World.herd.length, queue: EventQueue.q.length, fps: Math.round(Loop.fps),
      totals: Game.totals, avgHatch: Game.hatchTimes.length ? Math.round(Game.hatchTimes.reduce((a, b) => a + b, 0) / Game.hatchTimes.length) : null,
      testViewers: TestSim.viewers, testActivity: TestSim.activity, hype: { value: Math.round(Hype.value * 100), active: Math.ceil(Hype.active), cooldown: Math.ceil(Hype.cooldown) }, mission: Missions.active ? { label: Missions.active.label, got: Missions.active.got, target: Missions.active.target, left: Math.ceil(Missions.active.dur - Missions.active.t) } : null, config: CONFIG, storeOk: Store.ok, error: Host.lastError,
      users: Users.recent(30).map(u => ({ id: u.id, raw: u.raw, name: u.name, filtered: u.filtered, muted: u.muted, pic: !!u.hasAvatar || (Net.testMode && String(u.id).startsWith('sim')), noPic: Persist.isNoPic(u.id) })),
      mutedList: Object.entries(Persist.muted).map(([id, n]) => ({ id, raw: n })),
    };
  },
  _ipm: [], ipm() {
    const t = now(); while (this._ipm.length && this._ipm[0] < t - 60) this._ipm.shift();
    return this._ipm.length;
  },
};

const Panel = {
  open: false, status: null, statusAt: -99, el: null, inputs: {}, logLines: [], hoverUsers: false,
  send(cmd) {
    if (IS_PANEL) { const id = Math.random().toString(36).slice(2); PanelLink.post({ kind: 'cmd', id, cmd }); return; }
    const res = Host.command(cmd);
    if (res && res.download) downloadFile(res.download.filename, res.download.content, res.download.mime);

  },
  log(msg) { if (!msg) return; this.logLines.unshift(new Date().toLocaleTimeString() + '  ' + msg); this.logLines = this.logLines.slice(0, 6); const l = this.el && this.el.querySelector('#pLog'); if (l) l.textContent = this.logLines.join('\n'); },

    h.push('<h2>Steuerung</h2><div class="btns">' +
      [['B', 'Boss-Ei als Nächstes'], ['D', 'Duell als Nächstes'], ['E', 'Zufallsereignis'], ['P', 'Pause-Screen'], ['M', 'Ton an/aus'], ['R', 'Ei neu starten'], ['N', '🎯 Mission starten'], ['X', '🔥 Hype starten']]

    for (const [title, items] of SETTINGS_UI) {
      h.push(`<div class="hint" style="margin-top:10px;color:#ffe680">${title}</div>`);

    h.push('<h2>Moderation</h2><div class="hint">Kommentartexte werden nie angezeigt. Stummgeschaltete zählen weiter, werden aber nirgends eingeblendet. „Bild aus“ blendet nur das Profilbild aus (Name bleibt). Profilbilder werden nicht automatisch geprüft – im Zweifel oben in „Anzeige“ ganz ausschalten.</div>');

    h.push('<div class="hint">Eigenes Filterwort (Namen mit diesem Wortteil → „Anonymer Knacker“):</div><div style="display:flex;gap:6px"><input type="text" id="pWord" placeholder="z. B. spam"><button data-act="addWord">+</button></div><div class="hint" id="pWords"></div>');
    h.push('<h2>Daten & Statistik</h2><div class="btns">' +
      '<button data-act="export">⬇️ Spielstand (JSON)</button><button data-act="import">⬆️ Import (JSON)</button><button data-act="logcsv">📊 Log (CSV)</button>' +
      '<button data-act="logjson">📊 Log (JSON)</button><button data-act="resetAll" class="danger">Alles zurücksetzen</button></div><input type="file" id="pFile" accept=".json,application/json" style="display:none">');
    h.push('<div class="hint" id="pTotals" style="margin-top:8px"></div>');
    h.push('<div class="hint" style="margin-top:14px">Tasten: <b>H</b> Panel · <b>B</b> Boss · <b>D</b> Duell · <b>E</b> Ereignis · <b>P</b> Pause · <b>M</b> Ton · <b>R</b> Ei neu · <b>N</b> Mission · <b>X</b> Hype · Test: <b>C L F S G 1 2</b></div>');
    el.innerHTML = h.join('');
    // Ereignisse (Delegation)
    el.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      Sound.resume();
      if (b.dataset.game) this.send({ c: 'game', g: b.dataset.game });
      else if (b.dataset.hot) this.send({ c: 'hotkey', k: b.dataset.hot });
      else if (b.dataset.ev) this.send({ c: 'event', k: b.dataset.ev });
      else if (b.dataset.test) this.send({ c: 'test', k: b.dataset.test });
      else if (b.dataset.bool) { const cur = this.status ? getPath(this.status.config, b.dataset.bool) : getPath(CONFIG, b.dataset.bool); this.send({ c: 'set', path: b.dataset.bool, value: !cur }); }
      else if (b.dataset.mute) this.send({ c: 'mute', id: b.dataset.mute, v: b.dataset.v === '1' });
      else if (b.dataset.nopic) this.send({ c: 'noPic', id: b.dataset.nopic, v: b.dataset.v === '1' });
      else if (b.dataset.word) this.send({ c: 'removeWord', w: b.dataset.word });
      else switch (b.dataset.act) {
        case 'close': this.toggle(); break;
        case 'window': window.open(location.pathname + (location.search ? location.search + '&' : '?') + 'panel', 'dinoEiPanel', 'width=520,height=900'); break;
        case 'force': this.send({ c: 'forceTest', v: !(this.status && this.status.forceTest) }); break;
        case 'resetSettings': if (confirm('Alle Einstellungen auf Standard zurücksetzen?')) this.send({ c: 'resetSettings' }); break;
        case 'addWord': { const i = el.querySelector('#pWord'); this.send({ c: 'addWord', w: i.value }); i.value = ''; break; }
        case 'export': this.send({ c: 'export' }); break;
        case 'import': el.querySelector('#pFile').click(); break;
        case 'logcsv': this.send({ c: 'log', fmt: 'csv' }); break;
        case 'logjson': this.send({ c: 'log', fmt: 'json' }); break;
        case 'resetAll': if (confirm('Wirklich ALLES zurücksetzen? Herde, Bestenlisten und Sammlungen werden gelöscht (vorher exportieren!).')) this.send({ c: 'resetAll' }); break;
      }
    });
    el.addEventListener('input', e => {
      const t = e.target;
      if (t.dataset.cfg) { this.send({ c: 'set', path: t.dataset.cfg, value: Number(t.value) }); const v = el.querySelector('#' + t.id + '_v'); if (v) v.textContent = t.value; }
      else if (t.id === 'tViewers') { this.send({ c: 'testViewers', v: t.value }); el.querySelector('#tViewersV').textContent = t.value; }
      else if (t.id === 'tAct') { this.send({ c: 'testActivity', v: t.value }); el.querySelector('#tActV').textContent = t.value; }
    });
    el.querySelector('#pFile').addEventListener('change', e => {
      const f = e.target.files[0]; if (!f) return;
      const r = new FileReader(); r.onload = () => this.send({ c: 'import', data: String(r.result) }); r.readAsText(f); e.target.value = '';
    });
    el.querySelector('#pWord').addEventListener('keydown', e => { if (e.key === 'Enter') { this.send({ c: 'addWord', w: e.target.value }); e.target.value = ''; } });
    const ul = el.querySelector('#pUsers'); ul.addEventListener('mouseenter', () => { this.hoverUsers = true; }); ul.addEventListener('mouseleave', () => { this.hoverUsers = false; });
  },
  stat(k, v, cls) { const s = this.el.querySelector('#s_' + k); if (!s) return; s.querySelector('.v').textContent = v; s.className = 'stat' + (cls ? ' ' + cls : ''); },
  update() {
    if (!this.el) return;
    if (!IS_PANEL) { if (!this.open) return; this.status = Host.status(); this.statusAt = now(); }
    const S = this.status, el = this.el;
    const warn = el.querySelector('#pWarn');
    if (IS_PANEL && (!S || now() - this.statusAt > 4)) {
      warn.style.display = 'block'; warn.textContent = 'Kein Spiel gefunden. Öffne das Spiel im selben Browser (gleiche Adresse) oder starte die Bridge – dann verbindet sich das Panel automatisch.';
      if (!S) return;
    } else if (!IS_PANEL && this.overlaying) { warn.style.display = 'block'; warn.textContent = '⚠️ Das Panel liegt über dem Spielbild und wäre im Stream sichtbar! Fenster breiter ziehen oder „Panel in eigenem Fenster öffnen“.'; }
    else warn.style.display = 'none';
    const bridgeTxt = { connected: 'verbunden', connecting: 'verbinde…', offline: 'nein' }[S.bridge] || S.bridge;
    this.stat('bridge', bridgeTxt, S.bridge === 'connected' ? 'ok' : S.everConnected ? 'bad' : 'mid');
    const tk = S.tiktok || {};
    this.stat('tiktok', tk.status || '–', tk.status === 'verbunden' ? 'ok' : (tk.status === 'keine Bridge' ? 'mid' : 'bad'));
    this.stat('active', S.bots ? `${S.active} (${S.bots} Bots)` : String(S.active));
    this.stat('ipm', String(S.ipm));
    for (const b of el.querySelectorAll('[data-game]')) b.classList.toggle('on', b.dataset.game === S.game);
    if (S.monster) {
      const MS = S.monster;
      this.stat('time', `Hunger ${100 - MS.hunger} %`, MS.hunger < 22 ? 'bad' : '');
      this.stat('mode', 'Monster füttern' + (S.paused ? ' ⏸' : ''), S.paused ? 'mid' : '');
      this.stat('hp', `Level ${MS.level} · ${Math.min(100, Math.floor(MS.xp / Math.max(1, MS.need) * 100))} %`);
      this.stat('next', `Monster #${MS.no}`);
      el.querySelector('#pInfo').textContent = `Monster #${MS.no} · Level ${MS.level} · ${MS.xp}/${MS.need} XP · Lieblingsessen: ${MS.fav}` + (MS.sleeping ? ' · 💤 schläft' : '') + (MS.party ? ' · 🎉 Party' : '') + (MS.vote ? ' · 🗳️ Farbwahl' : '') + (S.hype && S.hype.active ? ` · 🔥 FRESSRAUSCH ${S.hype.active} s` : '') + ` · ${S.muted ? '🔇 Ton aus' : (S.audioReady ? '🔊 Ton an' : '🔇 Ton noch gesperrt (einmal ins Spiel klicken)')} · ${S.fps} fps` + (tk.message ? ` · TikTok: ${tk.message}` : '') + (S.error ? ' · Fehler: ' + S.error.slice(0, 120) : '');
    } else if (S.race) {
      const RS = S.race, lead = RS.lead >= 0 ? RACE_COLORS[RS.lead].name : '–';
      this.stat('time', RS.timeLeft != null ? fmtTime(RS.timeLeft) : '–', RS.timeLeft != null && RS.timeLeft < 10 ? 'bad' : '');
      this.stat('mode', 'Farb-Rennen' + (S.paused ? ' ⏸' : ''), S.paused ? 'mid' : '');
      this.stat('hp', `Ziel ${RS.dist} · vorn: ${lead}`);
      this.stat('next', `Rennen #${RS.no}`);
      el.querySelector('#pInfo').textContent = `Rennen #${RS.no} · ${{ start: 'Countdown', race: 'läuft', finish: 'Sieger' }[RS.phase] || RS.phase} · Punkte: ` + RACE_COLORS.map((C, i) => `${C.name} ${RS.scores[i]}`).join(' · ') + ` · ${S.muted ? '🔇 Ton aus' : (S.audioReady ? '🔊 Ton an' : '🔇 Ton noch gesperrt (einmal ins Spiel klicken)')} · ${S.fps} fps` + (tk.message ? ` · TikTok: ${tk.message}` : '') + (S.error ? ' · Fehler: ' + S.error.slice(0, 120) : '');
    } else {
    this.stat('time', S.timeLeft != null ? fmtTime(S.timeLeft) : '–', S.timeLeft != null && S.timeLeft < 30 ? 'bad' : '');
    const modeName = { normal: 'Normal', boss: 'Boss-Ei', duel: 'Ei-Duell' };
    const phaseName = { intro: 'Ansage', play: 'läuft', hatch: 'schlüpft', reveal: 'Karte', impact: 'Einschlag', boot: '…' };

/* Belebung der Rennstrecke: Vulkanrauch, Pollen in der Sonne, Flugsaurier-Silhouetten */
const RaceAmbient = {
  smokeT: 0, pollen: [], flyers: [], nextFly: 12,
  update(dt) {
    this.smokeT -= dt;
    if (this.smokeT <= 0) { this.smokeT = 0.5; FX.spawn({ type: 'blob', layer: 0, x: 712 + rand(-8, 8), y: 150, vx: rand(4, 14), vy: rand(-30, -18), size: rand(14, 22), grow: 10, life: rand(5, 7), alpha: 0.45, color: '#e9dfe6', fadeIn: 0.6 }); }
    if (this.pollen.length < 40) this.pollen.push({ x: rand(0, 1080), y: rand(300, 1500), vx: rand(-8, 8), vy: rand(-10, -3), p: rand(0, TAU), s: rand(1.5, 3), life: rand(8, 16), t: 0 });
    for (const p of this.pollen) { p.t += dt; p.x += (p.vx + Math.sin(p.t * 0.8 + p.p) * 6) * dt; p.y += p.vy * dt; }
    this.pollen = this.pollen.filter(p => p.t < p.life);
    this.nextFly -= dt; if (this.nextFly <= 0) { this.nextFly = rand(18, 35); this.flyby(); }
    for (const f of this.flyers) { f.x += f.vx * dt; f.t += dt; }
    this.flyers = this.flyers.filter(f => f.x > -200 && f.x < 1280);
  },
  flyby() {
    const dir = Math.random() < 0.5 ? 1 : -1, y = rand(380, 520), n = randInt(1, 3);
    for (let i = 0; i < n; i++) this.flyers.push({ x: dir > 0 ? -90 - i * 80 : 1170 + i * 80, y: y + i * 26, vx: dir * rand(90, 120), t: rand(0, 5), s: rand(0.45, 0.65) });
  },
  draw(ctx) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (const p of this.pollen) { const a = Math.sin(clamp(p.t / p.life, 0, 1) * Math.PI) * (0.35 + 0.25 * Math.sin(p.t * 2 + p.p)); ctx.globalAlpha = a; ctx.fillStyle = '#fff6d0'; ctx.fillRect(p.x, p.y, p.s, p.s); }
    ctx.restore();
    if (!this.flyers.length || !DinoArt.has('pteranodon')) return;
    if (!this.sil) { const src = DinoArt.sprite('pteranodon', 'common', 0, 110), c = SpriteCache.canvas(src.width, src.height), g = c.getContext('2d'); g.drawImage(src, 0, 0); g.globalCompositeOperation = 'source-atop'; g.fillStyle = 'rgba(60,70,90,0.55)'; g.fillRect(0, 0, c.width, c.height); this.sil = c; }
    for (const f of this.flyers) {
      const flap = 0.7 + 0.3 * Math.sin(f.t * 7);
      ctx.save(); ctx.translate(f.x, f.y); ctx.scale((f.vx > 0 ? 1 : -1) * f.s, f.s * flap); ctx.globalAlpha = 0.85;
      ctx.drawImage(this.sil, -this.sil.width / 2, -this.sil.height / 2); ctx.restore();
    }
  },
};

const FOODS = {
  candy:    { name: 'Bonbon', words: ['bonbon', 'süßigkeit', 'candy', 'lolli'], emo: ['🍬', '🍭'], size: 76 },
  cookie:   { name: 'Keks',   words: ['keks', 'kekse', 'cookie', 'cookies'], emo: ['🍪'], size: 88 },
  apple:    { name: 'Apfel',  words: ['apfel', 'äpfel', 'apple', 'obst'], emo: ['🍎', '🍏'], size: 84 },
  donut:    { name: 'Donut',  words: ['donut', 'donuts', 'doughnut', 'krapfen'], emo: ['🍩'], size: 90 },
  burger:   { name: 'Burger', words: ['burger', 'hamburger', 'cheeseburger'], emo: ['🍔'], size: 112 },
  pizza:    { name: 'Pizza',  words: ['pizza', 'pizzen'], emo: ['🍕'], size: 104 },
  icecream: { name: 'Eis',    words: ['eis', 'eiscreme', 'icecream', 'gelato'], emo: ['🍦', '🍨', '🍧'], size: 96 },
  cake:     { name: 'Kuchen', words: ['kuchen', 'torte', 'cake'], emo: ['🎂', '🍰', '🧁'], size: 140 },

function parseFood(text) {
  if (!text) return null;

  fed: ['Lecker!', 'Mehr!', 'Mmmh!', 'Nom nom nom!', 'Danke!', 'Jammi!'],

/* ---- Farb-Helfer (Monster umfärben) ---- */
function rgb2hsl(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2;

  return [h * 60, s, l];

  return [f(h + 1 / 3) * 255, f(h) * 255, f(h - 1 / 3) * 255];

const MONSTER_POSES = ['idle', 'blink', 'open', 'chew', 'chew2', 'yum', 'happy', 'wow', 'hungry', 'sleep', 'burp', 'crouch', 'grow', 'dance'];
const MonsterArt = {
  cache: new Map(),
  has() { return Assets.has('monster_idle'); },
  /* Bild einer Pose in Höhe h (in 8-px-Stufen gecacht), optional umgefärbt: nur der grüne Körper,

  frame(pose, h, tintKey) {
    const hb = Math.max(40, Math.round(h / 8) * 8), key = pose + '|' + hb + '|' + (tintKey || '-');
    let c = this.cache.get(key); if (c) return c;
    const im = Assets.get('monster_' + pose) || Assets.get('monster_idle');
    c = Assets.scaled(im, hb * im.naturalWidth / im.naturalHeight, hb);
    const C = tintKey && RACE_COLORS.find(x => x.key === tintKey);
    if (C) {
      const g = c.getContext('2d'), [th, ts] = rgb2hsl(...hexToRgb(C.col));

          if (d[i + 3] < 8) continue;
          const [hh, s, l] = rgb2hsl(d[i], d[i + 1], d[i + 2]);
          if (s < 0.18 || hh < 55 || hh > 175) continue;                 // nur Grüntöne

  },
  food(key, size) {

    this.cache.set(k, c); return c;
  },

const Monster = {

        this.need = Math.max(Math.ceil(this.xp + 2), Math.round(clamp(tg, this.need * 0.85, this.need * 1.4)));

      // Wachstums-Ablauf: ducken → wachsen → jubeln
      if (this.lvl) {
        const L = this.lvl; L.t += dt;
        if (L.phase === 'crouch' && L.t >= 0.55) {
          this.xp = Math.max(0, this.xp - this.need); this.level++; this.best = Math.max(this.best, this.level);
          this.need = this.targetNeed(); this.fromH = this.dispH; this.toH = this.targetH(this.level); this.growT = 0;
          L.phase = 'grow'; L.t = 0;
          Game.callout(`LEVEL ${this.level}!`, { color: '#ffffff', font: 'uiHeavy', x: CONFIG.layout.centerX, y: Math.max(600, this.GY - this.toH - 40), size: 86, life: 2.0 });
          Sound.hatch('epic'); Game.flash = 0.45; Game.flashColor = '#efffe0'; Game.shake = Math.min(1, Game.shake + 0.5);
          if (Math.random() < 0.6) this.say(pick(MONSTER_LINES.level));
        } else if (L.phase === 'grow' && L.t >= 1.15) {
          L.phase = 'cheer'; L.t = 0; this.happyT = 1.4;
          for (let i = 0; i < 50; i++) FX.spawn({ type: 'confetti', layer: 2, x: this.X + rand(-200, 200), y: this.GY - this.dispH - 20, vx: rand(-420, 420), vy: rand(-800, -300), g: 900, drag: 1.2, size: rand(6, 10), rot: rand(0, TAU), vr: rand(-8, 8), life: rand(1.5, 2.3), color: pick(['#9cf08a', '#ffd84a', '#ff7fb0', '#5cc8ff']) });
        } else if (L.phase === 'cheer' && L.t >= 1.3) {
          this.lvl = null; this.save();
          if (this.xp >= this.need) this.levelUp();
        }
      }
      if (this.growT >= 0) {
        this.growT += dt; const k = clamp(this.growT / 1.0, 0, 1);
        const el = k >= 1 ? 1 : 1 - Math.pow(2, -9 * k) * Math.cos(k * 14);      // federnd
        this.dispH = lerp(this.fromH, this.toH, el);
        if (Math.random() < dt * 40) { const a = rand(0, TAU), r = this.dispH * 0.55; FX.spawn({ type: 'star', layer: 2, x: this.X + Math.cos(a) * r, y: this.GY - this.dispH * 0.5 + Math.sin(a) * r * 0.6, vx: -Math.sin(a) * 160, vy: Math.cos(a) * 90 - 40, size: rand(7, 13), rot: 0, vr: rand(-4, 4), life: 0.9, color: pick(['#ffffff', '#efffc0', '#9cf08a']) }); }
        if (k >= 1) { this.growT = -1; this.dispH = this.toH; }
      }
      // Party → Abstimmung → neues Baby
      if (this.party > 0) {
        this.party -= dt; this.confT -= dt;
        if (this.confT <= 0) { this.confT = 0.7; for (let i = 0; i < 26; i++) FX.spawn({ type: 'confetti', layer: 2, x: rand(100, 860), y: -20, vx: rand(-80, 80), vy: rand(100, 300), g: 300, drag: 0.6, size: rand(6, 10), rot: rand(0, TAU), vr: rand(-8, 8), life: rand(2.5, 3.5), color: pick(['#9cf08a', '#ffd84a', '#ff7fb0', '#5cc8ff', '#b98bff']) }); }
        if (this.party <= 0) { this.party = 0; this.startVote(); }
      }
      if (this.vote) { this.vote.t += dt; if (this.vote.t >= this.vote.dur) this.endVote(); }
      if (this.hatchT >= 0) { this.hatchT += dt; if (this.hatchT > 1) this.hatchT = -1; }
      if (now() - this.saveAt > CONFIG.save.everySec) { this.saveAt = now(); this.save(); }
    }
    // Essen fliegt
    for (const f of this.foods) { f.t += dt; f.rot += f.vr * dt; }
    if (this.foods.some(f => f.t >= f.dur)) { for (const f of this.foods) if (f.t >= f.dur) this.arrive(f); this.foods = this.foods.filter(f => f.t < f.dur); }
    // Mimik-Zeiten
    const was = this.chewT;
    this.chewT = Math.max(0, this.chewT - dt); this.yumT = Math.max(0, this.yumT - dt); this.happyT = Math.max(0, this.happyT - dt);
    this.wowT = Math.max(0, this.wowT - dt); this.burpT = Math.max(0, this.burpT - dt); this.bite = Math.max(0, this.bite - dt * 5);
    if (was > 0 && this.chewT <= 0 && !this.incoming()) {
      if (this.burpPending) { this.burpPending = false; this.burpT = 1.0; Sound.burp(); const [mx, my] = this.mouth(); for (let i = 0; i < 8; i++) FX.spawn({ type: 'blob', layer: 2, x: mx + rand(-20, 20), y: my, vx: rand(40, 140), vy: rand(-90, -30), size: rand(16, 26), grow: 30, life: 1.1, color: '#d8f5c8', alpha: 0.6 }); Game.pops.push({ text: '*rülps*', x: mx + 120, y: my - 30, t: 0, life: 1.2, color: '#d8f5c8', size: 38, font: 'title' }); }
      else if (Math.random() < 0.5) this.yumT = 0.7;
    }
    this.blinkT = Math.max(0, this.blinkT - dt); this.nextBlink -= dt;
    if (this.nextBlink <= 0) { this.nextBlink = rand(2.5, 5.5); this.blinkT = 0.14; }
    this.vh -= 1800 * dt; this.hop = Math.max(0, this.hop + this.vh * dt); if (this.hop <= 0) this.vh = 0;
    if ((this.happyT > 0 || this.party > 0) && this.hop <= 0 && Math.random() < dt * 3) this.vh = rand(260, 380);
    if (this.sleeping) { this.zzzT -= dt; if (this.zzzT <= 0) { this.zzzT = 1.1; Game.pops.push({ text: 'Z', x: this.X + this.dispH * 0.3, y: this.GY - this.dispH * 0.9, t: 0, life: 2, color: '#e8f0ff', size: 44, font: 'title' }); } }
    if (this.bubble) { this.bubble.t += dt; if (this.bubble.t > this.bubble.life) this.bubble = null; }
    // Begrüßungen bündeln
    if (this.greetBuf.length && now() - this.greetAt > 1.4) {
      this.greetAt = now(); const u = this.greetBuf[0];
      Game.toast(this.greetBuf.length === 1 ? `${u.name} füttert mit!` : `${u.name} und ${this.greetBuf.length - 1} weitere füttern mit!`, { icon: '👋', prio: 1, life: 2.4, u });
      this.greetBuf = [];
    }
    // gemeinsame Effekte
    for (const c of Game.callouts) c.t += dt;
    Game.callouts = Game.callouts.filter(c => c.t < c.life);
    for (const p of Game.pops) p.t += dt;
    Game.pops = Game.pops.filter(p => p.t < p.life);
    for (const t of Game.toasts) t.t += dt;
    Game.toasts = Game.toasts.filter(t => t.t < t.life);
    while (Game.toasts.length < 1 && Game.toastQueue.length) {
      const t = Game.toastQueue.shift(); t.t = 0;
      if (Game.toastQueue.length >= 3) t.life = Math.min(t.life, 2.0); else if (Game.toastQueue.length >= 1) t.life = Math.min(t.life, 2.6);
      Game.toasts.push(t); if (t.prio >= 2) Sound.chime(t.prio >= 3);
    }
    Game.shake = Math.max(0, Game.shake - dt * 1.6);
    Game.flash = Math.max(0, Game.flash - dt * 1.8);
    MonsterAmbient.update(dt);
  },
  incoming() { return this.foods.some(f => f.dur - f.t < 0.42); },
  pose() {
    if (this.hatchT >= 0 && this.hatchT < 0.5) return 'wow';
    if (this.lvl) return this.lvl.phase === 'crouch' ? 'crouch' : this.lvl.phase === 'grow' ? 'grow' : 'happy';
    if (this.party > 0) return Math.floor(this.party / 0.35) % 2 ? 'dance' : 'happy';
    if (this.vote) return this.incoming() ? 'open' : this.chewT > 0 ? (Math.floor(this.chewT / 0.15) % 2 ? 'chew' : 'chew2') : 'happy';
    if (this.wowT > 0) return 'wow';
    if (this.burpT > 0) return 'burp';
    if (this.incoming() || Hype.active > 0) return 'open';
    if (this.chewT > 0) return Math.floor(this.chewT / 0.15) % 2 ? 'chew' : 'chew2';
    if (this.yumT > 0) return 'yum';
    if (this.happyT > 0) return 'happy';
    if (this.sleeping) return 'sleep';
    if (this.hunger < 0.22) return 'hungry';
    if (this.blinkT > 0) return 'blink';
    return 'idle';
  },

  /* ---------- Host ---------- */
  hotkey(k) {
    switch (k) {
      case 'P': Game.paused = !Game.paused; Sound.paused = Game.paused; return Game.paused ? 'Pause an' : 'Pause aus';
      case 'M': Sound.setMuted(!Sound.muted); return Sound.muted ? 'Ton aus' : 'Ton an';
      case 'X': return Hype.start() ? 'Fressrausch gestartet' : 'Fressrausch gerade nicht möglich';
      case 'E': for (let i = 0; i < 14; i++) this.throwFood(pick(FOOD_KEYS), 0, null, 'rain'); return 'Essensregen';
      case 'R': this.level = 1; this.xp = 0; this.need = this.targetNeed(); this.dispH = this.toH = this.targetH(1); this.lvl = null; this.party = 0; this.vote = null; this.cur = new Map(); this.boardDirty = true; this.save(); return 'Monster zurück auf Level 1';
      case 'N': if (this.level < CONFIG.monster.maxLevel) { this.xp = this.need; if (!this.lvl) this.levelUp(); return 'Level-Up!'; } this.startParty(); return 'Party!';
    }
    return 'Im Monster-Spiel nicht verfügbar';
  },
  reset() { this.fans = { date: todayStr(), today: {}, all: {} }; this.no = 0; this.newMonster('gruen'); this.save(); },
  testText() {
    if (this.vote && Math.random() < 0.7) { const C = pick(RACE_COLORS); return C.key === 'gruen' ? 'grün' : C.key; }
    const r = Math.random();
    if (r < 0.35) { const F = FOODS[pick(FOOD_KEYS)]; return Math.random() < 0.5 ? F.words[0] : F.emo[0]; }
    return pick(['lecker', 'hallo', 'so süß', 'mehr!', 'feed the monster', 'hihi', '😍']);
  },
};

/* Belebung: Pollen in der Sonne, Herzchen steigen aus der Wiese */
const MonsterAmbient = {
  pollen: [],
  update(dt) {
    if (this.pollen.length < 46) this.pollen.push({ x: rand(0, 1080), y: rand(250, 1600), vx: rand(-8, 8), vy: rand(-12, -4), p: rand(0, TAU), s: rand(1.6, 3.2), life: rand(8, 16), t: 0, heart: Math.random() < 0.12 });
    for (const p of this.pollen) { p.t += dt; p.x += (p.vx + Math.sin(p.t * 0.8 + p.p) * 7) * dt; p.y += p.vy * dt * (p.heart ? 3 : 1); }
    this.pollen = this.pollen.filter(p => p.t < p.life);
  },
  draw(ctx) {
    ctx.save();
    for (const p of this.pollen) {
      const a = Math.sin(clamp(p.t / p.life, 0, 1) * Math.PI) * (0.4 + 0.25 * Math.sin(p.t * 2 + p.p));
      if (p.heart) { ctx.globalAlpha = a * 0.55; ctx.save(); ctx.translate(p.x, p.y); ctx.scale(0.5, 0.5); ctx.beginPath(); ctx.moveTo(0, 7); ctx.bezierCurveTo(-24, -8, -11, -26, 0, -12); ctx.bezierCurveTo(11, -26, 24, -8, 0, 7); ctx.fillStyle = '#ff9fc8'; ctx.fill(); ctx.restore(); }
      else { ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = a; ctx.fillStyle = '#fffbe0'; ctx.fillRect(p.x, p.y, p.s, p.s); ctx.globalCompositeOperation = 'source-over'; }
    }
    ctx.restore();
  },
};

/* ---------- Apple-„Liquid Glass“: Milchglas (verschwommener Hintergrund), Lichtkante, weicher Schatten ---------- */
const LiquidGlass = {
  P: 40, cache: new Map(), blurSrc: null, blurImg: null,
  INK: '#1d1d1f', SUB: 'rgba(60,60,67,0.72)', GREEN: '#34c759', ORANGE: '#ff9500', PINK: '#ff2d55', GOLD: '#ffcc00',
  /* Hintergrund einmal weichzeichnen (Canvas-Filter, sonst klein- und wieder großrechnen) */
  blurred(img) {
    if (this.blurSrc === img && this.blurImg) return this.blurImg;
    const c = Mat.cv(1080, 1920), g = c.getContext('2d');
    if (typeof g.filter === 'string') { g.filter = 'blur(28px) saturate(1.45)'; g.drawImage(img, -70, -70, 1220, 2060); g.filter = 'none'; }
    else {
      const s = Mat.cv(90, 160), sg = s.getContext('2d'); sg.imageSmoothingQuality = 'high'; sg.drawImage(img, 0, 0, 90, 160);
      const m = Mat.cv(270, 480), mg = m.getContext('2d'); mg.imageSmoothingQuality = 'high'; mg.drawImage(s, 0, 0, 270, 480);
      g.imageSmoothingQuality = 'high'; g.drawImage(m, 0, 0, 1080, 1920);
    }
    this.blurSrc = img; this.blurImg = c; this.cache.clear();
    return c;
  },
  panel(x, y, w, h, r, o = {}) {
    const bg = Assets.get(o.bgKey || 'bgMonster');
    const key = [x, y, w, h, r, o.tint || '', bg ? 1 : 0].join('|');
    let c = this.cache.get(key); if (c) return c;
    const P = this.P; c = Mat.cv(w + P * 2, h + P * 2); const g = c.getContext('2d');
    const path = (ins = 0) => { g.beginPath(); rr(g, P + ins, P + ins, w - ins * 2, h - ins * 2, Math.max(2, r - ins)); };
    g.save(); g.shadowColor = 'rgba(25,35,70,0.24)'; g.shadowBlur = 34; g.shadowOffsetY = 12; path(); g.fillStyle = '#eef2f6'; g.fill(); g.restore();
    g.save(); path(); g.clip();
    if (bg) g.drawImage(this.blurred(bg), P - x, P - y); else { g.fillStyle = '#e4ecf4'; g.fillRect(P, P, w, h); }
    g.fillStyle = o.tint || 'rgba(255,255,255,0.36)'; g.fillRect(P, P, w, h);
    const sheen = g.createLinearGradient(0, P, 0, P + h); sheen.addColorStop(0, 'rgba(255,255,255,0.30)'); sheen.addColorStop(0.5, 'rgba(255,255,255,0.02)'); sheen.addColorStop(1, 'rgba(255,255,255,0.14)');
    g.fillStyle = sheen; g.fillRect(P, P, w, h);
    const spec = g.createRadialGradient(P + w * 0.16, P, 0, P + w * 0.16, P, Math.max(w, h) * 0.6); spec.addColorStop(0, 'rgba(255,255,255,0.38)'); spec.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = spec; g.fillRect(P, P, w, h);
    const rim = g.createLinearGradient(0, P, 0, P + h); rim.addColorStop(0, 'rgba(255,255,255,0.65)'); rim.addColorStop(0.5, 'rgba(255,255,255,0.10)'); rim.addColorStop(1, 'rgba(255,255,255,0.40)');
    g.lineWidth = 12; g.strokeStyle = rim; path(); g.stroke();
    g.restore();
    const edge = g.createLinearGradient(P, P, P + w, P + h); edge.addColorStop(0, 'rgba(255,255,255,0.98)'); edge.addColorStop(0.5, 'rgba(255,255,255,0.35)'); edge.addColorStop(1, 'rgba(255,255,255,0.8)');
    g.lineWidth = 1.8; g.strokeStyle = edge; path(0.9); g.stroke();
    if (this.cache.size > 90) this.cache.delete(this.cache.keys().next().value);
    this.cache.set(key, c); return c;
  },
  draw(ctx, x, y, w, h, r, o) { x = Math.round(x); y = Math.round(y); ctx.drawImage(this.panel(x, y, Math.round(w), Math.round(h), r, o), x - this.P, y - this.P); },
  /* Fortschritt wie bei iOS: dünne Kapsel, satte Füllung, wandernder Glanz */
  bar(ctx, x, y, w, h, p, c1, c2, t) {
    ctx.save();
    ctx.beginPath(); rr(ctx, x, y, w, h, h / 2); ctx.fillStyle = 'rgba(118,118,128,0.20)'; ctx.fill();
    if (p > 0.002) {
      ctx.beginPath(); rr(ctx, x, y, w, h, h / 2); ctx.clip();
      const fw = Math.max(h, w * clamp(p, 0, 1)), gr = ctx.createLinearGradient(x, 0, x + fw, 0); gr.addColorStop(0, c1); gr.addColorStop(1, c2);
      ctx.fillStyle = gr; ctx.beginPath(); rr(ctx, x, y, fw, h, h / 2); ctx.fill();
      const wx = x + ((t * 220) % (fw + 160)) - 80, wg = ctx.createLinearGradient(wx - 60, 0, wx + 60, 0);
      wg.addColorStop(0, 'rgba(255,255,255,0)'); wg.addColorStop(0.5, 'rgba(255,255,255,0.45)'); wg.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = wg; ctx.fillRect(x, y, fw, h);
      ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillRect(x + h / 2, y + h * 0.16, Math.max(0, fw - h), h * 0.22);
    }
    ctx.restore();
  },
  text(ctx, txt, x, y, o) { return drawText(ctx, txt, x, y, Object.assign({ font: 'ui', color: this.INK, stroke: false }, o)); },
};

/* ---------- Zeichnen ---------- */
const MonsterView = {
  ctaImg: null, ctaKey: '', howImg: null, howKey: '', toastCache: new Map(),
  L: { cta: [30, 142, 900, 84], status: [30, 240, 900, 88], how: [30, 344, 440, 246], board: [490, 344, 450, 270], rush: [36, 700, 56, 290] },
  draw(ctx, t) {
    const M = Monster, sh = Game.shake * Game.shake * 20;
    ctx.save(); if (sh > 0.3) ctx.translate(rand(-sh, sh), rand(-sh, sh));
    const bg = Assets.get('bgMonster');
    if (bg) ctx.drawImage(bg, 0, 0);
    else { const g = ctx.createLinearGradient(0, 0, 0, 1920); g.addColorStop(0, '#9fc8ff'); g.addColorStop(0.45, '#ffd0ea'); g.addColorStop(0.5, '#8fd468'); g.addColorStop(1, '#3f8a3a'); ctx.fillStyle = g; ctx.fillRect(0, 0, 1080, 1920); }
    MonsterAmbient.draw(ctx);
    FX.draw(ctx, 0);
    if (Hype.active > 0) { const gs = M.dispH * 1.2; ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.35 + Math.sin(t * 10) * 0.12; ctx.drawImage(softBlob('#ffb13d'), M.X - gs, M.GY - M.dispH * 0.5 - gs, gs * 2, gs * 2); ctx.restore(); }
    this.drawMonster(ctx, t);
    this.drawFoods(ctx);
    FX.draw(ctx, 1);
    FX.draw(ctx, 2);
    HUD.drawPops(ctx);
    ctx.restore();
    if (Game.flash > 0.01) { ctx.globalAlpha = Math.min(1, Game.flash) * 0.6; ctx.fillStyle = Game.flashColor; ctx.fillRect(0, 0, 1080, 1920); ctx.globalAlpha = 1; }
    if (Hype.active > 0) { const a = 0.32 + Math.sin(t * 10) * 0.14; const g = ctx.createRadialGradient(540, 960, 600, 540, 960, 1150); g.addColorStop(0, 'rgba(255,140,40,0)'); g.addColorStop(1, `rgba(255,120,40,${a})`); ctx.fillStyle = g; ctx.fillRect(0, 0, 1080, 1920); }
    this.drawCTA(ctx, t);
    this.drawStatus(ctx, t);
    this.drawHow(ctx);
    this.drawBoard(ctx, t);
    this.drawRush(ctx, t);
    this.drawBubble(ctx, t);
    HUD.drawCallouts(ctx);
    this.drawVote(ctx, t);
    this.drawToasts(ctx);
    HUD.drawPause(ctx, t);
    HUD.drawHints(ctx, t);
  },
  drawMonster(ctx, t) {
    const M = Monster, pose = M.pose();
    let h = M.dispH, sx = 1, sy = 1, rot = 0, ox = 0;
    const br = Math.sin(t * 2.3) * 0.018; sy += br; sx -= br * 0.6;
    sy -= M.bite * 0.05; sx += M.bite * 0.035;
    if (M.lvl && M.lvl.phase === 'crouch') { const k = clamp(M.lvl.t / 0.55, 0, 1); sy *= 1 - 0.12 * k; sx *= 1 + 0.08 * k; ox = Math.sin(t * 60) * 4 * k; }
    if (M.party > 0) rot = Math.sin(t * 9) * 0.07;
    if (M.sleeping) rot = Math.sin(t * 1.2) * 0.03;
    if (M.wowT > 0.7) { const k = (M.wowT - 0.7) / 0.3; sy *= 1 + 0.08 * k; }
    if (M.hatchT >= 0) { const k = easeOutBack(clamp(M.hatchT / 0.8, 0, 1)); sx *= k; sy *= k; }
    const shadowW = h * 0.42 * (1 - Math.min(M.hop, 80) / 260);
    ctx.fillStyle = 'rgba(20,60,20,0.28)'; ctx.beginPath(); ctx.ellipse(M.X, M.GY + 4, shadowW, h * 0.05, 0, 0, TAU); ctx.fill();
    ctx.save(); ctx.translate(M.X + ox, M.GY - M.hop); ctx.rotate(rot); ctx.scale(sx, sy);
    if (MonsterArt.has()) {
      const img = MonsterArt.frame(pose, M.toH, M.tint), k = h / img.height;
      ctx.drawImage(img, -img.width * k / 2, -img.height * k, img.width * k, img.height * k);
    } else {
      ctx.fillStyle = '#7bd35b'; ctx.beginPath(); ctx.ellipse(0, -h * 0.45, h * 0.42, h * 0.42, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#222'; for (const dx of [-0.13, 0.13]) { ctx.beginPath(); ctx.arc(dx * h, -h * 0.55, h * 0.05, 0, TAU); ctx.fill(); }
    }
    ctx.restore();
    if (M.level >= CONFIG.monster.maxLevel || M.party > 0) Icon.draw(ctx, 'crown', M.X - h * 0.16, M.GY - M.hop - h * 0.92 + Math.sin(t * 3) * 3, h * 0.16);
  },
  drawFoods(ctx) {
    for (const f of Monster.foods) {
      const k = clamp(f.t / f.dur, 0, 1), u = 1 - k, [mx, my] = Monster.mouth();
      const x = u * u * f.x0 + 2 * u * k * f.cx + k * k * mx, y = u * u * f.y0 + 2 * u * k * f.cy + k * k * my;
      const s = f.size * (1 - k * 0.45), img = MonsterArt.food(f.food, f.size);
      if (k < 0.9) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.35; ctx.drawImage(softBlob('#fff2c0'), x - s * 0.7, y - s * 0.7, s * 1.4, s * 1.4); ctx.restore(); }
      ctx.save(); ctx.translate(x, y); ctx.rotate(f.rot * 0.3);
      if (img) { const r = s / Math.max(img.width, img.height); ctx.drawImage(img, -img.width * r / 2, -img.height * r / 2, img.width * r, img.height * r); }
      else drawText(ctx, FOODS[f.food].emo[0], 0, 0, { size: s * 0.8, stroke: false });
      ctx.restore();
    }
  },
  /* ---------- Kopfzeile: neutrale Frage statt Like-Aufforderung ---------- */
  drawCTA(ctx, t) {
    const [x, y, w, h] = this.L.cta, LG = LiquidGlass, name = CONFIG.monster.name || 'das Monster', key = name + Assets.loaded;
    if (this.ctaKey !== key) {

  /* ---------- Top Feeders mit iOS-Segmentschalter ---------- */
  drawBoard(ctx, t) {
    const M = Monster, kinds = ['cur', 'today', 'all'];
    if (t > M.boardSwitchAt) { M.boardKind = (M.boardKind + 1) % 3; M.boardSwitchAt = t + CONFIG.leaderboard.rotateSec; M.boardDirty = true; }
    const kind = kinds[M.boardKind];

      const rows = src.filter(([id]) => !Persist.isMuted(id)).sort((a, b) => b[1].p - a[1].p).slice(0, 5).map(([id, v]) => ({ id, n: v.n, p: v.p }));
      const sig = kind + Assets.loaded + rows.map(r => { const u = Users.map.get(r.id); return r.n + Math.round(r.p) + (u && Avatars.get(u) ? '*' : ''); }).join('|');

  renderBoard(kind, rows) {
    const [x, y, W, H] = this.L.board, LG = LiquidGlass, P = LG.P, c = Mat.cv(W + P * 2, H + P * 2), g = c.getContext('2d');
    g.drawImage(LG.panel(x, y, W, H, 28), 0, 0); g.translate(P, P);

    const segs = [['cur', 'Monster'], ['today', 'Heute'], ['all', 'Gesamt']], sw = 74, sx0 = W - 20 - sw * 3;
    g.beginPath(); rr(g, sx0 - 3, 18, sw * 3 + 6, 32, 16); g.fillStyle = 'rgba(118,118,128,0.18)'; g.fill();

      const on = k === kind, sx = sx0 + i * sw;

    const MED = ['#ffcc00', '#c7c7cc', '#d9975a'];

      const cy = 86 + i * 39, u = Users.map.get(r.id) || { id: r.id, name: r.n, hue: hashStr(String(r.id)) % 360 };
      if (i === 0) { g.beginPath(); rr(g, 10, cy - 19, W - 20, 38, 19); g.fillStyle = 'rgba(255,204,0,0.18)'; g.fill(); }
      if (i < 3) { g.beginPath(); g.arc(32, cy, 13, 0, TAU); g.fillStyle = MED[i]; g.fill(); LG.text(g, String(i + 1), 32, cy + 1, { size: 16, font: 'uiHeavy', color: i === 0 ? '#5a4400' : '#ffffff' }); }
      else LG.text(g, String(i + 1), 32, cy + 1, { size: 18, font: 'uiHeavy', color: LG.SUB });
      Avatars.draw(g, u, 70, cy, 16, 'rgba(255,255,255,0.9)');
      LG.text(g, r.n, 96, cy + 1, { size: 23, align: 'left', maxWidth: W - 96 - 80 });
      LG.text(g, fmtPts(r.p), W - 22, cy + 1, { size: 22, font: 'uiHeavy', align: 'right', color: i === 0 ? '#b37f00' : LG.INK });

  },
  /* ---------- Fressrausch-Säule (Glas-Kapsel) ---------- */
  drawRush(ctx, t) {
    if (!CONFIG.hype.enabled) return;
    const [x, y0, w, h] = this.L.rush, LG = LiquidGlass, on = Hype.active > 0;
    if (on) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.45 + Math.sin(t * 12) * 0.2; ctx.drawImage(softBlob('#ff9500'), x - 60, y0 - 50, w + 120, h + 100); ctx.restore(); }
    LG.draw(ctx, x, y0, w, h, w / 2);

      const g = ctx.createLinearGradient(0, gy + gh, 0, gy); g.addColorStop(0, '#ffcc00'); g.addColorStop(0.6, '#ff9500'); g.addColorStop(1, '#ff2d55');
      ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(gx, gy + gh);
      for (let xx = 0; xx <= gw; xx += 4) ctx.lineTo(gx + xx, gy + gh - fh + Math.sin(xx * 0.3 + t * 7) * 3);
      ctx.lineTo(gx + gw, gy + gh); ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillRect(gx + 5, gy + gh - fh + 6, 5, Math.max(0, fh - 14));
      ctx.restore();
    }
    Icon.draw(ctx, 'flame', x + w / 2, y0 - 30, 52 + (on ? Math.sin(t * 14) * 6 : 0), t);
    if (on) LG.text(ctx, '×2', x + w / 2 + 4, y0 + h + 32, { size: 38, font: 'uiHeavy', color: '#ffffff', stroke: true, strokeWidth: 6, strokeColor: 'rgba(160,60,0,0.6)', drop: false });
  },
  /* ---------- Sprechblase (iMessage-artig) ---------- */
  drawBubble(ctx, t) {
    const b = Monster.bubble; if (!b) return;
    const M = Monster, LG = LiquidGlass, a = clamp((b.life - b.t) / 0.3, 0, 1), s = easeOutBack(clamp(b.t / 0.3, 0, 1));
    const size = 29, lines = wrapText(ctx, b.text, size, 300, 'ui'), w = Math.min(350, Math.max(...lines.map(l => measureText(ctx, l, size, 'ui'))) + 46), h = lines.length * 36 + 28;
    const headX = M.X + M.dispH * 0.36, headY = M.GY - M.hop - M.dispH * 0.86;

    ctx.beginPath(); rr(ctx, -w / 2, -h / 2, w, h, h > 70 ? 26 : h / 2); ctx.moveTo(ax + 14, h / 2 - 1); ctx.lineTo(tipX, h / 2 + 30); ctx.lineTo(ax - 14, h / 2 - 1);
    ctx.fillStyle = 'rgba(255,255,255,0.96)'; ctx.fill(); ctx.restore();
    lines.forEach((l, i) => LG.text(ctx, l, 0, -h / 2 + 32 + i * 36, { size, font: 'uiHeavy' }));
    ctx.restore();
  },
  /* ---------- Abstimmung: Farbe fürs nächste Monster ---------- */
  drawVote(ctx, t) {
    const v = Monster.vote; if (!v) return;
    const LG = LiquidGlass, cx = CONFIG.layout.centerX, inK = easeOutBack(clamp(v.t / 0.4, 0, 1)), left = Math.max(0, v.dur - v.t), W = 880, H = 420, x = cx - W / 2, y = 640;
    ctx.save(); ctx.translate(cx, y + H / 2); ctx.scale(inK, inK); ctx.translate(-cx, -(y + H / 2));
    LG.draw(ctx, x, y, W, H, 36, { tint: 'rgba(255,255,255,0.5)' });

    LG.text(ctx, 'Welche Farbe soll es haben?', cx, y + 92, { size: 44, font: 'uiHeavy', maxWidth: 820 });

    RACE_COLORS.forEach((C, i) => {
      const col = i % 3, row = Math.floor(i / 3), bx = x + 40 + col * 272, by = y + 140 + row * 92, w = 256, hh = 76, lead = v.counts[i] === max && max > 0;

      if (lead) { ctx.lineWidth = 4; ctx.strokeStyle = '#ffffff'; ctx.beginPath(); rr(ctx, bx, by, w, hh, hh / 2); ctx.stroke(); }
      LG.text(ctx, C.key === 'gruen' ? 'grün' : C.key, bx + 28, by + hh / 2 + 1, { size: 32, font: 'uiHeavy', align: 'left', color: '#ffffff', stroke: true, strokeWidth: 4, strokeColor: hexA(C.dark, 0.7), drop: false });
      LG.text(ctx, String(v.counts[i]), bx + w - 26, by + hh / 2 + 1, { size: 32, font: 'uiHeavy', align: 'right', color: '#ffffff', stroke: true, strokeWidth: 4, strokeColor: hexA(C.dark, 0.7), drop: false });
    });

  /* ---------- Einblendungen als Glas-Kapsel ---------- */
  drawToasts(ctx) {
    const LG = LiquidGlass;
    let y = 1236;
    for (const tt of Game.toasts) {
      const inK = clamp(tt.t / 0.3, 0, 1), outK = clamp((tt.life - tt.t) / 0.35, 0, 1);
      const size = tt.prio >= 3 ? 34 : 30, icon = Icon.EMOJI[tt.icon] || null;
      const u = CONFIG.avatars.enabled && tt.uid != null ? Users.map.get(tt.uid) : null;
      const lead = (icon ? 48 : 0) + (u ? 56 : 0), h = 70;
      const tw = Math.min(880, Math.ceil((measureText(ctx, tt.text, size, 'ui') + 70 + lead) / 40) * 40), x = CONFIG.layout.centerX - tw / 2;

/* ==========================================================================
   15. Boot – Layout, Eingaben, Spielschleife
   ========================================================================== */
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d', { alpha: false });
const Loop = { last: 0, fps: 60, frames: 0, fpsAt: 0 };

function layout() {
  if (IS_PANEL) return;
  const W = innerWidth, H = innerHeight, PW = Math.min(430, W);
  const dock = Panel.open && W - PW >= 260;
  const availW = dock ? W - PW : W;
  const s = Math.min(availW / CONFIG.W, H / CONFIG.H);
  const w = Math.floor(CONFIG.W * s), h = Math.floor(CONFIG.H * s);
  canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
  canvas.style.left = Math.floor((availW - w) / 2) + 'px'; canvas.style.top = Math.floor((H - h) / 2) + 'px';
  Panel.overlaying = Panel.open && !dock;
  const tb = document.getElementById('testbar');
  tb.style.left = (parseInt(canvas.style.left) + 8) + 'px'; tb.style.bottom = (H - parseInt(canvas.style.top) - h + 8) + 'px'; tb.style.maxWidth = (w - 16) + 'px';
}

function onKey(e) {
  if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  Sound.resume();
  const k = e.key.length === 1 ? e.key.toUpperCase() : '';
  if (!k) return;
  if (k === 'H') { if (!IS_PANEL) Panel.toggle(); e.preventDefault(); return; }
  if ('BDEPMRNX'.includes(k)) { Panel.send({ c: 'hotkey', k }); e.preventDefault(); return; }
  if ('CLFSG12'.includes(k)) { Panel.send({ c: 'test', k }); e.preventDefault(); }
}

function frame(ts) {
  try {
    let dt = (ts - Loop.last) / 1000; Loop.last = ts;
    if (!(dt > 0)) dt = 1 / 60; if (dt > 0.1) dt = 0.1;
    const before = EventQueue.q.length;
    EventQueue.process(CONFIG.perf.eventsPerFrame);
    for (let i = 0; i < before - EventQueue.q.length; i++) Host._ipm.push(now());
    TestSim.update(dt);
    Bots.update(dt);
    if (MONSTER_MODE) Monster.update(dt); else if (RACE_MODE) Race.update(dt); else { Game.update(dt); World.update(dt); }
    FX.update(dt);
    StatsLog.tick();
    if (MONSTER_MODE) MonsterView.draw(ctx, now()); else if (RACE_MODE) RaceView.draw(ctx, now()); else HUD.drawScene(ctx, now());
    Loop.frames++;
    if (ts - Loop.fpsAt > 1000) { Loop.fps = Loop.frames * 1000 / (ts - Loop.fpsAt); Loop.frames = 0; Loop.fpsAt = ts; }
  } catch (err) {
    console.error(err); Host.lastError = String(err && err.stack || err);
  }
  requestAnimationFrame(frame);
}

function saveGame() { if (MONSTER_MODE) Monster.save(); else if (RACE_MODE) Race.save(); else Persist.save(); }

function boot() {
  PanelLink.init();
  Panel.build();
  addEventListener('keydown', onKey);
  ['pointerdown', 'touchstart'].forEach(ev => addEventListener(ev, () => Sound.resume(), { passive: true }));
  if (IS_PANEL) {
    document.body.classList.add('remote');
    Net.connect();
    setInterval(() => Panel.update(), 500);
    return;
  }
  Assets.onLoad(k => {
    if (k.startsWith('dino_')) HUD.lexDirty = true;                    // Lexikon zeigt jetzt die Dino-Bilder
    if (k === 'rocks') HUD.nests = {};
    if (k === 'meteor') HUD.meteorIcon = null;
  });
  Assets.load();
  const spiel = (new URLSearchParams(location.search).get('spiel') || '').toLowerCase();
  GAME = { ei: 'egg', egg: 'egg', rennen: 'race', race: 'race', monster: 'monster' }[spiel] || (['monster', 'race', 'egg'].includes(CONFIG.game) ? CONFIG.game : 'monster');
  RACE_MODE = GAME === 'race'; MONSTER_MODE = GAME === 'monster';
  StatsLog.init();
  TestSim.init();
  Sound.resume();          // OBS-Browserquelle erlaubt Autoplay → Ton sofort; normale Browser warten auf den ersten Klick
  World.init();
  TestBar.build();
  if (MONSTER_MODE) Monster.init();
  else if (RACE_MODE) Race.init();
  else {
  // Spielstand wiederherstellen (absturzsicher)
  const round = Persist.load();
  if (round && round.eggs && round.eggs.length) { Game.mode = round.mode; Game.spawnEggs(round); Game.announce = null; }
  else if (round && round.introMode) { Game.eggNumber = Math.max(0, Game.eggNumber - 1); Game.totals.eggs = Math.max(0, Game.totals.eggs - 1); Game.startRound(round.introMode); }
  else Game.startRound(Game.pickNextMode());
  }
  // Langes Drücken oben links (1 s) öffnet das Panel – für Touch ohne Tastatur
  let lp = null;
  canvas.addEventListener('pointerdown', e => {
    const r = canvas.getBoundingClientRect();
    if ((e.clientX - r.left) / r.width < 0.18 && (e.clientY - r.top) / r.height < 0.08) lp = setTimeout(() => Panel.toggle(), 1000);
  });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => canvas.addEventListener(ev, () => clearTimeout(lp)));
  addEventListener('resize', layout);
  addEventListener('beforeunload', () => { saveGame(); StatsLog.persist(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) { saveGame(); StatsLog.persist(); } });
  layout();
  Net.connect();
  setInterval(() => { Panel.update(); PanelLink.post({ kind: 'status', status: Host.status() }); }, 500);
  // Debug-Zugriff für Tests in der Konsole
  window.DinoEi = { Game, World, Net, TestSim, CONFIG, HUD, Persist, Users, Board, Coll, StatsLog, Host, FX, Sound, Assets, DinoArt, Glass, Bots, Race, RaceView, Monster, MonsterView };
  Loop.last = performance.now(); Loop.fpsAt = Loop.last;
  requestAnimationFrame(frame);
}
boot();
</script>
