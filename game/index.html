        if (tn - u.lastHitAt >= D.commentCooldownMs) { u.lastHitAt = tn; this.hit(u, D.comment, 'comment'); }
        else this.ensureHelper(u);
        break;
      }
      case 'like':
        u.likeBuf += Math.max(1, ev.count || 1); this.ensureHelper(u);
        this.likeHearts(Math.max(1, ev.count || 1));          // Herzen fliegen sichtbar zum Ei
        break;
      case 'follow':
        this.hit(u, D.follow, 'follow');
        this.toast(`Danke fürs Folgen, ${Users.label(u)}!`, { color: '#ffd84a', icon: '⭐', prio: 3, u });
        break;
      case 'share':
        this.hit(u, D.share, 'share');
        this.toast(`${Users.label(u)} hat den LIVE geteilt – danke!`, { color: '#7fe0ff', icon: '📣', prio: 2, u });
        break;
      case 'gift': {
        const dmg = clamp((ev.diamonds || 1) * D.giftPerDiamond, D.giftMin, D.giftMax);
        this.hit(u, dmg, 'gift');
        this.toast(`Danke, ${Users.label(u)}!`, { color: '#ff9be0', icon: '💖', prio: 2, u });
        break;
      }
    }
  },
  flushLikes() {
    const D = CONFIG.damage;
    for (const u of Users.map.values()) {
      if (u.likeBuf <= 0) continue;
      const dmg = Math.min(u.likeBuf * D.like, D.likeMaxPerBundle);
      u.likeBuf = 0;
      if (dmg > 0) this.hit(u, dmg, 'like');
    }
  },
  ensureHelper(u) {
    if (u.muted) return;
    if (u.helper && !u.helper.dead && u.helper.state !== 'leave') { u.helper.lastAct = gnow(); return; }
    if (this.helpers.filter(h => h.state !== 'leave').length >= CONFIG.helpers.max) {
      let old = null; for (const h of this.helpers) if (h.state !== 'leave' && (!old || h.lastAct < old.lastAct)) old = h;
      if (!old || gnow() - old.lastAct < 8) return;
      old.leave(); const ou = Users.map.get(old.uid); if (ou) ou.helper = null;
    }
    if (this.mode === 'duel' && !u.team) u.team = Math.random() < 0.5 ? 1 : 2;
    const h = new Helper(u); u.helper = h; this.helpers.push(h);
    this.layoutHelpers();
  },
  /* Plätze rund um das Ei/die Eier verteilen */
  helperSlots() {
    // 4 Reihen auf der Felskante (hinten kleiner, vorne größer)
    const xs = this.eggXs(this.mode), gy = CONFIG.layout.groundY, rows = [[-86, 0.84], [-60, 0.92], [-34, 1], [-8, 1.08]];
    const make = (ex, rx, team, innerSide, innerMax) => {
      const out = [];
      rows.forEach(([dy, sc], r) => {
        for (const side of [-1, 1]) {
          const maxK = side === innerSide ? innerMax : 6;
          for (let k = 0; k < maxK; k++) {
            const x = ex + side * (rx * 0.95 + 44 + k * 66 + (r % 2) * 26);
            if (x < (this.mode === 'duel' ? 60 : 120) || x > 925) continue;   // links bleibt Platz für die Hype-Säule
            out.push({ x, y: gy + dy, scale: sc, team, d: Math.abs(x - ex) + r * 40 });
          }
        }
      });
      return out.sort((a, b) => a.d - b.d);
    };
    if (this.mode === 'duel') { const rx = EGG_SIZES.duel[0]; return { 1: make(xs[0], rx, 1, 1, 2), 2: make(xs[1], rx, 2, -1, 2) }; }
    const rx = (EGG_SIZES[this.mode] || EGG_SIZES.normal)[0];
    return { 0: make(xs[0], rx, 0, 0, 6) };
  },
  layoutHelpers() {
    const slots = this.helperSlots();
    const used = { 0: 0, 1: 0, 2: 0 };
    const active = this.helpers.filter(h => h.state !== 'leave').sort((a, b) => a.joinedAt - b.joinedAt);
    for (const h of active) {
      let team = 0;
      if (this.mode === 'duel') { const u = Users.map.get(h.uid); team = u && u.team ? u.team : 1; }
      const list = slots[team] || [];
      const s = list[used[team]++];
      if (s) h.setSlot(s); else { h.setSlot({ x: h.fromLeft ? -50 : 1130, y: CONFIG.layout.groundY - 30, scale: 1 }); }
    }
  },
  /* Treffer auf ein Ei */
  hit(u, dmg, kind) {
    this.ensureHelper(u);
    if (this.phase !== 'play' || this.paused) return;
    let egg = this.eggs[0];
    if (this.mode === 'duel') {
      if (!u.team) { u.team = Math.random() < 0.5 ? 1 : 2; this.layoutHelpers(); }
      egg = this.eggs.find(e => e.team === u.team);
    }
    if (!egg || (egg.state !== 'idle' && egg.state !== 'drop')) return;
    dmg *= Hype.mult;                                     // Hype: doppelter Schaden
    const p0 = egg.progress;
    this.lastDamageAt = gnow();
    egg.hp = Math.max(0, egg.hp - dmg);
    if (!u.bot) {                                         // Bots: keine Bestenliste, keine Krone, benennen keine Dinos
      const c = egg.contrib.get(u.id) || { n: u.name, d: 0 }; c.n = u.name; c.d += dmg; egg.contrib.set(u.id, c);
      if (!u.muted) egg.lastHitter = { id: u.id, n: u.name }; else egg.lastHitter = { id: u.id, n: CONFIG.names.anonymous };
      Board.add(u, dmg);
    }
    // Effekte
    const W = CONFIG.wobble, big = dmg >= CONFIG.damage.bigHitAt;
    egg.va += (Math.random() < 0.5 ? -1 : 1) * W.hitImpulse * (0.4 + Math.min(dmg, 6) * 0.25) * (kind === 'like' ? 0.5 : 1);
    if (egg.h <= 0 && (kind !== 'like' || Math.random() < 0.3)) egg.vh = 90 + Math.min(dmg, 10) * 22;
    egg.flash = Math.max(egg.flash, big ? 0.7 : 0.25);
    const nShards = kind === 'like' ? (Math.random() < 0.5 ? 1 : 0) : clamp(Math.round(2 + dmg * 1.2), 2, 14);
    this.shards(egg, nShards, u.helper ? u.helper.x : null);
    if (kind !== 'like') Sound.knock(clamp(dmg / 6, 0, 1));
    if (big) { this.shake = Math.min(1, this.shake + 0.4); for (const h of this.helpers) if (Math.random() < 0.5 && h.hop <= 0) h.vh = rand(180, 260); }
    if (kind === 'follow') { egg.bigCrack = 0.7; Sound.bigHit(); this.shake = Math.min(1, this.shake + 0.5); this.flash = Math.max(this.flash, 0.25); this.flashColor = '#fff6c2'; }
    else if (kind === 'share' || kind === 'gift') Sound.chime(kind === 'gift');
    // Combo: wer schnell nacheinander kommentiert, bekommt einen großen Combo-Pop
    let combo = 0;
    if (kind === 'comment') { u.combo = gnow() - (u.lastComboAt || -99) < 6 ? (u.combo || 0) + 1 : 1; u.lastComboAt = gnow(); combo = u.combo; }
    if (!u.muted) {
      this.pop(u, egg, kind, combo);
      if (u.helper && u.helper.state === 'idle') u.helper.peck();
    }
    if (kind === 'comment' && Math.random() < 0.04) Bubbles.say(pick(Bubbles.HIT), false, egg);
    this.afterDamage(egg, p0);
  },
  /* Gemeinsam für Treffer & Missions-Bonus: Riss-Stufen, Ansagen, Schlüpfen */
  afterDamage(egg, p0) {
    const st = Math.min(4, Math.floor(egg.progress / 0.2 + 1e-9));
    while (egg.stage < st) {
      egg.stage++; egg.stageAt[egg.stage - 1] = this.t;
      Sound.crack(egg.stage); this.shake = Math.min(1, this.shake + 0.35); this.shards(egg, 14);
      Bubbles.say(Bubbles.STAGE[egg.stage - 1], true, egg);
    }
    if (egg.hp > 0) {
      for (const [th, text, col] of [[0.5, 'HALB GESCHAFFT!', '#ffd35c'], [0.75, 'Gleich ist es so weit!', '#ffc24a'], [0.9, 'FAST GESCHAFFT!', '#ff9a4a']]) {
        if (p0 < th && egg.progress >= th) { this.callout(text, { color: col, x: egg.x }); Sound.sparkle(); }
      }
    }
    if (egg.hp <= 0) this.hatch(egg);
  },
  /* Missions-Belohnung: großer Riss in % der Ei-HP (zählt für niemanden in der Bestenliste) */
  bonusHit(pct) {
    if (this.phase !== 'play') return;
    for (const egg of this.eggs) {
      if (egg.state !== 'idle' && egg.state !== 'drop') continue;
      const p0 = egg.progress;
      egg.hp = Math.max(0, egg.hp - egg.maxHp * pct);
      egg.bigCrack = 0.9; egg.flash = 0.9; egg.va += 4; if (egg.h <= 0) egg.vh = 340;
      this.shards(egg, 26);
      this.afterDamage(egg, p0);
      if (this.phase !== 'play') break;
    }
    this.shake = 1; this.flash = Math.max(this.flash, 0.35); this.flashColor = '#e8ffd8'; Sound.bigHit();
    const cols = ['#7bd35b', '#ffe14d', '#5cc8ff', '#ff9f45'];
    for (let i = 0; i < 40; i++) FX.spawn({ type: 'confetti', layer: 2, x: CONFIG.layout.centerX + rand(-300, 300), y: 600, vx: rand(-300, 300), vy: rand(-500, -100), g: 800, drag: 1.2, size: rand(6, 10), rot: rand(0, TAU), vr: rand(-8, 8), life: rand(1.5, 2.4), color: pick(cols) });
    for (const h of this.helpers) h.cheerT = 1.4;
  },
  callout(text, o = {}) {
    if (this.callouts.length >= 3) this.callouts.shift();
    const e = this.eggs[0];
    const x = o.x != null ? o.x : (this.mode === 'duel' || !e ? CONFIG.layout.centerX : e.x);
    this.callouts.push({ text, font: o.font, t: 0, life: o.life || 1.9, color: o.color || '#ffe14d', size: o.size || 76, x: clamp(x, 300, 700), y: o.y != null ? o.y : CONFIG.layout.groundY - 270 });
  },
  likeHearts(n) {
    const k = Math.min(3, Math.ceil(n / 6));
    const e = this.eggs.length ? pick(this.eggs) : null;
    const tx = e ? e.x : CONFIG.layout.eggX, ty = e ? e.cy : CONFIG.layout.groundY - 185;
    for (let i = 0; i < k && this.flyHearts.length < 40; i++) {
      this.flyHearts.push({ x0: rand(830, 920), y0: rand(1150, 1260), cx: rand(720, 900), cy: rand(640, 840), x1: tx + rand(-60, 60), y1: ty + rand(-90, 30),
        t: -i * 0.12, dur: rand(0.9, 1.3), col: pick(['#ff5f8a', '#ff7fb0', '#ff3d6e']), s: rand(20, 28) });
    }
  },
  shards(egg, n, fromX) {
    for (let i = 0; i < n; i++) {
      let a = rand(-Math.PI * 0.95, -Math.PI * 0.05);
      if (fromX != null) a = fromX < egg.x ? rand(-Math.PI * 0.95, -Math.PI * 0.55) : rand(-Math.PI * 0.45, -Math.PI * 0.05);
      const px = egg.x + Math.cos(a) * egg.rx * 0.85, py = egg.cy + Math.sin(a) * egg.ry * 0.75;
      FX.spawn({ type: 'shard', layer: 1, x: px, y: py, vx: Math.cos(a) * rand(150, 380), vy: Math.sin(a) * rand(200, 420) - 120, g: 1300, size: rand(7, 14),
        rot: rand(0, TAU), vr: rand(-10, 10), life: rand(0.8, 1.3), color: Math.random() < 0.7 ? egg.color : egg.color2, floor: egg.groundY + rand(10, 60) });
    }
  },
  pop(u, egg, kind, combo = 0) {
    if (this.pops.length >= CONFIG.pops.max && combo < 3) { this.popOverflow++; return; }
    const a = rand(-Math.PI * 0.92, -Math.PI * 0.08);
    let text = u.name, col = { comment: '#ffffff', like: '#ff9db8', follow: '#ffd84a', share: '#7fe0ff', gift: '#ff9be0' }[kind] || '#fff';
    let size = { follow: 54, like: 34, comment: 40 }[kind] || 46, life = 1.3;
    if (combo >= 3) { text = `${u.name} x${combo}!`; col = combo >= 10 ? '#ff6b6b' : combo >= 5 ? '#ffa040' : '#ffd84a'; size = 46 + Math.min(combo, 12) * 1.5; life = 1.6; if (combo === 5 || combo === 10) Sound.sparkle(); }
    if (this.pops.length >= CONFIG.pops.max) this.pops.shift();
    this.pops.push({ text, x: egg.x + Math.cos(a) * egg.rx * 1.05, y: egg.cy + Math.sin(a) * egg.ry * 0.95, t: 0, life, color: col, size, font: combo >= 3 ? 'title' : 'body' });
  },
  teamPop(u, team) {
    if (u.muted) return;
    const egg = this.eggs.find(e => e.team === team);
    const x = egg ? egg.x : this.eggXs('duel')[team - 1];
    const y = egg ? egg.cy + rand(-30, 50) : CONFIG.layout.groundY - 150;
    if (this.pops.length < CONFIG.pops.max + 4) this.pops.push({ text: `${u.name} → ${team}`, x: x + rand(-50, 50), y, t: 0, life: 1.6, color: team === 1 ? '#ffb08a' : '#9fe0ff', size: 40 });
  },
  greet(u) {
    if (u.muted || u.filtered) return;            // gefilterte Namen nicht extra hervorheben
    this.greetBuf.push(u);
  },
  toast(text, o = {}) {
    if (o.u && o.u.muted) return;
    if (this.toastQueue.length > 8) { const i = this.toastQueue.findIndex(t => t.prio <= 1); if (i >= 0) this.toastQueue.splice(i, 1); else if ((o.prio || 1) <= 1) return; }
    this.toastQueue.push({ text, color: o.color || '#ffffff', icon: o.icon || '', prio: o.prio || 1, t: 0, life: o.life || 3.2, uid: o.u ? o.u.id : null });
    this.toastQueue.sort((a, b) => b.prio - a.prio);
  },

  /* ---------- Schlüpfen ---------- */
  rollRarity(minKey) {
    const w = CONFIG.rarity.weights, minI = minKey ? RARITY_ORDER.indexOf(minKey) : 0;
    const keys = RARITY_ORDER.filter((k, i) => i >= minI);
    const sum = keys.reduce((a, k) => a + Math.max(0, w[k] || 0), 0);
    if (sum <= 0) return keys[keys.length - 1];
    let r = Math.random() * sum;
    for (const k of keys) { r -= Math.max(0, w[k] || 0); if (r <= 0) return k; }
    return keys[keys.length - 1];
  },
  hatch(egg) {
    egg.state = 'burst'; egg.burstT = 0;
    const rarity = this.rollRarity(this.mode === 'boss' ? 'epic' : null);
    const sp = pick(SPECIES);
    const pals = PALETTES[rarity];
    const last = egg.lastHitter;
    const namerU = last ? Users.map.get(last.id) : null;
    const name = last && namerU && !namerU.muted ? namerU.name : (last ? last.n : CONFIG.names.anonymous);
    const top3 = [...egg.contrib.entries()].filter(([id]) => !Persist.isMuted(id)).sort((a, b) => b[1].d - a[1].d).slice(0, 3).map(([id, c]) => ({ name: c.n, pts: c.d }));
    let team = null, members = [];
    if (this.mode === 'duel') {
      team = egg.team;
      members = [...Users.map.values()].filter(u => u.team === team && !u.muted && this.sessionUsers.has(u.id) && u.lastActive > gnow() - this.duration - 30)
        .sort((a, b) => ((egg.contrib.get(b.id) || { d: 0 }).d) - ((egg.contrib.get(a.id) || { d: 0 }).d)).map(u => u.name);
      for (const e of this.eggs) if (e !== egg) { e.state = 'roll'; e.rollDir = e.x < egg.x ? -1 : 1; }
    }
    const secs = Math.round(this.duration - this.timeLeft);
    this.hatchInfo = { egg, rarity, species: sp.key, speciesName: sp.name, palIdx: randInt(0, pals.length - 1), seed: randInt(1, 1e6), name, namerId: last ? last.id : null, top3, team, members, secs, x: egg.x, y: egg.groundY };
    this.phase = 'hatch'; this.phaseT = 0;
    this.totals.hatches++; this.hatchTimes.push(secs); if (this.hatchTimes.length > 30) this.hatchTimes.shift();
    // Effekte
    this.flash = 1; this.flashColor = RARITIES[rarity].glow || '#ffffff'; this.shake = Math.min(1, this.shake + 0.7);
    Sound.hatch(rarity);
    this.shards(egg, 30);
    const confCols = ['#ff5f8a', '#ffd84a', '#5cc8ff', '#7bd35b', '#b86bff', '#ff9d5c'];
    for (let i = 0; i < 70; i++) FX.spawn({ type: 'confetti', layer: 2, x: egg.x + rand(-60, 60), y: egg.cy, vx: rand(-520, 520), vy: rand(-1100, -450), g: 900, drag: 1.2, size: rand(6, 11), rot: rand(0, TAU), vr: rand(-8, 8), life: rand(1.8, 2.8), color: pick(confCols), important: true });
    if (rarity === 'epic' || rarity === 'legendary') for (let i = 0; i < 40; i++) FX.spawn({ type: 'star', layer: 2, x: egg.x, y: egg.cy, vx: rand(-420, 420), vy: rand(-520, 200), drag: 1.5, size: rand(8, 16), rot: rand(0, TAU), vr: rand(-4, 4), life: rand(1.2, 2.2), color: RARITIES[rarity].glow, important: true });
    for (const h of this.helpers) h.cheerT = 2.4;
    for (const h of World.herd) h.jump(rand(0, 0.7));          // die Herde jubelt mit
    Missions.cancel();
    // Meteor verglüht
    if (this.meteor) { this.meteor.state = 'fizzle'; this.meteor.t = 0; Sound.fizzle(); for (let i = 0; i < 30; i++) FX.spawn({ type: 'spark', layer: 1, x: this.meteor.x, y: this.meteor.y, vx: rand(-260, 260), vy: rand(-260, 200), drag: 2, size: rand(3, 7), life: rand(0.6, 1.2), color: pick(['#ffb13d', '#fff2a8', '#ff7a2f']) }); }
    Sound.setUrgency(0);
    // Sammlung, Lexikon, Meilensteine
    const res = Coll.record(namerU && !namerU.muted ? namerU : null, sp.key, rarity);
    const adj = { common: 'gewöhnlicher', rare: 'seltener', epic: 'epischer', legendary: 'legendärer' }[rarity];
    if (res.newSpecies) this.toast(`Neu im Lexikon: ${sp.name}!`, { color: '#7bd35b', icon: '📖', prio: 2, life: 3.6 });
    if (res.firstCombo && (rarity === 'epic' || rarity === 'legendary')) this.toast(`Erster ${adj} ${sp.name}!`, { color: RARITIES[rarity].color, icon: '🏆', prio: 3, life: 3.8 });
    if (namerU && !namerU.muted && CONFIG.milestones.includes(res.total)) this.toast(`${namerU.name} hat jetzt ${res.total} Dinos benannt!`, { color: '#ffd84a', icon: '🎉', prio: 3, life: 3.8 });
    HUD.lexDirty = true;
    StatsLog.event('hatch', { mode: this.mode, secs, species: sp.key, rarity, maxHp: Math.round(egg.maxHp), active: Users.activeCount() });
    Persist.save();
  },

  /* ---------- Meteor-Einschlag ---------- */
  impact() {
    this.phase = 'impact'; this.phaseT = 0; this._boomed = false;
    const target = this.eggs.length ? this.eggs.reduce((a, e) => a + e.x, 0) / this.eggs.length : CONFIG.layout.centerX;
    this.meteor.state = 'dive'; this.meteor.t = 0; this.meteor.fx = this.meteor.x; this.meteor.fy = this.meteor.y; this.meteor.fr = this.meteor.r;
    this.meteor.tx = target; this.meteor.ty = CONFIG.layout.groundY - 140;
    const best = this.eggs.reduce((a, e) => Math.max(a, e.progress), 0);
    this.impactInfo = { progress: best };
    Sound.whoosh(0.9); Sound.setUrgency(0);
    this.totals.impacts++;
    StatsLog.event('impact', { mode: this.mode, progress: Math.round(best * 100), active: Users.activeCount() });
  },
  boom() {
    this._boomed = true;
    this.flash = 1; this.flashColor = '#ffffff'; this.shake = 1;
    Sound.impact();
    const cx = this.meteor.tx, cy = CONFIG.layout.groundY - 60;
    for (let i = 0; i < 46; i++) FX.spawn({ type: 'blob', layer: 2, x: cx + rand(-120, 120), y: cy + rand(-60, 40), vx: rand(-420, 420), vy: rand(-320, 40), drag: 1.6, size: rand(40, 80), grow: 70, life: rand(2.4, 3.6), color: pick(['#b89a7a', '#9c8068', '#cdb89c']), alpha: 0.85, important: true });
    for (let i = 0; i < 22; i++) FX.spawn({ type: 'rock', layer: 2, x: cx, y: cy, vx: rand(-700, 700), vy: rand(-1000, -300), g: 1500, size: rand(8, 18), rot: rand(0, TAU), vr: rand(-8, 8), life: rand(1.2, 2), color: '#7a6a7e', floor: CONFIG.layout.groundY + rand(0, 120), important: true });
    for (let i = 0; i < 30; i++) FX.spawn({ type: 'spark', layer: 2, x: cx, y: cy, vx: rand(-600, 600), vy: rand(-700, 100), g: 600, size: rand(4, 9), life: rand(0.6, 1.3), color: pick(['#ffb13d', '#ff7a2f', '#fff2a8']), important: true });
    FX.spawn({ type: 'ring', layer: 2, x: cx, y: CONFIG.layout.groundY, size: 30, grow: 900, life: 0.7, color: 'rgba(255,240,200,0.9)', squash: 0.3, important: true });
    for (const e of this.eggs) { this.shards(e, 24); e.state = 'gone'; }
    for (const h of this.helpers) { h.vh = rand(400, 560); h.cheerT = 0; }
    for (const h of World.herd) h.jump(rand(0, 0.3));
    this.meteor.alpha = 0;
  },

  /* ---------- Hotkeys / Host-Befehle ---------- */
  hotkey(k) {
    switch (k) {
      case 'B': this.override = 'boss'; return 'Boss-Ei kommt als Nächstes';
      case 'D': this.override = 'duel'; return 'Duell kommt als Nächstes';
      case 'E': return 'Ereignis: ' + World.randomEvent();
      case 'P': this.paused = !this.paused; Sound.paused = this.paused; return this.paused ? 'Pause an' : 'Pause aus';
      case 'M': Sound.setMuted(!Sound.muted); return Sound.muted ? 'Ton aus' : 'Ton an';
      case 'R': this.resetRound(); return 'Ei neu gestartet';
      case 'N': return Missions.start() ? 'Mission gestartet' : (Missions.active ? 'Es läuft schon eine Mission' : 'Mission jetzt nicht möglich (nur während ein Ei läuft, nicht im Duell)');
      case 'X': return Hype.start() ? 'HYPE gestartet' : 'Hype jetzt nicht möglich (nur während ein Ei läuft)';
    }
    return '';
  },
  resetRound() {
    this.paused = false; Sound.paused = false;
    for (const e of this.eggs) e.state = 'gone';
    this.eggNumber = Math.max(0, this.eggNumber - 1); this.totals.eggs = Math.max(0, this.totals.eggs - 1);
    this.startRound(this.mode === 'boss' || this.mode === 'duel' ? this.mode : 'normal');
  },

  /* ---------- Update ---------- */
  update(dt) {
    const rdt = dt;                                   // Echtzeit (Animationen)
    if (!this.paused) this.t += dt;
    this.phaseT += this.paused ? 0 : dt;
    // Likes bündeln
    if (gnow() - this.lastLikeFlush >= CONFIG.damage.likeBundleMs / 1000) { this.lastLikeFlush = gnow(); this.flushLikes(); }
    // Begrüßungen bündeln
    if (this.greetBuf.length && now() - this.greetAt > 1.2) {
      this.greetAt = now();
      if (this.greetBuf.length === 1) this.toast(`${this.greetBuf[0].name} ist dabei!`, { icon: '👋', prio: 1, life: 2.4, u: this.greetBuf[0] });
      else this.toast(`${this.greetBuf[0].name} und ${this.greetBuf.length - 1} weitere sind dabei!`, { icon: '👋', prio: 1, life: 2.6, u: this.greetBuf[0] });
      Sound.pop(); this.greetBuf = [];
    }
    // Aktivität der letzten ~5 s
    const win = CONFIG.wobble.windowSec;
    while (this.activity.length && this.activity[0].t < this.t - win) this.activity.shift();
    if (this.activity.length > 4000) this.activity.splice(0, this.activity.length - 4000);

    if (!this.paused) {
      if (this.phase === 'intro') {
        if (this.announce) this.announce.t += dt;
        if (this.phaseT >= this.introDur) { this.announce = null; this.spawnEggs(); }
      } else if (this.phase === 'play') {
        this.timeLeft -= dt;
        if (this.t - this.lastRescale > CONFIG.hp.rescaleEverySec) { this.lastRescale = this.t; this.rescaleHp(); }
        const urg = clamp((CONFIG.timer.urgentAt - this.timeLeft) / CONFIG.timer.urgentAt, 0, 1);
        Sound.setUrgency(urg);
        const sec = Math.ceil(this.timeLeft);
        if (sec !== this.lastTick) { this.lastTick = sec; if (sec <= 10 && sec > 0) Sound.tick(sec <= 5); }
        if (!this.urgentSaid && this.timeLeft < CONFIG.timer.urgentAt) { this.urgentSaid = true; Bubbles.say('Der Meteor kommt! Schneller!', true); }
        if (this.timeLeft <= 0) this.impact();
      } else if (this.phase === 'hatch') {
        if (this.phaseT >= CONFIG.reveal.hatchSec) { this.phase = 'reveal'; this.phaseT = 0; Sound.sparkle(); }
      } else if (this.phase === 'reveal') {
        if (this.phaseT >= CONFIG.reveal.cardSec) this.finishReveal();
      } else if (this.phase === 'impact') {
        if (!this._boomed && this.phaseT >= 0.9) this.boom();
        if (this.phaseT >= 5.2) { this.softer = CONFIG.hp.afterImpactMult; this.startRound(this.pickNextMode()); }
      }
      Hype.update(dt); Missions.update(dt); Bubbles.update(dt);
    }
    // letzte 60 s an Events (für Missionsziele)
    const lim60 = gnow() - 60; while (this.recentEv.length && this.recentEv[0].t < lim60) this.recentEv.shift();
    if (this.recentEv.length > 6000) this.recentEv.splice(0, this.recentEv.length - 6000);
    // "König des Eis": Top-Knacker pro Ei bekommt eine Krone
    if (gnow() - this.kingsAt > 0.5 || gnow() < this.kingsAt) {
      this.kingsAt = gnow(); const k = new Set();
      if (this.phase === 'play') for (const e of this.eggs) { let best = null; for (const [id, c] of e.contrib) { const uu = Users.map.get(id); if (!Persist.isMuted(id) && !(uu && uu.filtered) && (!best || c.d > best[1])) best = [id, c.d]; } if (best && best[1] >= 2) k.add(best[0]); }
      if ([...k].join() !== [...this.kings].join()) { this.kings = k; this.boardDirty = true; }
    }
    // Ansagen & fliegende Like-Herzen
    for (const c of this.callouts) c.t += rdt;
    this.callouts = this.callouts.filter(c => c.t < c.life);
    for (const h of this.flyHearts) {
      h.t += rdt;
      if (h.t >= h.dur) { h.done = true; for (let i = 0; i < 4; i++) FX.spawn({ type: 'spark', layer: 2, x: h.x1, y: h.y1, vx: rand(-120, 120), vy: rand(-120, 60), drag: 2, size: rand(3, 6), life: 0.5, color: h.col }); }
    }
    if (this.flyHearts.some(h => h.done)) this.flyHearts = this.flyHearts.filter(h => !h.done);
    this.updateMeteor(rdt);
    this.updateEggs(rdt);
    // Helfer
    const eggXFor = h => { if (!h.slot) return null; const e = this.mode === 'duel' ? this.eggs.find(e => e.team === h.slot.team) : this.eggs[0]; return e ? e.x : this.eggXs(this.mode)[Math.max(0, (h.slot.team || 1) - 1)]; };
    for (const h of this.helpers) {
      if (h.state !== 'leave' && gnow() - h.lastAct > CONFIG.helpers.inactiveSec) { h.leave(); const u = Users.map.get(h.uid); if (u && u.helper === h) u.helper = null; }
      h.update(rdt, eggXFor(h));
    }
    if (this.helpers.some(h => h.dead)) { this.helpers = this.helpers.filter(h => !h.dead); }
    // Pops
    for (const p of this.pops) p.t += rdt;
    this.pops = this.pops.filter(p => p.t < p.life);
    if (this.popOverflow > 0 && now() - this.popOverflowAt > 0.6 && this.eggs.length) {
      this.popOverflowAt = now(); const e = pick(this.eggs);
      this.pops.push({ text: `+${this.popOverflow} weitere`, x: e.x + rand(-40, 40), y: e.cy - e.ry - 10, t: 0, life: 1.2, color: '#ffe680', size: 42 });
      this.popOverflow = 0;
    }
    // Toasts
    for (const t of this.toasts) t.t += rdt;
    this.toasts = this.toasts.filter(t => t.t < t.life);
    // eine Einblendung zur Zeit (feste Spur über dem Chat); bei Andrang kürzer anzeigen
    while (this.toasts.length < 1 && this.toastQueue.length) {
      const t = this.toastQueue.shift(); t.t = 0;
      if (this.toastQueue.length >= 3) t.life = Math.min(t.life, 2.0); else if (this.toastQueue.length >= 1) t.life = Math.min(t.life, 2.6);
      this.toasts.push(t); if (t.prio >= 2) Sound.chime(t.prio >= 3);
    }
    // Effekte abklingen
    this.shake = Math.max(0, this.shake - rdt * 1.6);
    this.flash = Math.max(0, this.flash - rdt * 1.8);
    // Speichern
    if (now() - this.lastSaveAt > CONFIG.save.everySec) { this.lastSaveAt = now(); Persist.save(); }
  },
  finishReveal() {
    const info = this.hatchInfo;
    if (info) {
      const d = new HerdDino({ species: info.species, rarity: info.rarity, palIdx: info.palIdx, name: info.name, seed: info.seed });
      d.join(info.x, info.y);
      World.herd.push(d);
      const staying = World.herd.filter(h => !h.leaving);
      if (staying.length > CONFIG.herd.maxVisible) staying.slice(0, staying.length - CONFIG.herd.maxVisible).forEach(h => h.leave());
    }
    this.hatchInfo = null;
    this.startRound(this.pickNextMode());
    Persist.save();
  },
  intensity(team) {
    let s = 0; for (const a of this.activity) if (!team || a.team === team) s += a.w;
    const rate = s / CONFIG.wobble.windowSec;
    return 1 - Math.exp(-rate / 2.5);
  },
  updateEggs(dt) {
    const W = CONFIG.wobble;
    for (const e of this.eggs) {
      e.flash = Math.max(0, e.flash - dt * 3); e.bigCrack = Math.max(0, e.bigCrack - dt);
      if (e.state === 'drop') {
        e.dropT += dt;
        const k = clamp(e.dropT / 0.75, 0, 1);
        e.drop = (1 - easeInCubic(k)) * 1400;
        if (k >= 1) { e.state = 'idle'; e.drop = 0; e.squash = 0.25; Sound.thud(); this.shake = Math.min(1, this.shake + (e.boss ? 0.6 : 0.25));
          for (let i = 0; i < 14; i++) FX.spawn({ type: 'blob', layer: 1, x: e.x + rand(-e.rx, e.rx), y: e.groundY + rand(-6, 10), vx: rand(-160, 160), vy: rand(-60, -10), drag: 2, size: rand(14, 26), grow: 30, life: 0.9, color: '#d9c39c', alpha: 0.7 }); }
      }
      if (e.state === 'idle' || e.state === 'drop') {
        const I = this.intensity(this.mode === 'duel' ? e.team : 0);
        e.intensity = I;
        const drive = Math.sin(this.t * (5 + I * 7) + e.phase) * W.drive * I + (Math.random() - 0.5) * W.drive * I * 1.6;
        e.va += (-W.stiffness * e.a - W.damping * e.va + drive) * dt;
        e.a = clamp(e.a + e.va * dt, -0.45, 0.45);
        if (e.h <= 0 && I > 0.35 && Math.random() < I * dt * 1.6) e.vh = 120 + I * 260;
        e.vh -= 2200 * dt; e.h += e.vh * dt; if (e.h <= 0) { if (e.vh < -300) e.squash = 0.12; e.h = 0; e.vh = 0; }
        e.squash = Math.max(0, e.squash - dt * 1.5);
      } else if (e.state === 'burst') {
        e.burstT += dt;
      } else if (e.state === 'roll') {
        e.x += e.rollDir * 420 * dt; e.a += e.rollDir * 5 * dt; e.alpha = Math.max(0, e.alpha - dt * 0.6);
      }
    }
  },
  updateMeteor(dt) {
    const m = this.meteor; if (!m) return;
    m.t += dt;
    if (m.state === 'sky') {
      const q = this.phase === 'play' ? clamp(1 - this.timeLeft / this.duration, 0, 1) : 0;
      m.r = lerp(9, 66, Math.pow(q, 1.5)); m.heat = Math.pow(q, 2);
      m.alpha = this.phase === 'play' ? Math.min(1, m.alpha + dt * 0.8) : Math.max(0, m.alpha - dt);
      m.x = lerp(150, 205, q) + Math.sin(this.t * 0.7) * 4; m.y = lerp(660, 705, q);      // links oben über dem Ei (rechts ist die Bestenliste)
      if (this.timeLeft < CONFIG.timer.urgentAt && this.phase === 'play') { m.x += rand(-1, 1) * m.heat * 3; m.y += rand(-1, 1) * m.heat * 3; }
    } else if (m.state === 'dive') {
      const k = clamp(m.t / 0.9, 0, 1), e = easeInCubic(k);
      m.x = lerp(m.fx, m.tx, e); m.y = lerp(m.fy, m.ty, e); m.r = lerp(m.fr, 120, e); m.heat = 1; m.alpha = this._boomed ? 0 : 1;
      if (!this._boomed && Math.random() < 0.8) FX.spawn({ type: 'blob', layer: 1, x: m.x + rand(-10, 10), y: m.y + rand(-10, 10), vx: rand(20, 80), vy: rand(-80, -20), size: m.r * 0.6, grow: 40, life: 0.6, color: '#ff8a3d', alpha: 0.6, additive: true });
    } else if (m.state === 'fizzle') {
      m.alpha = Math.max(0, m.alpha - dt * 2.2); m.r *= 1 + dt * 0.6;
    }
  },
};

/* ==========================================================================
   10b. Mehr Action: Hype-Leiste, Mini-Missionen, Sprechblasen des Eis
   ========================================================================== */
/* Hype: füllt sich durch Aktivität (relativ zur Zuschauerzahl) → kurz doppelter Schaden */
const Hype = {
  value: 0, active: 0, cooldown: 0,
  get mult() { return this.active > 0 ? CONFIG.hype.multiplier : 1; },
  target() { return clamp(10 + Users.activeCount() * 0.95, 10, 80); },  // gewichtete Interaktionen bis "voll" (Kommentar = 1)
  add(w) {
    if (!CONFIG.hype.enabled || !w || this.active > 0 || this.cooldown > 0 || Game.phase !== 'play' || Game.paused) return;
    this.value = Math.min(1, this.value + w / this.target());
    if (this.value >= 1) this.start();
  },
  start() {
    if (Game.phase !== 'play' || this.active > 0) return false;
    this.active = CONFIG.hype.durationSec; this.value = 1;
    Game.callout(MONSTER_MODE ? 'FRESSRAUSCH! DOPPELT SATT!' : 'HYPE! DOPPELTER SCHADEN!', { color: MONSTER_MODE ? '#ffffff' : '#ffb13d', font: MONSTER_MODE ? 'uiHeavy' : undefined, size: 72, life: 2.6 });
    Sound.hype(); Game.shake = Math.min(1, Game.shake + 0.4);
    for (const h of World.herd) h.jump(rand(0, 0.5));
    for (const h of Game.helpers) h.cheerT = 1.6;
    Bubbles.say('WOOOW!', true);
    StatsLog.event('hype', { mode: Game.mode, active: Users.activeCount() });
    return true;
  },
  update(dt) {
    if (this.active > 0) {
      this.active -= dt; this.value = Math.max(0, this.active / CONFIG.hype.durationSec);
      if (Math.random() < dt * 16) { const e = pick(Game.eggs); if (e && (e.state === 'idle' || e.state === 'drop')) FX.spawn({ type: 'spark', layer: 1, x: e.x + rand(-e.rx, e.rx), y: e.groundY - rand(0, e.ry * 1.8), vx: rand(-30, 30), vy: rand(-170, -80), size: rand(4, 9), life: rand(0.6, 1.1), color: pick(['#ffb13d', '#ff7a2f', '#ffe14d']) }); }
      if (this.active <= 0) { this.active = 0; this.value = 0; this.cooldown = CONFIG.hype.cooldownSec; }
    } else {
      if (this.cooldown > 0) this.cooldown -= dt;
      this.value = Math.max(0, this.value - dt * 0.02);         // langsames Abklingen
    }
  },
  reset() { this.value = 0; this.active = 0; this.cooldown = 0; },
};

/* Mini-Missionen: Ziel passt sich der aktuellen Aktivität an (schaffbar, aber knackig).
   Bewusst KEINE Gift-Missionen (kein Gift-Baiting). */
const MISSION_TYPES = {
  comments: { icon: '💬', dur: 30, w: 4, label: n => `${n} Kommentare in 30 s!`, target: m => clamp(Math.round(m.rate('chat') * 30 * CONFIG.missions.difficulty), 3, 80) },
  likes:    { icon: '❤️', dur: 20, w: 3, label: n => `${n} Likes in 20 s!`, target: m => clamp(Math.round(m.rate('like') * 20 * 0.9 * CONFIG.missions.difficulty / 10) * 10, 20, 3000) },
  people:   { icon: '👥', dur: 30, w: 2, minActive: 4, label: n => `${n} verschiedene Leute in 30 s!`, target: m => clamp(Math.round(m.uniq(30) * CONFIG.missions.difficulty) + 1, 3, 80) },
  follow:   { icon: '⭐', dur: 60, w: 1, minActive: 6, label: () => '1 neuer Follower in 60 s!', target: () => 1 },
  share:    { icon: '📣', dur: 60, w: 1, minActive: 3, label: n => n === 1 ? 'Teilt den LIVE: 1 Share in 60 s!' : `Teilt den LIVE: ${n} Shares in 60 s!`, target: () => clamp(Math.round(Users.activeCount() / 20), 1, 5) },
};
const Missions = {
  active: null, result: null, nextAt: 30, people: null,
  rate(type) { let n = 0; for (const e of Game.recentEv) if (e.type === type) n += e.n; return n / 60; },
  uniq(sec) { const lim = gnow() - sec, s = new Set(); for (const e of Game.recentEv) if (e.t >= lim) s.add(e.uid); return s.size; },
  start(key) {
    if (Game.phase !== 'play' || Game.mode === 'duel' || this.active) return false;
    const act = Users.activeCount();
    let k = key && MISSION_TYPES[key] ? key : null;
    if (!k) {
      const opts = Object.entries(MISSION_TYPES).filter(([, d]) => !d.minActive || act >= d.minActive);
      let r = Math.random() * opts.reduce((a, [, d]) => a + d.w, 0);
      for (const [kk, d] of opts) { r -= d.w; if (r <= 0) { k = kk; break; } }
      k = k || 'comments';
    }
    const d = MISSION_TYPES[k], target = d.target(this);
    this.active = { key: k, icon: d.icon, dur: d.dur, target, got: 0, t: 0, label: d.label(target) };
    this.people = new Set(); this.result = null;
    Sound.missionStart();
    Bubbles.say(pick(['Ihr schafft das!', "Mission! Los geht's!", 'Hilfe naht!']), true);
    return true;
  },
  count(ev, u) {
    const m = this.active; if (!m) return;
    if (m.key === 'comments' && ev.type === 'chat') m.got++;
    else if (m.key === 'likes' && ev.type === 'like') m.got += Math.max(1, ev.count || 1);
    else if (m.key === 'people') { this.people.add(u.id); m.got = this.people.size; }
    else if (m.key === 'follow' && ev.type === 'follow') m.got++;
    else if (m.key === 'share' && ev.type === 'share') m.got++;
    if (m.got >= m.target) this.finish(true);
  },
  finish(ok) {
    const m = this.active; if (!m) return;
    this.active = null;
    this.result = { ok, t: 0, life: ok ? 3 : 2.4 };
    this.nextAt = gnow() + rand(CONFIG.missions.minGapSec, CONFIG.missions.maxGapSec);
    StatsLog.event('mission', { mode: Game.mode, type: m.key, target: m.target, got: m.got, ok: ok ? 1 : 0 });
    Sound.missionDone(ok);
    if (ok) { Game.callout('MEGA-RISS!', { color: '#bfffb0', size: 84, life: 2 }); Game.bonusHit(CONFIG.missions.rewardPct); }
  },
  cancel() { this.active = null; this.result = null; },
  update(dt) {
    if (this.result) { this.result.t += dt; if (this.result.t > this.result.life) this.result = null; }
    const m = this.active;
    if (m) { m.t += dt; if (Game.phase !== 'play') { this.active = null; return; } if (m.t >= m.dur) this.finish(false); return; }
    if (CONFIG.missions.enabled && Game.phase === 'play' && Game.mode !== 'duel' && gnow() > this.nextAt && Game.timeLeft > 25) this.start();
  },
};

/* Sprechblasen: das Ei redet – bei Flaute als Aufforderung, sonst als Reaktion */
const Bubbles = {
  cur: null, lastAt: -99,
  IDLE: ['Hallo? Ist da wer?', 'Schreib was – dann wackel ich!', 'Ich will hier raus!', 'Kitzel mich mit Kommentaren!',
    'Psst … ein Kommentar = ein Stoß!', 'Mir ist sooo langweilig …', 'Wer knackt mich als Erstes?', 'Likes machen mich ganz wackelig!'],
  HIT: ['Aua!', 'Hihi, das kitzelt!', 'Mehr! Mehr!', 'Huiii!', 'Noch mal!', 'Das war stark!'],
  STAGE: ['Da knackt was!', 'Ich seh schon Licht!', 'Gleich bin ich draußen!', 'FAST!!'],
  say(text, force, egg) {
    if (!CONFIG.bubbles.enabled) return;
    if (!force && (gnow() - this.lastAt < 9 || (this.cur && this.cur.t < this.cur.life))) return;
    this.cur = { text, t: 0, life: 3.4, egg: egg || null }; this.lastAt = gnow();
  },
  update(dt) {
    if (this.cur) { this.cur.t += dt; if (this.cur.t > this.cur.life) this.cur = null; }
    if (Game.phase === 'play' && gnow() - Game.lastDamageAt > 12 && gnow() - this.lastAt > 15) this.say(pick(this.IDLE));
  },
};

/* Duell: "1"/"2" (auch "team 1", "#2", "1️⃣") erkennen */
function parseTeam(text) {
  if (!text) return 0;
  const s = String(text).trim().toLowerCase().replace(/️|⃣/g, '');
  const m = s.match(/^(?:team\s*|#)?([12])(?:\s*[!.]*)$/);
  return m ? Number(m[1]) : 0;
}

/* ==========================================================================
   Persistenz: Herde, Bestenlisten, Sammlungen, laufendes Ei (alle 10 s)
   ========================================================================== */
Persist.snapshot = function () {
  let round = null;
  if (Game.phase === 'play' && Game.eggs.length && Game.eggs.every(e => e.state === 'idle' || e.state === 'drop')) {
    round = { mode: Game.mode, timeLeft: Game.timeLeft, duration: Game.duration,
      eggs: Game.eggs.map(e => ({ team: e.team, maxHp: e.maxHp, hp: e.hp, seed: e.seed, palIdx: e.palIdx, pattern: e.pattern, last: e.lastHitter, soft: e.soft,
        contrib: [...e.contrib.entries()].sort((a, b) => b[1].d - a[1].d).slice(0, 300) })) };
  } else if (Game.phase === 'intro') round = { introMode: Game.mode };
  return {
    v: 1, savedAt: Date.now(), eggNumber: Game.eggNumber, normalsSince: Game.normalsSince, specialIdx: Game.specialIdx, override: Game.override, softer: Game.softer,

/* ==========================================================================
   11a. Materialien & Icons – Stein, Holz, Pergament und gezeichnete Symbole.
        Alles prozedural und zwischengespeichert. Ersetzt generische
        "Glas-Pillen" und Emojis durch einen Steinzeit-Bilderbuch-Look.

const Mat = {
  cache: new Map(), P: 12,
  cached(key, make) { let c = this.cache.get(key); if (!c) { c = make(); this.cache.set(key, c); if (this.cache.size > 400) this.cache.delete(this.cache.keys().next().value); } return c; },
  cv(w, h) { const c = document.createElement('canvas'); c.width = Math.ceil(w); c.height = Math.ceil(h); return c; },
  put(ctx, c, x, y) { ctx.drawImage(c, x - this.P, y - this.P); },
  /* leicht unregelmäßige Rundform – wirkt "von Hand gehauen" statt maschinell */
  blob(g, x, y, w, h, r, seed, wob = 1) {
    const rnd = mulberry32(seed * 2654435761 >>> 0);
    const rc = [0, 1, 2, 3].map(() => r * (0.65 + rnd() * 0.7)), j = () => (rnd() - 0.5) * 3.2 * wob;
    g.beginPath();
    g.moveTo(x + rc[0], y + j());
    g.lineTo(x + w * 0.33, y + j()); g.lineTo(x + w * 0.67, y + j()); g.lineTo(x + w - rc[1], y + j());
    g.quadraticCurveTo(x + w + j(), y + j(), x + w + j(), y + rc[1]);
    g.lineTo(x + w + j(), y + h * 0.5); g.lineTo(x + w + j(), y + h - rc[2]);
    g.quadraticCurveTo(x + w + j(), y + h + j(), x + w - rc[2], y + h + j());
    g.lineTo(x + w * 0.67, y + h + j()); g.lineTo(x + w * 0.33, y + h + j()); g.lineTo(x + rc[3], y + h + j());
    g.quadraticCurveTo(x + j(), y + h + j(), x + j(), y + h - rc[3]);
    g.lineTo(x + j(), y + h * 0.5); g.lineTo(x + j(), y + rc[0]);
    g.quadraticCurveTo(x + j(), y + j(), x + rc[0], y + j());
    g.closePath();
  },
  bevel(g, path, light = 'rgba(255,248,228,0.38)', dark = 'rgba(45,30,15,0.32)') {
    g.lineWidth = 9;
    g.save(); g.translate(0, 5); path(); g.strokeStyle = light; g.stroke(); g.restore();
    g.save(); g.translate(0, -5); path(); g.strokeStyle = dark; g.stroke(); g.restore();
  },
  /* Steinplatte (optional eingefärbt) */
  stone(w, h, seed = 1, tint = null) {
    return this.cached(`s|${w}|${h}|${seed}|${tint}`, () => {
      const P = this.P, c = this.cv(w + P * 2, h + P * 2), g = c.getContext('2d'), rnd = mulberry32(seed * 7919);
      const path = () => this.blob(g, P, P, w, h, Math.min(30, h * 0.34), seed);
      g.save(); g.translate(0, 6); path(); g.fillStyle = 'rgba(40,24,10,0.34)'; g.fill(); g.restore();
      path(); const gr = g.createLinearGradient(0, P, 0, P + h);
      gr.addColorStop(0, tint ? shade(tint, 0.22) : '#bcae96'); gr.addColorStop(1, tint ? shade(tint, -0.2) : '#8a7c67');
      g.fillStyle = gr; g.fill();
      g.save(); path(); g.clip();
      for (let i = 0; i < 7; i++) { g.fillStyle = rnd() < 0.5 ? 'rgba(60,45,30,0.08)' : 'rgba(255,250,235,0.08)'; g.beginPath(); g.ellipse(P + rnd() * w, P + rnd() * h, 20 + rnd() * w * 0.3, 10 + rnd() * h * 0.35, rnd() * 3, 0, TAU); g.fill(); }
      for (let i = 0; i < w * h / 700; i++) { g.fillStyle = rnd() < 0.55 ? 'rgba(70,56,42,0.32)' : 'rgba(245,236,215,0.32)'; g.beginPath(); g.arc(P + rnd() * w, P + rnd() * h, 0.7 + rnd() * 2, 0, TAU); g.fill(); }
      g.strokeStyle = 'rgba(64,50,36,0.5)'; g.lineWidth = 2; g.lineJoin = 'round';
      for (let k = 0; k < 2; k++) {
        const left = rnd() < 0.5; let x = left ? P + rnd() * 20 : P + w - rnd() * 20, y = P + h * (0.2 + rnd() * 0.6);
        g.beginPath(); g.moveTo(x, y);
        for (let i = 0; i < 5; i++) { x += (left ? 1 : -1) * (6 + rnd() * 16); y += (rnd() - 0.5) * 18; g.lineTo(x, y); }
        g.stroke();
      }
      this.bevel(g, path);
      g.restore();
      path(); g.lineWidth = 6; g.lineJoin = 'round'; g.strokeStyle = OUTLINE; g.stroke();
      return c;
    });
  },
  /* Holzbrett(er) mit Maserung, Astlöchern und Nägeln */
  wood(w, h, seed = 1) {
    return this.cached(`w|${w}|${h}|${seed}`, () => {
      const P = this.P, c = this.cv(w + P * 2, h + P * 2), g = c.getContext('2d'), rnd = mulberry32(seed * 104729);
      const path = () => this.blob(g, P, P, w, h, Math.min(16, h * 0.18), seed, 0.7);
      g.save(); g.translate(0, 6); path(); g.fillStyle = 'rgba(40,24,10,0.34)'; g.fill(); g.restore();
      path(); g.fillStyle = '#a8713f'; g.fill();
      g.save(); path(); g.clip();
      const n = Math.max(1, Math.round(h / 70)), ph = h / n;
      for (let i = 0; i < n; i++) {
        const y0 = P + i * ph, gr = g.createLinearGradient(0, y0, 0, y0 + ph);
        gr.addColorStop(0, i % 2 ? '#b98450' : '#c18d58'); gr.addColorStop(1, i % 2 ? '#8e5b2d' : '#965f30');
        g.fillStyle = gr; g.fillRect(0, y0, c.width, ph + 1);
        g.strokeStyle = 'rgba(88,52,22,0.42)'; g.lineWidth = 2;
        for (let k = 0; k < 3 + ph / 13; k++) {
          const yy = y0 + 5 + rnd() * (ph - 10), ph2 = rnd() * 6;
          g.beginPath(); g.moveTo(0, yy); for (let x = 0; x <= c.width; x += 30) g.lineTo(x, yy + Math.sin(x * 0.018 + ph2) * 3); g.stroke();
        }
        if (rnd() < 0.65) {
          const kx = P + 50 + rnd() * (w - 100), ky = y0 + ph * (0.3 + rnd() * 0.4);
          g.fillStyle = '#74441d'; g.beginPath(); g.ellipse(kx, ky, 9 + rnd() * 7, 4 + rnd() * 3, 0, 0, TAU); g.fill();
          g.strokeStyle = 'rgba(88,52,22,0.5)'; g.beginPath(); g.ellipse(kx, ky, 17 + rnd() * 6, 8 + rnd() * 2, 0, 0, TAU); g.stroke();
        }
        if (i > 0) { g.fillStyle = OUTLINE; g.fillRect(0, y0 - 2, c.width, 4); g.fillStyle = 'rgba(255,225,180,0.25)'; g.fillRect(0, y0 + 2, c.width, 2); }
        for (const nx of [P + 18, P + w - 18]) {
          g.fillStyle = '#4e3b2c'; g.beginPath(); g.arc(nx, y0 + ph / 2, 5.5, 0, TAU); g.fill();
          g.fillStyle = 'rgba(255,240,210,0.65)'; g.beginPath(); g.arc(nx - 1.8, y0 + ph / 2 - 1.8, 1.8, 0, TAU); g.fill();
        }
      }
      this.bevel(g, path, 'rgba(255,225,180,0.28)', 'rgba(40,20,5,0.3)');
      g.restore();
      path(); g.lineWidth = 6; g.lineJoin = 'round'; g.strokeStyle = OUTLINE; g.stroke();
      return c;
    });
  },
  /* Pergament mit gerissenen Kanten, optional als Schriftrolle mit Holzstäben */
  paper(w, h, seed = 1, rods = false) {
    return this.cached(`p|${w}|${h}|${seed}|${rods}`, () => {
      const P = this.P, c = this.cv(w + P * 2, h + P * 2), g = c.getContext('2d'), rnd = mulberry32(seed * 31337);
      const x0 = P + (rods ? 16 : 0), x1 = P + w - (rods ? 16 : 0);
      const path = () => {
        const r2 = mulberry32(seed * 31337 + 7); g.beginPath(); g.moveTo(x0, P + 4);
        for (let x = x0 + 16; x < x1; x += 16) g.lineTo(x, P + 1 + r2() * 6);
        g.lineTo(x1, P + 4); g.lineTo(x1 + (rods ? 0 : 2), P + h * 0.5); g.lineTo(x1, P + h - 4);
        for (let x = x1 - 16; x > x0; x -= 16) g.lineTo(x, P + h - 1 - r2() * 6);
        g.lineTo(x0, P + h - 4); g.lineTo(x0 - (rods ? 0 : 2), P + h * 0.5); g.closePath();
      };
      g.save(); g.translate(0, 5); path(); g.fillStyle = 'rgba(40,24,10,0.28)'; g.fill(); g.restore();
      path(); const gr = g.createLinearGradient(0, P, 0, P + h); gr.addColorStop(0, '#fbf0d6'); gr.addColorStop(1, '#ecdab2'); g.fillStyle = gr; g.fill();
      g.save(); path(); g.clip();
      g.strokeStyle = 'rgba(150,118,76,0.2)'; g.lineWidth = 1.2;
      for (let i = 0; i < w * h / 1100; i++) { const x = P + rnd() * w, y = P + rnd() * h; g.beginPath(); g.moveTo(x, y); g.lineTo(x + (rnd() - 0.5) * 16, y + (rnd() - 0.5) * 4); g.stroke(); }
      for (let i = 0; i < 3; i++) { g.fillStyle = 'rgba(170,130,70,0.06)'; g.beginPath(); g.ellipse(P + rnd() * w, P + rnd() * h, 30 + rnd() * 60, 15 + rnd() * 25, rnd() * 3, 0, TAU); g.fill(); }
      const vg = g.createRadialGradient(P + w / 2, P + h / 2, Math.min(w, h) * 0.35, P + w / 2, P + h / 2, Math.max(w, h) * 0.62);
      vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(150,105,50,0.22)'); g.fillStyle = vg; g.fillRect(0, 0, c.width, c.height);
      g.restore();
      path(); g.lineWidth = 4; g.lineJoin = 'round'; g.strokeStyle = OUTLINE; g.stroke();
      if (rods) for (const rx of [P + 10, P + w - 10]) {
        g.fillStyle = '#9b6434'; g.strokeStyle = OUTLINE; g.lineWidth = 4;
        g.beginPath(); rr(g, rx - 11, P - 4, 22, h + 8, 11); g.fill(); g.stroke();
        g.fillStyle = 'rgba(255,225,180,0.35)'; g.fillRect(rx - 5, P + 4, 4, h - 8);
        for (const yy of [P - 6, P + h + 6]) { g.fillStyle = '#7a4920'; g.beginPath(); g.arc(rx, yy, 10, 0, TAU); g.fill(); g.stroke(); }
      }
      return c;
    });
  },
  /* runde Steinscheibe mit farbigem Ring (Duell-Abzeichen) */
  disc(r, seed, ring) {
    return this.cached(`d|${r}|${seed}|${ring}`, () => {
      const P = this.P, c = this.cv(r * 2 + P * 2, r * 2 + P * 2), g = c.getContext('2d'), rnd = mulberry32(seed * 977);
      const cx = P + r, cy = P + r, path = () => { g.beginPath(); for (let i = 0; i <= 28; i++) { const a = i / 28 * TAU, rr2 = r * (0.97 + (i % 28 ? rnd() * 0.06 : 0)); g.lineTo(cx + Math.cos(a) * rr2, cy + Math.sin(a) * rr2); } g.closePath(); };
      g.save(); g.translate(0, 5); path(); g.fillStyle = 'rgba(40,24,10,0.34)'; g.fill(); g.restore();
      path(); const gr = g.createLinearGradient(0, cy - r, 0, cy + r); gr.addColorStop(0, '#bcae96'); gr.addColorStop(1, '#8a7c67'); g.fillStyle = gr; g.fill();

      for (let i = 0; i < r * r / 60; i++) { g.fillStyle = rnd() < 0.5 ? 'rgba(70,56,42,0.3)' : 'rgba(245,236,215,0.3)'; g.beginPath(); g.arc(cx + (rnd() - 0.5) * r * 2, cy + (rnd() - 0.5) * r * 2, 0.8 + rnd() * 1.8, 0, TAU); g.fill(); }
      this.bevel(g, path); g.restore();
      path(); g.lineWidth = 6; g.strokeStyle = OUTLINE; g.stroke();

    });
  },
  /* eingemeißelte Rinne (für Fortschrittsbalken) */
  groove(ctx, x, y, w, h) {
    ctx.beginPath(); rr(ctx, x, y, w, h, h / 2); ctx.fillStyle = '#4a3a2b'; ctx.fill();
    ctx.save(); ctx.clip(); ctx.fillStyle = 'rgba(0,0,0,0.32)'; ctx.fillRect(x, y, w, h * 0.32); ctx.restore();
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,245,225,0.35)'; ctx.beginPath(); ctx.moveTo(x + h / 2, y + h + 2); ctx.lineTo(x + w - h / 2, y + h + 2); ctx.stroke();
  },
  /* Flüssigkeit in einer Rinne (horizontal) */
  liquid(ctx, x, y, w, h, p, c1, c2, t = 0) {
    if (p <= 0.001) return;
    ctx.save(); ctx.beginPath(); rr(ctx, x, y, w, h, h / 2); ctx.clip();
    const fw = Math.max(h * 0.6, w * p), g = ctx.createLinearGradient(x, 0, x + w, 0); g.addColorStop(0, c1); g.addColorStop(1, c2);
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(x, y);
    for (let yy = 0; yy <= h; yy += 4) ctx.lineTo(x + fw + Math.sin(yy * 0.25 + t * 6) * 2.5, y + yy);
    ctx.lineTo(x, y + h); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,240,0.32)'; ctx.fillRect(x + 4, y + 4, Math.max(0, fw - 12), h * 0.24);

  carve(ctx, x0, y0, x1, y1) {

    ctx.strokeStyle = 'rgba(255,245,225,0.28)'; ctx.beginPath(); ctx.moveTo(x0 + 1, y0 + 3); ctx.lineTo(x1 + 1, y1 + 3); ctx.stroke();
  },
};

/* Zeile aus Text- und Symbol-Stücken: ['Text', {i: 'heart'}, ' mehr Text'] */
function drawRich(ctx, segs, cx, y, o = {}) {
  const size = o.size || 36, isz = size * 1.1, gap = size * 0.18;
  const ws = segs.map(s => typeof s === 'string' ? measureText(ctx, s, size, o.font) : isz + gap);
  const total = ws.reduce((a, b) => a + b, 0), sx = o.maxWidth && total > o.maxWidth ? o.maxWidth / total : 1;
  let x = cx - total * sx / 2;
  ctx.save(); ctx.translate(x, y); ctx.scale(sx, 1); x = 0;
  segs.forEach((s, i) => {
    if (typeof s === 'string') drawText(ctx, s, x, 0, Object.assign({}, o, { align: 'left', maxWidth: null }));
    else Icon.draw(ctx, s.i, x + isz / 2, 0, isz, o.t || 0);
    x += ws[i];
  });
  ctx.restore();
}

/* Papierkörnung + Vignette. In der Höhle nur eine dunkle Vignette (wird VOR dem HUD gezeichnet). */

/* ==========================================================================
   11b. Glas-Look (wie im Mockup): dunkle, halbtransparente Tafeln mit feiner
        heller Kante, Pillen-Schilder, glühende Fortschrittsbalken. Gecacht.
   ========================================================================== */
const hexA = (hex, a) => rgbStr(hexToRgb(hex), a);

  cache: new Map(), P: 28,
  panel(w, h, r = 26, o = {}) {
    w = Math.round(w); h = Math.round(h);
    const key = [w, h, r, o.tint || '', o.border || '', o.alpha || '', o.glow || ''].join('|');
    let c = this.cache.get(key); if (c) return c;
    const P = this.P; c = Mat.cv(w + P * 2, h + P * 2); const g = c.getContext('2d');
    if (o.glow) { g.save(); g.shadowColor = o.glow; g.shadowBlur = 26; g.beginPath(); rr(g, P, P, w, h, r); g.strokeStyle = o.glow; g.lineWidth = 5; g.stroke(); g.restore(); }
    g.save(); g.shadowColor = 'rgba(0,0,0,0.55)'; g.shadowBlur = 22; g.shadowOffsetY = 8;
    g.beginPath(); rr(g, P, P, w, h, r); g.fillStyle = `rgba(17,13,12,${o.alpha || 0.64})`; g.fill(); g.restore();
    g.save(); g.beginPath(); rr(g, P, P, w, h, r); g.clip();
    if (o.tint) { g.fillStyle = o.tint; g.fillRect(P, P, w, h); }
    const hl = g.createLinearGradient(0, P, 0, P + Math.min(h, 140)); hl.addColorStop(0, 'rgba(255,238,215,0.12)'); hl.addColorStop(1, 'rgba(255,238,215,0)');
    g.fillStyle = hl; g.fillRect(P, P, w, h);
    g.restore();
    const bd = g.createLinearGradient(0, P, 0, P + h);
    bd.addColorStop(0, o.border || 'rgba(255,236,210,0.4)'); bd.addColorStop(1, o.border || 'rgba(255,236,210,0.1)');
    g.beginPath(); rr(g, P + 1, P + 1, w - 2, h - 2, Math.max(2, r - 1)); g.lineWidth = o.border ? 2.5 : 2; g.strokeStyle = bd; g.stroke();

  },
  draw(ctx, x, y, w, h, r, o) { ctx.drawImage(this.panel(w, h, r, o), x - this.P, y - this.P); },
  /* Pillen-Schild (Namen, Hinweise) */
  tag(ctx, text, x, y, o = {}) {
    const size = o.size || 28, h = Math.round(size * 1.48), padX = Math.round(size * 0.62), lead = o.icon ? size * 1.1 : 0;
    const tw = measureText(ctx, text, size), w = Math.min(o.maxW || 420, tw + padX * 2 + lead);
    ctx.save(); if (o.alpha != null) ctx.globalAlpha *= o.alpha;
    ctx.beginPath(); rr(ctx, x - w / 2, y - h / 2, w, h, h / 2);
    ctx.fillStyle = o.fill || 'rgba(16,12,11,0.72)'; ctx.fill();
    ctx.lineWidth = 1.6; ctx.strokeStyle = o.border || 'rgba(255,238,215,0.26)'; ctx.stroke();
    if (o.icon) Icon.draw(ctx, o.icon, x - w / 2 + padX * 0.55 + size * 0.5, y - 1, size * 1.05);
    drawText(ctx, text, x + lead / 2, y + 1, { size, color: o.color || '#f4ede4', stroke: false, maxWidth: w - padX * 2 - lead });
    ctx.restore();
    return w;
  },
  /* Fortschrittsbalken: dunkle Rinne, glühende Füllung mit wandernder Lichtwelle */
  bar(ctx, x, y, w, h, p, c1, c2, t = 0, o = {}) {
    ctx.save();
    ctx.beginPath(); rr(ctx, x, y, w, h, h / 2); ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fill();
    ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(255,238,215,0.2)'; ctx.stroke();
    if (p > 0.002) {

      ctx.fillStyle = g; ctx.beginPath(); rr(ctx, x, y, fw, h, h / 2); ctx.fill();
      const wx = x + ((t * 170) % (fw + 140)) - 70, wg = ctx.createLinearGradient(wx - 55, 0, wx + 55, 0);
      wg.addColorStop(0, 'rgba(255,255,255,0)'); wg.addColorStop(0.5, 'rgba(255,250,225,0.3)'); wg.addColorStop(1, 'rgba(255,255,255,0)');

      ctx.fillStyle = 'rgba(255,255,240,0.32)'; ctx.fillRect(x + h / 2, y + h * 0.13, Math.max(0, fw - h), h * 0.18);
      if (o.edge !== false) { ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.55 + Math.sin(t * 8) * 0.2; const es = h * 1.5; ctx.drawImage(softBlob(o.edgeColor || '#ffb347'), x + fw - es, y + h / 2 - es, es * 2, es * 2); }
    }
    ctx.restore();
  },
  /* Überschrift in der Serifenschrift, leicht gesperrt */
  title(ctx, text, x, y, size, color = '#f3e6cf', align = 'center') {
    const sp = 'letterSpacing' in ctx;

      for (let y = 0; y < 460; y += 2) for (let x = 0; x < 520; x += 2) if (d[(y * 520 + x) * 4 + 3] > 20) { if (x < minX) minX = x; if (x > maxX) maxX = x; if (y < minY) minY = y; if (y > maxY) maxY = y; }

  /* Steinnest: hintere Hälfte hinter dem Ei, vordere davor (Bild) – sonst das gezeichnete Nest */
  rockNest(rx) {

  /* ---------- Linke Karte: Mission hat Vorrang vor "So geht's" ---------- */
  card(ctx, x, y, w, h, tag, tagColor, o) {
    Glass.draw(ctx, x, y, w, h, 26, o);

  },
  drawInfo(ctx, t) {
    if (CONFIG.infoBanner.always) {                   // Regeln stehen immer da – nur eine Mission verdrängt sie kurz
      const dt = clamp(t - (this._infoT || t), 0, 0.1); this._infoT = t;
      const target = Missions.active || Missions.result ? 0 : 1;
      this.infoK = clamp((this.infoK || 0) + (target ? dt / 0.55 : -dt / 0.25), 0, 1);
      if (this.infoK <= 0.001) return;
      const k = easeOutCubic(this.infoK), [x0, , w] = this.L.left;
      this.infoCard(ctx, lerp(-w - 40, x0, k), k, t);
      return;
    }
    if (Game.phase === 'reveal' || Missions.active || Missions.result) {     // Karte/Mission haben Vorrang → danach zeigen
      if (t > this.infoNext - 1) this.infoNext = t + 1;
      if (t - this.infoStart < CONFIG.infoBanner.showSec) this.infoStart = -99;
      return;
    }
    if (t > this.infoNext) { this.infoStart = t; this.infoNext = t + CONFIG.infoBanner.everySec; }
    const k = t - this.infoStart, dur = CONFIG.infoBanner.showSec;
    if (k < 0 || k > dur) return;
    const inK = easeOutCubic(clamp(k / 0.5, 0, 1)), outK = clamp((dur - k) / 0.4, 0, 1);
    const [x0, , w] = this.L.left;
    this.infoCard(ctx, lerp(-w - 40, x0, inK), outK, t);
  },
  /* Regel-Karte "So geht's"; alle infoBanner.everySec läuft ein Lichtschimmer darüber (Blickfang) */
  infoCard(ctx, x, alpha, t) {
    const [, y, w] = this.L.left, h = this.L.cardH;
    const lines = Game.mode === 'duel'

    ctx.save(); ctx.globalAlpha = alpha;
    this.card(ctx, x, y, w, h, "SO GEHT'S");
    lines.forEach(([ic, txt], i) => { const ly = y + 72 + i * 34; Icon.draw(ctx, ic, x + 44, ly, 30); drawText(ctx, txt, x + 72, ly + 1, { size: 30, align: 'left', color: this.TXT, stroke: false, maxWidth: w - 96 }); });
    const sk = (t % Math.max(10, CONFIG.infoBanner.everySec)) / 1.4;
    if (sk < 1) {
      const sx = x - 120 + sk * (w + 240), g = ctx.createLinearGradient(sx - 90, 0, sx + 90, 0);
      g.addColorStop(0, 'rgba(255,230,180,0)'); g.addColorStop(0.5, 'rgba(255,230,180,0.16)'); g.addColorStop(1, 'rgba(255,230,180,0)');
      ctx.beginPath(); rr(ctx, x, y, w, h, 26); ctx.clip(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
    }
    ctx.restore();
  },
  drawMission(ctx, t) {

      const inK = easeOutBack(clamp(m.t / 0.45, 0, 1)), left = Math.max(0, m.dur - m.t), urgent = left < 6;
      ctx.save(); ctx.translate(cx, cy); ctx.scale(inK, inK); if (urgent) ctx.translate(Math.sin(t * 40) * 2, 0); ctx.translate(-cx, -cy);

      const lines = wrapText(ctx, m.label, 34, w - 100, 'title').slice(0, 2), ly0 = y + (lines.length > 1 ? 80 : 96);
      Icon.draw(ctx, Icon.EMOJI[m.icon] || 'target', x + 44, ly0 + (lines.length > 1 ? 19 : 0), 44);

  /* ---------- Hype: Glas-Säule mit Lava ---------- */
  drawHype(ctx, t) {
    if (!CONFIG.hype.enabled) return;
    const [x, y0, w, h] = this.L.hype, on = Hype.active > 0;
    if (on) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.5 + Math.sin(t * 12) * 0.25; ctx.drawImage(softBlob('#ff7a2f'), x - 60, y0 - 50, w + 120, h + 100); ctx.restore(); }
    Glass.draw(ctx, x, y0, w, h, w / 2);
    const gx = x + 11, gy = y0 + 11, gw = w - 22, gh = h - 22;
    ctx.beginPath(); rr(ctx, gx, gy, gw, gh, gw / 2); ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fill();
    const fh = gh * clamp(Hype.value, 0, 1);

      ctx.save(); ctx.beginPath(); rr(ctx, gx, gy, gw, gh, gw / 2); ctx.clip();
      const g = ctx.createLinearGradient(0, gy + gh, 0, gy); g.addColorStop(0, '#ffd34a'); g.addColorStop(0.55, '#ff8a2f'); g.addColorStop(1, '#e2412e');
      ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(gx, gy + gh);

      ctx.lineTo(gx + gw, gy + gh); ctx.closePath(); ctx.fill();
      if (on) { ctx.fillStyle = 'rgba(255,240,180,0.75)'; for (let i = 0; i < 5; i++) { const by = gy + gh - ((t * 60 + i * 61) % fh); ctx.beginPath(); ctx.arc(gx + gw / 2 + Math.sin(i * 2 + t * 3) * 5, by, 3 + (i % 2), 0, TAU); ctx.fill(); } }

    Icon.draw(ctx, 'flame', x + w / 2, y0 - 30, 54 + (on ? Math.sin(t * 14) * 6 : 0), t);

  },

  /* ---------- Bestenliste "TOP KNACKER" (rechts oben, groß) ---------- */
  drawBoard(ctx, t) {
    if (Game.mode === 'duel' || Game.phase === 'reveal') return;
    const kinds = ['egg', 'today', 'all'];
    if (t > this.board.switchAt) { this.board.kindIdx = (this.board.kindIdx + 1) % 3; this.board.switchAt = t + CONFIG.leaderboard.rotateSec; Game.boardDirty = true; }
    const kind = kinds[this.board.kindIdx];
    if (Game.boardDirty || !this.board.img || t - (this.board.at || 0) > 1) {
      Game.boardDirty = false; this.board.at = t;
      const rows = Board.top(kind, 5);
      const sig = kind + (CONFIG.avatars.enabled ? 'A' : '') + [...Game.kings].join(',') + rows.map(r => { const u = Users.map.get(r.id); return r.name + Math.round(r.pts) + (u && Avatars.get(u) ? '*' : ''); }).join('|');
      if (sig !== this.board.sig) { this.board.sig = sig; this.board.img = this.renderBoard(kind, rows); }
    }
    const [x, y] = this.L.board;
    ctx.drawImage(this.board.img, x - Glass.P, y - Glass.P);
  },
  renderBoard(kind, rows) {
    const W = this.L.board[2], head = 108, rowH = 70, H = head + rowH * 5 + 16, P = Glass.P;
    const c = Mat.cv(W + P * 2, H + P * 2), g = c.getContext('2d');
    g.drawImage(Glass.panel(W, H, 30), 0, 0);
    g.translate(P, P);
    Glass.title(g, 'TOP KNACKER', W / 2, 42, 38);
    const tabs = [['egg', 'dieses Ei'], ['today', 'heute'], ['all', 'gesamt']];
    const tw = tabs.map(([, l]) => measureText(g, l, 21) + 28), total = tw.reduce((a, b) => a + b, 0) + 16;
    let px = W / 2 - total / 2;
    tabs.forEach(([k, l], i) => {
      const on = k === kind;
      g.beginPath(); rr(g, px, 68, tw[i], 30, 15); g.fillStyle = on ? 'rgba(242,193,78,0.92)' : 'rgba(255,238,215,0.08)'; g.fill();
      drawText(g, l, px + tw[i] / 2, 84, { size: 21, color: on ? '#2a1a0c' : 'rgba(243,230,207,0.72)', stroke: false });
      px += tw[i] + 8;
    });
    g.fillStyle = 'rgba(255,238,215,0.16)'; g.fillRect(22, head, W - 44, 1.5);
    if (!rows.length) {
      drawText(g, 'Noch niemand –', W / 2, head + 150, { size: 34, color: this.TXT, stroke: false });
      drawText(g, 'schreib was!', W / 2, head + 196, { size: 34, color: '#ffd35c', stroke: false });
      return c;
    }
    const RANK = ['#f2c14e', '#dfe3e8', '#e3985a', '#b9ab9b', '#b9ab9b'];
    rows.forEach((r, i) => {
      const cy = head + 8 + rowH * i + rowH / 2, u = Users.map.get(r.id);
      if (i === 0) {
        const hg = g.createLinearGradient(0, 0, W, 0); hg.addColorStop(0, 'rgba(242,193,78,0.2)'); hg.addColorStop(1, 'rgba(242,193,78,0)');
        g.fillStyle = hg; g.beginPath(); rr(g, 10, cy - rowH / 2 + 4, W - 20, rowH - 8, 18); g.fill();
      }
      drawText(g, (i + 1) + '.', 40, cy + 2, { size: 32, font: 'serif', color: RANK[i], stroke: false });
      if (u) Avatars.draw(g, u, 96, cy, 27, RANK[i]);
      else { g.beginPath(); g.arc(96, cy, 27, 0, TAU); g.fillStyle = '#5a5148'; g.fill(); }
      let nx = 136;
      if (kind === 'egg' && i === 0 && Game.kings.has(r.id)) { Icon.draw(g, 'crown', nx + 14, cy - 1, 30); nx += 34; }
      const pts = fmtPts(r.pts), pw = measureText(g, pts, 28);
      drawText(g, r.name, nx, cy + 1, { size: 31, align: 'left', color: '#f7efe4', stroke: false, maxWidth: W - nx - pw - 36 });
      drawText(g, pts, W - 24, cy + 1, { size: 28, align: 'right', color: i === 0 ? '#ffd35c' : this.SOFT, stroke: false });
      if (i < rows.length - 1) { g.fillStyle = 'rgba(255,238,215,0.08)'; g.fillRect(28, cy + rowH / 2, W - 56, 1); }
    });
    return c;
  },
