function getPath(obj, path) { return path.split('.').reduce((o, k) => (o == null ? undefined : o[k]), obj); }
function setPath(obj, path, val) { const ks = path.split('.'); let o = obj; for (let i = 0; i < ks.length - 1; i++) { if (typeof o[ks[i]] !== 'object' || o[ks[i]] === null) o[ks[i]] = {}; o = o[ks[i]]; } o[ks[ks.length - 1]] = val; }

/* Farben */
function hexToRgb(h) { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }

/* Text mit kräftiger Kontur. Emojis werden nur gefüllt (Kontur um Emojis sieht unschön aus). */
const FONT_STACK = 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';

function measureText(ctx, text, size, weight = 900) { ctx.font = fontStr(size, weight); return ctx.measureText(text).width; }

function drawText(ctx, text, x, y, o = {}) {
  text = String(text);

  ctx.font = fontStr(size, o.weight || 900);
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left';

  const widths = parts.map(p => ctx.measureText(p).width);
  const total = widths.reduce((a, b) => a + b, 0);
  const sx = o.maxWidth && total > o.maxWidth ? o.maxWidth / total : 1;
  const w = total * sx;
  const start = o.align === 'left' ? x : o.align === 'right' ? x - w : x - w / 2;
  const sw = o.stroke === false ? 0 : (o.strokeWidth != null ? o.strokeWidth : Math.max(4, size * 0.17));
  ctx.save();
  if (o.alpha != null) ctx.globalAlpha *= o.alpha;
  ctx.translate(start, y);
  ctx.scale(sx, 1);
  ctx.lineJoin = 'round'; ctx.miterLimit = 2;
  const strokeCol = o.strokeColor || OUTLINE;
  if (sw > 0) {

      let cx = 0; for (let i = 0; i < parts.length; i++) { if (!EMOJI_TEST.test(parts[i])) ctx.strokeText(parts[i], cx, size * 0.08); cx += widths[i]; }

    let cx = 0; for (let i = 0; i < parts.length; i++) { if (!EMOJI_TEST.test(parts[i])) ctx.strokeText(parts[i], cx, 0); cx += widths[i]; }
  }
  ctx.fillStyle = o.color || '#fff';
  let cx = 0; for (let i = 0; i < parts.length; i++) { ctx.fillText(parts[i], cx, 0); cx += widths[i]; }
  ctx.restore();
  return w;
}

/* Text auf mehrere Zeilen umbrechen, damit er in maxWidth passt */
function wrapText(ctx, text, size, maxWidth, weight = 900) {
  ctx.font = fontStr(size, weight);
  const words = String(text).split(' '); const lines = []; let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxWidth && line) { lines.push(line); line = w; } else line = test;
  }
  if (line) lines.push(line);

}

/* weiches Leuchten/Staub als vorgerenderter Sprite (schneller als shadowBlur) */
const _blobCache = new Map();
function softBlob(color) {
  if (_blobCache.has(color)) return _blobCache.get(color);

  const rgb = hexToRgb(color);
  gr.addColorStop(0, rgbStr(rgb, 1)); gr.addColorStop(0.45, rgbStr(rgb, 0.55)); gr.addColorStop(1, rgbStr(rgb, 0));
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  _blobCache.set(color, c); return c;
}

function downloadFile(filename, content, mime = 'application/json') {

/* ==========================================================================

(function loadSettings() {

/* ==========================================================================
   6. Particles – Pool mit Obergrenze (60 fps auch bei vielen Events)
      layer 0 = Hintergrund (Rauch, Regen), 1 = Welt, 2 = ganz vorne
   ========================================================================== */
class Particles {
  constructor(max) { this.list = []; this.max = max; }
  spawn(p) {
    if (this.list.length >= this.max) {
      if (!p.important) return null;
      this.list.splice(0, 1);
    }
    const d = { x: 0, y: 0, vx: 0, vy: 0, g: 0, drag: 0, life: 1, t: 0, size: 10, grow: 0, rot: 0, vr: 0,
      color: '#ffffff', color2: null, alpha: 1, type: 'dot', layer: 1, fade: true };
    Object.assign(d, p);
    this.list.push(d); return d;
  }
  update(dt) {
    const L = this.list;
    for (let i = L.length - 1; i >= 0; i--) {
      const p = L[i];
      p.t += dt;
      if (p.t >= p.life) { L[i] = L[L.length - 1]; L.pop(); continue; }
      p.vy += p.g * dt;
      if (p.drag) { const k = Math.exp(-p.drag * dt); p.vx *= k; p.vy *= k; }
      p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; p.size += p.grow * dt;
      if (p.floor != null && p.y > p.floor) { p.y = p.floor; p.vy *= -0.35; p.vx *= 0.6; p.vr *= 0.5; }
    }
  }
  draw(ctx, layer) {
    for (const p of this.list) {
      if (p.layer !== layer) continue;
      const k = p.t / p.life;
      let a = p.alpha * (p.fade ? (k > 0.6 ? 1 - (k - 0.6) / 0.4 : 1) : 1);
      if (p.fadeIn) a *= Math.min(1, p.t / p.fadeIn);
      if (a <= 0.01) continue;
      ctx.globalAlpha = a;
      const s = Math.max(0.1, p.size);
      switch (p.type) {
        case 'shard': {
          ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
          ctx.beginPath(); ctx.moveTo(-s, -s * 0.5); ctx.lineTo(s * 0.9, -s * 0.7); ctx.lineTo(s * 0.4, s * 0.8); ctx.closePath();
          ctx.fillStyle = p.color; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = OUTLINE; ctx.stroke();
          if (p.color2) { ctx.fillStyle = p.color2; ctx.beginPath(); ctx.arc(0, 0, s * 0.25, 0, TAU); ctx.fill(); }
          ctx.restore(); break;
        }
        case 'blob': {                       // weicher Staub/Rauch/Glühen
          const img = softBlob(p.color);
          if (p.additive) ctx.globalCompositeOperation = 'lighter';
          ctx.drawImage(img, p.x - s, p.y - s, s * 2, s * 2);
          if (p.additive) ctx.globalCompositeOperation = 'source-over';
          break;
        }
        case 'spark': {
          ctx.globalCompositeOperation = 'lighter';
          ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, s, 0, TAU); ctx.fill();
          ctx.globalCompositeOperation = 'source-over'; break;
        }
        case 'star': {
          ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.color;
          ctx.beginPath();
          for (let i = 0; i < 8; i++) { const r = i % 2 ? s * 0.35 : s; const an = i * Math.PI / 4; ctx.lineTo(Math.cos(an) * r, Math.sin(an) * r); }
          ctx.closePath(); ctx.fill(); ctx.restore(); break;
        }
        case 'confetti': {
          ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.scale(1, Math.cos(p.t * 9 + p.size));
          ctx.fillStyle = p.color; ctx.fillRect(-s, -s * 0.45, s * 2, s * 0.9); ctx.restore(); break;
        }
        case 'heart': {
          ctx.save(); ctx.translate(p.x, p.y); ctx.scale(s / 20, s / 20); ctx.fillStyle = p.color;
          ctx.beginPath(); ctx.moveTo(0, 6); ctx.bezierCurveTo(-22, -8, -10, -24, 0, -12); ctx.bezierCurveTo(10, -24, 22, -8, 0, 6); ctx.fill();
          ctx.lineWidth = 3; ctx.strokeStyle = OUTLINE; ctx.stroke(); ctx.restore(); break;
        }
        case 'rain': {
          ctx.strokeStyle = p.color; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 0.03, p.y - p.vy * 0.03); ctx.stroke(); break;
        }
        case 'ring': {
          ctx.strokeStyle = p.color; ctx.lineWidth = Math.max(1, 10 * (1 - k)); ctx.beginPath(); ctx.ellipse(p.x, p.y, s, s * (p.squash || 1), 0, 0, TAU); ctx.stroke(); break;
        }
        case 'rock': {
          ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.color;
          ctx.beginPath(); ctx.moveTo(-s, 0); ctx.lineTo(-s * 0.3, -s); ctx.lineTo(s, -s * 0.4); ctx.lineTo(s * 0.6, s * 0.8); ctx.lineTo(-s * 0.5, s * 0.7); ctx.closePath();
          ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = OUTLINE; ctx.stroke(); ctx.restore(); break;
        }
        default: {
          ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, s, 0, TAU); ctx.fill();
        }
      }
    }
    ctx.globalAlpha = 1;
  }
}

  ell(c, x, y, rx, ry, rot = 0) { c.moveTo(x + rx * Math.cos(rot), y + rx * Math.sin(rot)); c.ellipse(x, y, rx, ry, rot, 0, TAU); },

  /* Dino zeichnen. o: {pal, t, walk(0..1), face(1|-1), scale, seed, blink, alpha} */
  drawDino(c, key, x, y, o) {
    const fn = this.species[key] || this.species.trex;
    const walk = o.walk || 0, t = o.t || 0;
    const phase = t * (7 + walk * 3);
    const A = {
      t, walk, seed: o.seed || 1,
      sw: walk ? Math.sin(phase) * 0.5 * walk : 0,
      bob: walk ? Math.abs(Math.sin(phase)) * 5 * walk : Math.sin(t * 2.2) * 1.5,
      blink: o.blink || 0,
    };
    c.save();
    c.translate(x, y);
    c.scale((o.face || 1) * o.scale, o.scale);
    if (o.rot) c.rotate(o.rot);
    if (o.alpha != null) c.globalAlpha *= o.alpha;
    c.lineJoin = 'round'; c.lineCap = 'round';
    fn(c, o.pal, A);
    c.restore();
  },

    const sw = walk ? Math.sin(ph) * 0.6 : 0;

const EGG_PALETTES = [
  { base: '#fff3c9', pat: '#ff9d5c' }, { base: '#c9f2ff', pat: '#3fa8ff' }, { base: '#ffd6ec', pat: '#ff5fae' },
  { base: '#d9ffcf', pat: '#4fbf3a' }, { base: '#e8dcff', pat: '#9b6bff' }, { base: '#fff0a8', pat: '#ff6b6b' },

const EggArt = {
  _paths: new Map(),
  /* Eiform: oben spitzer, unten runder; Mittelpunkt (0,0) */
  path(rx, ry) {
    const key = rx + 'x' + ry;
    let p = this._paths.get(key); if (p) return p;
    p = new Path2D(); const N = 72;
    for (let i = 0; i <= N; i++) {
      const t = i / N * TAU, s = Math.sin(t), co = Math.cos(t);
      const k = (1 - 0.14 * co) / 1.03;

  },
  texture(spec) {
    const pad = 14, W = Math.ceil(spec.rx * 2 + pad * 2), H = Math.ceil(spec.ry * 2 + pad * 2);
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    const g = cv.getContext('2d'); g.translate(W / 2, H / 2);
    const path = this.path(spec.rx, spec.ry);
    g.save(); g.clip(path);
    g.fillStyle = spec.base; g.fillRect(-W / 2, -H / 2, W, H);
    if (spec.boss) this.bossArmor(g, spec); else this.pattern(g, spec);

    gr.addColorStop(0, 'rgba(255,255,255,0.38)'); gr.addColorStop(0.5, 'rgba(255,255,255,0)'); gr.addColorStop(1, 'rgba(40,20,60,0.34)');

    g.restore();
    g.lineWidth = 10; g.lineJoin = 'round'; g.strokeStyle = OUTLINE; g.stroke(path);
    g.fillStyle = 'rgba(255,255,255,0.6)'; g.beginPath(); g.ellipse(-spec.rx * 0.42, -spec.ry * 0.47, spec.rx * 0.12, spec.ry * 0.19, 0.5, 0, TAU); g.fill();
    g.beginPath(); g.ellipse(-spec.rx * 0.55, -spec.ry * 0.18, spec.rx * 0.05, spec.ry * 0.06, 0.4, 0, TAU); g.fill();
    return cv;
  },
  pattern(g, spec) {
    const r = mulberry32(spec.seed), rx = spec.rx, ry = spec.ry;
    g.fillStyle = spec.pat; g.strokeStyle = spec.pat;
    switch (spec.pattern) {
      case 'spots':
        for (let i = 0; i < 16; i++) { g.beginPath(); g.ellipse((r() - 0.5) * rx * 2, (r() - 0.5) * ry * 2, 10 + r() * 26, 8 + r() * 20, r() * 3, 0, TAU); g.fill(); }
        break;
      case 'zigzag':
        g.lineWidth = rx * 0.13; g.lineJoin = 'round';
        for (const yy of [-0.35, 0.1, 0.55]) { g.beginPath(); for (let i = 0; i <= 10; i++) { const x = -rx * 1.1 + i * rx * 0.22, y = yy * ry + (i % 2 ? -1 : 1) * ry * 0.07; i ? g.lineTo(x, y) : g.moveTo(x, y); } g.stroke(); }
        break;
      case 'dots':
        for (let yy = -ry; yy < ry; yy += rx * 0.3) for (let xx = -rx; xx < rx; xx += rx * 0.3) { g.beginPath(); g.arc(xx + ((yy / (rx * 0.3)) % 2 ? rx * 0.15 : 0) + (r() - 0.5) * 6, yy + (r() - 0.5) * 6, rx * 0.065, 0, TAU); g.fill(); }
        break;
      case 'bands':
        for (const [yy, h] of [[-0.42, 0.12], [0.05, 0.2], [0.55, 0.12]]) { g.beginPath(); g.moveTo(-rx * 1.2, yy * ry); for (let i = 0; i <= 12; i++) g.lineTo(-rx * 1.2 + i * rx * 0.2, yy * ry + Math.sin(i * 1.3) * 8); g.lineTo(rx * 1.2, (yy + h) * ry); g.lineTo(-rx * 1.2, (yy + h) * ry); g.closePath(); g.fill(); }
        break;
      case 'hearts':
        for (let i = 0; i < 11; i++) { const x = (r() - 0.5) * rx * 1.7, y = (r() - 0.5) * ry * 1.7, s = 0.7 + r() * 0.9; g.save(); g.translate(x, y); g.rotate((r() - 0.5) * 0.8); g.scale(s, s); g.beginPath(); g.moveTo(0, 8); g.bezierCurveTo(-24, -8, -11, -26, 0, -12); g.bezierCurveTo(11, -26, 24, -8, 0, 8); g.fill(); g.restore(); }
        break;
      case 'stars':
        for (let i = 0; i < 12; i++) { Art.starPath(g, (r() - 0.5) * rx * 1.8, (r() - 0.5) * ry * 1.8, 10 + r() * 14); g.fill(); }

        for (let i = 0; i < 90; i++) { g.beginPath(); g.arc((r() - 0.5) * rx * 2, (r() - 0.5) * ry * 2, 2 + r() * 5, 0, TAU); g.fill(); }

  },
  bossArmor(g, spec) {

    g.lineWidth = 6; g.strokeStyle = '#8a5a00'; g.strokeRect(-rx * 1.2, -ry * 0.08, rx * 2.4, ry * 0.16);

  },
  /* Risse: 4 sichtbare Stufen (20/40/60/80 %) – Stufe 5 (100 %) = Schlüpfen */
  genCracks(seed, rx, ry) {
    const r = mulberry32((seed ^ 0x9e3779b9) >>> 0);
    const stages = [], allPts = [];
    for (let s = 0; s < 4; s++) {
      const lines = [];
      const count = [2, 2, 3, 3][s];
      for (let k = 0; k < count; k++) {
        let x, y, dir;
        if (allPts.length && r() < 0.55) { const p = allPts[Math.floor(r() * allPts.length)]; x = p[0]; y = p[1]; dir = r() * TAU; }
        else { const a = r() * TAU, d = 0.6 + r() * 0.35; x = Math.sin(a) * rx * d; y = -Math.cos(a) * ry * d * 0.9; dir = Math.atan2(-y, -x) + (r() - 0.5) * 1.2; }

        for (let i = 0; i < segs; i++) {
          dir += (r() - 0.5) * 1.4;

          x = clamp(x + Math.cos(dir) * len, -rx * 1.05, rx * 1.05); y = clamp(y + Math.sin(dir) * len, -ry * 1.05, ry * 1.05);
          pts.push([x, y]); allPts.push([x, y]);

        let total = 0; for (let i = 1; i < pts.length; i++) total += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);

  },
  _partial(ctx, line, frac) {
    const P = line.pts; let remain = line.total * frac;
    ctx.moveTo(P[0][0], P[0][1]);

      const dx = P[i][0] - P[i - 1][0], dy = P[i][1] - P[i - 1][1], d = Math.hypot(dx, dy);
      if (d <= remain) { ctx.lineTo(P[i][0], P[i][1]); remain -= d; }

  drawCracks(ctx, egg, progress, tNow) {
    const path = this.path(egg.rx, egg.ry);
    ctx.save(); ctx.clip(path);
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    for (let s = 0; s < 4; s++) {
      const th = (s + 1) * 0.2;
      if (progress < th) break;
      const grow = clamp(0.6 + (progress - th) / 0.2 * 0.4, 0.6, 1);
      const age = tNow - (egg.stageAt[s] || -9);
      for (const line of egg.cracks[s]) {

        ctx.save(); ctx.translate(2, 2); ctx.beginPath(); this._partial(ctx, line, frac); ctx.stroke(); ctx.restore();
      }
    }
    ctx.restore();
  },
  /* Zickzack-Linie zum Aufbrechen (obere Kappe / untere Schale) */
  zigzag(rx, y0) {
    const pts = []; const n = 9;
    for (let i = 0; i <= n; i++) pts.push([-rx * 1.15 + i * (rx * 2.3 / n), y0 + (i % 2 ? -1 : 1) * rx * 0.13]);
    return pts;
  },
};

/* --------------------------------------------------------------------------
   Sprite-Cache: Herde und Helfer werden als vorgerenderte Animations-Einzelbilder
   gezeichnet (statt jedes Frame ~20 Formen mit Kontur) → flüssige 60 fps auch
   mit 15 Herdentieren + 30 Helfern, selbst ohne Grafikbeschleunigung.
   -------------------------------------------------------------------------- */
const SpriteCache = {
  map: new Map(),
  get(key, make) { let s = this.map.get(key); if (!s) { s = make(); this.map.set(key, s); } return s; },
  canvas(w, h) { const c = document.createElement('canvas'); c.width = Math.ceil(w); c.height = Math.ceil(h); return c; },
  drop(prefix) { for (const k of [...this.map.keys()]) if (k.startsWith(prefix)) this.map.delete(k); },
};
const HERD_SPR = { S: 0.5, x0: -230, y0: -365, w: 430, h: 380 };     // Rahmen in Dino-Einheiten
const HELP_SPR = { S: 1.15, x0: -58, y0: -88, w: 108, h: 98 };
/* kind: 'w' = Laufen (6 Bilder), 'i' = Stehen/Atmen (4), 'b' = Blinzeln (1) */
function herdFrame(d, kind, i) {
  return SpriteCache.get(`h|${d.id}|${kind}${i}`, () => {
    const S = HERD_SPR.S, c = SpriteCache.canvas(HERD_SPR.w * S, HERD_SPR.h * S);
    const t = kind === 'w' ? i / 6 * TAU / 10 : kind === 'i' ? i / 4 * TAU / 2.2 : 0;
    Art.drawDino(c.getContext('2d'), d.species, -HERD_SPR.x0 * S, -HERD_SPR.y0 * S, { pal: d.pal, t, walk: kind === 'w' ? 1 : 0, face: 1, scale: S, seed: d.seed, blink: kind === 'b' ? 1 : 0 });
    return c;
  });
}
function helperFrame(hue, kind, i) {
  const hb = (Math.round(hue / 15) * 15) % 360;
  return SpriteCache.get(`p|${hb}|${kind}${i}`, () => {
    const S = HELP_SPR.S, c = SpriteCache.canvas(HELP_SPR.w * S, HELP_SPR.h * S);
    const t = kind === 'w' ? i / 6 * TAU / 12 : kind === 'i' ? i / 4 * TAU / 3 : 0;
    Art.drawHelper(c.getContext('2d'), -HELP_SPR.x0 * S, -HELP_SPR.y0 * S, hb, { t, walk: kind === 'w' ? 1 : 0, face: 1, scale: S, blink: kind === 'b' ? 1 : 0 });
    return c;
  });
}

const SPECIES_H = { trex: 250, triceratops: 180, stegosaurus: 185, brachiosaurus: 335, velociraptor: 170, ankylosaurus: 115, parasaurolophus: 260, spinosaurus: 255, pteranodon: 250, dilophosaurus: 225 };
const HERD_BAND = { y0: 1170, y1: 1480, x0: 70, x1: 1010 };

const SKY_KEYS = [   // [Phase, oben, unten, Nacht-Faktor]
  [0.00, '#5b62c4', '#ffb08a', 0.35],
  [0.07, '#4aa3ff', '#bfe9ff', 0],
  [0.45, '#3f98ff', '#c4ecff', 0],
  [0.53, '#6a55c0', '#ff9e70', 0.15],
  [0.60, '#2e2c78', '#b0609a', 0.6],
  [0.68, '#121845', '#3c3378', 1],
  [0.90, '#121845', '#3c3378', 1],
  [1.00, '#5b62c4', '#ffb08a', 0.35],

class HerdDino {
  constructor(d) {
    this.species = d.species; this.rarity = d.rarity; this.palIdx = d.palIdx || 0; this.name = d.name || '';
    this.seed = d.seed || randInt(1, 1e6); this.born = d.born || Date.now(); this.id = d.id || ('h' + this.seed + '_' + this.born);
    const pals = PALETTES[this.rarity] || PALETTES.common;
    this.pal = pals[this.palIdx % pals.length];
    this.x = d.x != null ? d.x : rand(HERD_BAND.x0, HERD_BAND.x1);
    this.y = d.y != null ? d.y : rand(HERD_BAND.y0, HERD_BAND.y1);
    this.tx = this.x; this.ty = this.y;
    this.face = Math.random() < 0.5 ? 1 : -1;
    this.state = 'idle'; this.timer = rand(0.5, 4); this.t = rand(0, 20);
    this.speed = rand(26, 44); this.walk = 0; this.rot = 0; this.leaving = false; this.dead = false;
    this.scaleMul = 1; this.joining = false; this.blinkT = rand(2, 6); this.blink = 0;
  }
  get baseScale() { return lerp(0.36, 0.5, clamp((this.y - HERD_BAND.y0) / (HERD_BAND.y1 - HERD_BAND.y0), 0, 1)) * (this.species === 'brachiosaurus' ? 0.85 : 1); }
  join(fromX, fromY) {
    this.x = fromX; this.y = fromY; this.joining = true; this.scaleMul = 2.2; this.speed = 150;
    this.tx = rand(HERD_BAND.x0 + 40, HERD_BAND.x1 - 40); this.ty = rand(HERD_BAND.y0 + 30, HERD_BAND.y1 - 30); this.state = 'walk';
  }
  leave() { this.leaving = true; this.state = 'walk'; this.speed = 90; this.tx = this.x < 540 ? -260 : 1340; this.ty = this.y; }
  stumble() { if (this.state === 'stumble' || this.joining || this.leaving) return false; this.state = 'stumble'; this.timer = 2.6; return true; }
  update(dt) {
    this.t += dt;
    this.blinkT -= dt; if (this.blinkT < 0) { this.blink = 0.14; this.blinkT = rand(2.5, 6); } if (this.blink > 0) this.blink -= dt;
    if (this.state === 'stumble') {
      this.timer -= dt; const k = 2.6 - this.timer;
      this.rot = k < 0.35 ? -easeOutCubic(k / 0.35) * 1.25 : k < 1.9 ? -1.25 + Math.sin(k * 20) * 0.03 : -1.25 * (1 - easeOutCubic((k - 1.9) / 0.7));
      if (this.timer <= 0) { this.state = 'idle'; this.rot = 0; this.timer = rand(1, 3); }
      this.walk = 0; return;
    }
    if (this.state === 'walk') {
      const dx = this.tx - this.x, dy = this.ty - this.y, d = Math.hypot(dx, dy);
      if (d < 4) {
        this.state = 'idle'; this.timer = rand(2.5, 8); this.walk = 0;
        if (this.joining) { this.joining = false; this.speed = rand(26, 44); }
        if (this.leaving) this.dead = true;
      } else {
        const sp = Math.min(d, this.speed * dt);
        this.x += dx / d * sp; this.y += dy / d * sp;
        if (Math.abs(dx) > 2) this.face = dx > 0 ? 1 : -1;
        this.walk = Math.min(1, this.walk + dt * 4);
      }
      if (this.joining) this.scaleMul = lerp(this.scaleMul, 1, dt * 1.4);
    } else {
      this.walk = Math.max(0, this.walk - dt * 4);
      this.timer -= dt;
      if (this.timer <= 0) { this.state = 'walk'; this.tx = clamp(this.x + rand(-260, 260), HERD_BAND.x0, HERD_BAND.x1); this.ty = clamp(this.y + rand(-80, 80), HERD_BAND.y0, HERD_BAND.y1); }
    }
  }
  draw(ctx) {
    const s = this.baseScale * this.scaleMul;
    ctx.fillStyle = 'rgba(30,50,20,0.22)';
    ctx.beginPath(); ctx.ellipse(this.x, this.y + 2, 120 * s, 18 * s, 0, 0, TAU); ctx.fill();
    const R = RARITIES[this.rarity];
    if (R && R.glow) { const g = softBlob(R.glow); const gs = 200 * s * (1 + Math.sin(this.t * 3) * 0.08); ctx.globalAlpha = 0.55; ctx.drawImage(g, this.x - gs, this.y - SPECIES_H[this.species] * s * 0.55 - gs, gs * 2, gs * 2); ctx.globalAlpha = 1; }
    if (this.joining) {
      // beim Einlaufen groß → live zeichnen (gestochen scharf)
      Art.drawDino(ctx, this.species, this.x, this.y, { pal: this.pal, t: this.t, walk: this.walk, face: this.face, scale: s, seed: this.seed, blink: this.blink > 0 ? 1 : 0, rot: this.rot * this.face });
    } else {
      const walking = this.walk > 0.5;
      const kind = walking ? 'w' : this.blink > 0 ? 'b' : 'i';
      const i = walking ? Math.floor((((this.t * 10) / TAU) % 1) * 6) : kind === 'i' ? Math.floor((((this.t * 2.2) / TAU) % 1) * 4) : 0;
      const img = herdFrame(this, kind, i), k = s / HERD_SPR.S;
      ctx.save(); ctx.translate(this.x, this.y); ctx.scale(this.face, 1); if (this.rot) ctx.rotate(this.rot * this.face);
      ctx.drawImage(img, HERD_SPR.x0 * s, HERD_SPR.y0 * s, img.width * k, img.height * k);
      ctx.restore();
    }
    if (this.state === 'stumble') {
      const hy = this.y - 60 * s - 30;
      for (let i = 0; i < 3; i++) { const a = this.t * 5 + i * TAU / 3; Art.starPath(ctx, this.x + Math.cos(a) * 34, hy + Math.sin(a) * 10, 9); ctx.fillStyle = '#ffe14d'; ctx.fill(); }
    }
    if (this.name && !this.joining) drawText(ctx, this.name, this.x, this.y - SPECIES_H[this.species] * s - 16, { size: 22, strokeWidth: 5, color: R ? (this.rarity === 'common' ? '#ffffff' : R.color) : '#fff', drop: false, alpha: 0.92 });
  }
  toJSON() { return { species: this.species, rarity: this.rarity, palIdx: this.palIdx, name: this.name, seed: this.seed, born: this.born, id: this.id }; }
}

const World = {

    for (let i = 0; i < 46; i++) {
      const y = 1040 + Math.pow(r(), 0.8) * 860;
      this.grass.push({ x: r() * 1080, y, h: 18 + (y - 1000) / 900 * 34 + r() * 10, n: 3 + Math.floor(r() * 3), p: r() * TAU, c: r() < 0.5 ? '#4f9f3f' : '#62b84a' });
    }
    this.grass.sort((a, b) => a.y - b.y);
    // Farne: [x, y, Größe, Anzahl Wedel, Grundwinkel-Streuung]
    this.ferns = [
      [-10, 1930, 1.25, 7], [140, 1955, 0.95, 6], [1090, 1930, 1.3, 7], [950, 1960, 0.9, 6],
      [40, 1090, 0.55, 6], [1040, 1075, 0.6, 6], [-20, 1450, 0.8, 6], [1100, 1480, 0.85, 6],
    ].map(([x, y, s, n], i) => ({ x, y, s, n, p: i * 1.7 }));
    this.nextEventAt = rand(CONFIG.miniEvents.minSec, CONFIG.miniEvents.maxSec);
  },

  makeCloud(x, init) {
    const c = document.createElement('canvas'); const w = randInt(220, 340), h = Math.round(w * 0.45);
    c.width = w; c.height = h; const g = c.getContext('2d');
    const r = Math.random;
    const puffs = []; for (let i = 0; i < 6; i++) puffs.push([w * (0.18 + i * 0.13) + (r() - 0.5) * 12, h * (0.55 + (r() - 0.5) * 0.25), h * (0.26 + r() * 0.16)]);
    g.fillStyle = '#d9e4f7'; for (const [px, py, pr] of puffs) { g.beginPath(); g.arc(px, py + 6, pr, 0, TAU); g.fill(); }
    g.fillStyle = '#ffffff'; for (const [px, py, pr] of puffs) { g.beginPath(); g.arc(px, py, pr * 0.95, 0, TAU); g.fill(); }
    g.fillRect(w * 0.15, h * 0.6, w * 0.7, h * 0.22);
    return { img: c, x, y: rand(170, 640), sp: rand(5, 14), w, h, a: rand(0.75, 0.95) };
  },

  /* statische Ebenen einmal vorrendern (Berge, Vulkan, Hügel, Boden) */
  renderLayers() {
    const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; };
    const r = mulberry32(7);
    // Berge + Vulkan
    const [m, g] = mk(1080, 1080);
    const range = (yBase, amp, col, step) => {
      g.fillStyle = col; g.beginPath(); g.moveTo(0, 1080);
      for (let x = -20; x <= 1100; x += step) g.lineTo(x, yBase - amp * (0.4 + r() * 0.6) * (x % (step * 2) === 0 ? 1 : 0.55));
      g.lineTo(1080, 1080); g.closePath(); g.fill();
    };
    range(900, 120, '#a9b9ee', 70);
    range(950, 90, '#8ea4e2', 55);
    // Vulkan (rechts hinten)
    const vx = 835, vy = 800;
    g.fillStyle = '#9a6276'; g.beginPath(); g.moveTo(600, 1010); g.quadraticCurveTo(760, 900, vx - 38, vy); g.lineTo(vx + 38, vy); g.quadraticCurveTo(910, 900, 1080, 1000); g.lineTo(1080, 1080); g.lineTo(600, 1080); g.closePath(); g.fill();
    g.fillStyle = '#7d4a5f'; g.beginPath(); g.moveTo(vx + 5, vy); g.lineTo(vx + 38, vy); g.quadraticCurveTo(910, 900, 1080, 1000); g.lineTo(1080, 1080); g.lineTo(900, 1080); g.quadraticCurveTo(880, 900, vx + 5, vy); g.closePath(); g.fill();
    g.strokeStyle = '#ff8a3d'; g.lineWidth = 7; g.lineCap = 'round';
    for (const [dx, len] of [[-18, 70], [6, 110], [22, 55]]) { g.beginPath(); g.moveTo(vx + dx, vy + 4); g.quadraticCurveTo(vx + dx * 2.2, vy + len * 0.5, vx + dx * 3, vy + len); g.stroke(); }
    g.fillStyle = '#5c3346'; g.beginPath(); g.ellipse(vx, vy + 2, 38, 9, 0, 0, TAU); g.fill();
    g.fillStyle = '#ff7a2f'; g.beginPath(); g.ellipse(vx, vy + 3, 28, 5, 0, 0, TAU); g.fill();
    // Hügel mit Palmfarnen
    const hill = (yb, col, n, amp) => {
      g.fillStyle = col; g.beginPath(); g.moveTo(0, 1080);
      for (let i = 0; i <= n; i++) { const x = i * 1080 / n; g.lineTo(x, yb - Math.sin(i * 1.7 + yb) * amp - amp); }
      g.lineTo(1080, 1080); g.closePath(); g.fill();
    };
    hill(985, '#9edb78', 9, 18);
    const tree = (x, y, s) => {
      g.strokeStyle = '#7a5a3c'; g.lineWidth = 7 * s; g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + 6 * s, y - 40 * s, x + 2 * s, y - 80 * s); g.stroke();
      g.fillStyle = '#4f9a44';
      for (let i = 0; i < 6; i++) { const a = -Math.PI / 2 + (i - 2.5) * 0.5; g.beginPath(); g.ellipse(x + 2 * s + Math.cos(a) * 26 * s, y - 80 * s + Math.sin(a) * 14 * s + 8 * s, 30 * s, 8 * s, a, 0, TAU); g.fill(); }
    };
    for (const [x, y, s] of [[90, 975, 0.9], [170, 985, 0.7], [610, 990, 0.8], [700, 978, 1.0], [985, 990, 0.75]]) tree(x, y, s);
    hill(1012, '#86cf66', 7, 12);
    // nur den unteren Teil behalten (darüber ist alles transparent) → spart Füllrate
    const [landC, landG] = mk(1080, 1080 - 740); landG.drawImage(m, 0, 740, 1080, 340, 0, 0, 1080, 340);
    this.layerLand = landC;
    // Boden (Wiese) ab y=990
    const [gr, gg] = mk(1080, 940);
    const grad = gg.createLinearGradient(0, 0, 0, 940); grad.addColorStop(0, '#8fd468'); grad.addColorStop(0.35, '#79c457'); grad.addColorStop(1, '#4f9a3c');
    gg.fillStyle = grad; gg.fillRect(0, 0, 1080, 940);
    for (let i = 0; i < 26; i++) { gg.fillStyle = 'rgba(255,255,255,0.06)'; gg.beginPath(); gg.ellipse(r() * 1080, 60 + r() * 860, 60 + r() * 120, 14 + r() * 26, 0, 0, TAU); gg.fill(); }
    const flowerCols = ['#ffe14d', '#ff7fb0', '#ffffff', '#8fd3ff', '#ff9d5c'];
    for (let i = 0; i < 70; i++) {
      const x = r() * 1080, y = 120 + r() * 800, s = 3 + (y / 940) * 5;
      gg.fillStyle = flowerCols[i % flowerCols.length];
      for (let k = 0; k < 5; k++) { const a = k * TAU / 5; gg.beginPath(); gg.arc(x + Math.cos(a) * s, y + Math.sin(a) * s, s * 0.7, 0, TAU); gg.fill(); }
      gg.fillStyle = '#ffcf3a'; gg.beginPath(); gg.arc(x, y, s * 0.55, 0, TAU); gg.fill();
    }
    for (let i = 0; i < 9; i++) { const x = r() * 1080, y = 200 + r() * 700, s = 10 + r() * 16; gg.fillStyle = '#a9a3b8'; gg.beginPath(); gg.ellipse(x, y, s * 1.4, s, 0, 0, TAU); gg.fill(); gg.fillStyle = '#c9c4d6'; gg.beginPath(); gg.ellipse(x - s * 0.3, y - s * 0.3, s * 0.7, s * 0.45, 0, 0, TAU); gg.fill(); }
    this.layerGround = gr;
    // Farnwedel-Sprite
    const [f, fg] = mk(300, 90);
    fg.strokeStyle = '#3f8a35'; fg.lineWidth = 6; fg.lineCap = 'round'; fg.beginPath(); fg.moveTo(4, 45); fg.quadraticCurveTo(150, 35, 296, 48); fg.stroke();
    for (let i = 0; i < 15; i++) {
      const x = 16 + i * 18.5, l = 38 * (1 - i / 17) + 6;
      fg.fillStyle = i % 2 ? '#58b048' : '#4ea43f';
      fg.beginPath(); fg.ellipse(x + 6, 45 - l * 0.5, 7, l * 0.55, 0.45, 0, TAU); fg.fill();
      fg.beginPath(); fg.ellipse(x + 6, 45 + l * 0.5, 7, l * 0.55, -0.45, 0, TAU); fg.fill();
    }
    this.fernImg = f;
  },

  skyAt(p) {
    let i = 0; while (i < SKY_KEYS.length - 2 && p > SKY_KEYS[i + 1][0]) i++;
    const a = SKY_KEYS[i], b = SKY_KEYS[i + 1], k = clamp((p - a[0]) / (b[0] - a[0]), 0, 1);
    return { top: mixRgb(a[1], b[1], k), bot: mixRgb(a[2], b[2], k), night: lerp(a[3], b[3], k) };
  },

  update(dt) {
    this.t += dt;
    this.dayPhase = (this.dayPhase + dt / CONFIG.dayNight.cycleSec) % 1;
    for (const c of this.clouds) { c.x += c.sp * dt * (1 + this.rain * 2); if (c.x > 1180) { Object.assign(c, this.makeCloud(-c.w - rand(0, 200))); } }
    // Vulkanrauch (immer) + gelegentliche Eruption
    this._smokeT = (this._smokeT || 0) - dt;
    if (this._smokeT <= 0) {
      this._smokeT = this.eruption > 0 ? 0.08 : 0.45;
      FX.spawn({ type: 'blob', layer: 0, x: 835 + rand(-12, 12), y: 790, vx: rand(4, 16), vy: rand(-38, -24) * (this.eruption > 0 ? 2 : 1), size: rand(16, 26), grow: 9, life: rand(5, 7), alpha: this.eruption > 0 ? 0.75 : 0.5, color: this.eruption > 0 ? '#7b6f88' : '#c9c1d6', fadeIn: 0.6 });
    }
    if (this.eruption > 0) {
      this.eruption -= dt;
      if (Math.random() < dt * 22) FX.spawn({ type: 'spark', layer: 0, x: 835 + rand(-15, 15), y: 795, vx: rand(-120, 120), vy: rand(-380, -220), g: 420, size: rand(5, 9), life: rand(1.2, 1.8), color: pick(['#ff7a2f', '#ffb13d', '#ff4d2e']) });
    }
    if (this.t > this.nextEruptAt) { this.nextEruptAt = this.t + rand(150, 260); this.erupt(); }
    // Flugsaurier im Hintergrund
    if (this.t > this.nextFlyerAt) { this.nextFlyerAt = this.t + rand(18, 40); this.spawnFlyer(1); }
    for (const f of this.flyers) { f.x += f.vx * dt; f.y += Math.sin(this.t * 1.3 + f.p) * 8 * dt; }
    this.flyers = this.flyers.filter(f => f.x > -150 && f.x < 1230);
    // Schmetterlinge
    for (const b of this.butterflies) {
      b.t += dt; b.life -= dt;
      b.vx += (Math.random() - 0.5) * 300 * dt; b.vy += (Math.random() - 0.5) * 300 * dt;
      b.vx = clamp(b.vx, -90, 90); b.vy = clamp(b.vy, -70, 70);
      if (b.life < 3) b.vy -= 120 * dt;
      b.x += b.vx * dt; b.y += b.vy * dt;
      if (b.x < 30) b.vx += 200 * dt; if (b.x > 1050) b.vx -= 200 * dt; if (b.y > 1500) b.vy -= 200 * dt; if (b.y < 600 && b.life > 3) b.vy += 200 * dt;
    }
    this.butterflies = this.butterflies.filter(b => b.life > 0 && b.y > -50);
    // Regen
    if (this.rainTarget && this.t > this.rainEnd) { this.rainTarget = 0; this.rainbowEnd = this.t + 24; }
    this.rain = lerp(this.rain, this.rainTarget, dt * 0.8);
    this.rainbow = lerp(this.rainbow, this.t < this.rainbowEnd && this.rain < 0.3 ? 1 : 0, dt * 0.6);
    if (this.rain > 0.05) {
      const n = Math.floor(this.rain * 260 * dt + Math.random());
      for (let i = 0; i < n && this.drops.length < 260; i++) this.drops.push({ x: rand(-100, 1080), y: rand(-60, 300), vx: 140, vy: rand(1300, 1600), floor: rand(1000, 1900) });
    }
    for (const d of this.drops) { d.x += d.vx * dt; d.y += d.vy * dt; if (d.y > d.floor) { d.dead = true; if (Math.random() < 0.3) FX.spawn({ type: 'ring', layer: 1, x: d.x, y: d.floor, size: 4, grow: 40, life: 0.35, color: 'rgba(220,240,255,0.8)', squash: 0.35 }); } }
    this.drops = this.drops.filter(d => !d.dead);
    // Sternschnuppen
    for (const s of this.shooting) { s.t += dt; s.x += s.vx * dt; s.y += s.vy * dt; }
    this.shooting = this.shooting.filter(s => s.t < s.life);
    // Herde
    for (const h of this.herd) h.update(dt);
    if (this.herd.some(h => h.dead)) { for (const h of this.herd) if (h.dead) SpriteCache.drop(`h|${h.id}|`); this.herd = this.herd.filter(h => !h.dead); }
    // Zufalls-Mini-Ereignisse alle 1–2 Minuten
    if (this.t > this.nextEventAt) { this.nextEventAt = this.t + rand(CONFIG.miniEvents.minSec, CONFIG.miniEvents.maxSec); this.randomEvent(); }
  },

  /* --- Mini-Ereignisse --- */
  randomEvent(forced) {
    const opts = ['rain', 'shooting', 'stumble', 'butterflies', 'eruption', 'flyby'].filter(o => o !== this.lastEvent);
    const ev = forced || pick(opts);
    this.lastEvent = ev;
    switch (ev) {
      case 'rain': this.rainTarget = 1; this.rainEnd = this.t + 18; break;
      case 'shooting': for (let i = 0; i < 3; i++) this.shooting.push({ x: rand(-50, 400), y: rand(160, 420), vx: rand(700, 900), vy: rand(160, 260), t: -i * 0.6, life: 1.6 + i * 0.6 }); break;
      case 'stumble': { const c = this.herd.filter(h => h.state !== 'stumble' && !h.joining && !h.leaving && h.species !== 'pteranodon'); if (c.length) { const h = pick(c); if (h.stumble()) for (let i = 0; i < 10; i++) FX.spawn({ type: 'blob', layer: 1, x: h.x + rand(-40, 40), y: h.y - 5, vx: rand(-60, 60), vy: rand(-40, -10), size: rand(10, 18), grow: 20, life: 1, color: '#c9b08a', alpha: 0.7 }); } else this.randomEvent('butterflies'); break; }
      case 'butterflies': for (let i = 0; i < 7; i++) this.butterflies.push({ x: rand(100, 900), y: rand(1300, 1700), vx: rand(-40, 40), vy: rand(-60, -20), t: rand(0, 5), life: rand(20, 28), c: pick(['#ff7fb0', '#ffe14d', '#8fd3ff', '#b98bff', '#ff9d5c']) }); break;
      case 'eruption': this.erupt(); break;
      case 'flyby': this.spawnFlyer(4); break;
    }
    return ev;
  },
  erupt() { this.eruption = 4.5; Sound.rumble(2.2, 0.16); },
  spawnFlyer(n) {
    const dir = Math.random() < 0.5 ? 1 : -1, y = rand(380, 620);
    for (let i = 0; i < n; i++) this.flyers.push({ x: dir > 0 ? -80 - i * 70 : 1160 + i * 70, y: y + (i % 2) * 40 + i * 12, vx: dir * rand(80, 110), p: rand(0, TAU), s: rand(0.7, 1.1) });
  },

  /* --- Zeichnen --- */
  drawSky(ctx) {
    const sky = this.skyAt(this.dayPhase); this.night = sky.night;
    const grd = ctx.createLinearGradient(0, 0, 0, 1050);
    grd.addColorStop(0, rgbStr(sky.top)); grd.addColorStop(1, rgbStr(sky.bot));
    ctx.fillStyle = grd; ctx.fillRect(0, 0, 1080, 1060);
    if (this.night > 0.05) {
      ctx.fillStyle = '#ffffff';
      for (const s of this.stars) { ctx.globalAlpha = this.night * (0.55 + 0.45 * Math.sin(this.t * s.sp + s.p)) * (1 - this.rain * 0.8); ctx.fillRect(s.x, s.y, s.s, s.s); }
      ctx.globalAlpha = 1;
    }
    // Sonne / Mond
    const p = this.dayPhase;
    if (p < 0.58) { const q = p / 0.58; this._body(ctx, lerp(40, 1040, q), 960 - Math.sin(q * Math.PI) * 650, '#fff4a8', '#ffd84a', 58, false); }
    else { const q = (p - 0.58) / 0.42; this._body(ctx, lerp(40, 1040, q), 960 - Math.sin(q * Math.PI) * 620, '#f4f1ff', '#d6d0f5', 44, true); }
    for (const s of this.shooting) {
      if (s.t < 0) continue;
      const a = Math.sin(clamp(s.t / s.life, 0, 1) * Math.PI);
      const g = ctx.createLinearGradient(s.x, s.y, s.x - s.vx * 0.18, s.y - s.vy * 0.18);
      g.addColorStop(0, `rgba(255,255,255,${a})`); g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.strokeStyle = g; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x - s.vx * 0.18, s.y - s.vy * 0.18); ctx.stroke();
    }
    for (const c of this.clouds) { ctx.globalAlpha = c.a * (1 - this.night * 0.45); ctx.drawImage(c.img, c.x, c.y); }
    ctx.globalAlpha = 1;
    if (this.rain > 0.02) { ctx.fillStyle = `rgba(70,80,110,${this.rain * 0.35})`; ctx.fillRect(0, 0, 1080, 1060); }
  },
  _body(ctx, x, y, c1, c2, r, moon) {
    const glow = softBlob(moon ? '#c9c4ff' : '#ffe98a');
    ctx.globalAlpha = 0.55; ctx.drawImage(glow, x - r * 2.6, y - r * 2.6, r * 5.2, r * 5.2); ctx.globalAlpha = 1;
    ctx.fillStyle = c2; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
    ctx.fillStyle = c1; ctx.beginPath(); ctx.arc(x - r * 0.12, y - r * 0.12, r * 0.82, 0, TAU); ctx.fill();
    if (moon) { ctx.fillStyle = 'rgba(160,150,210,0.5)'; for (const [dx, dy, rr2] of [[-12, -8, 8], [10, 10, 6], [14, -14, 4]]) { ctx.beginPath(); ctx.arc(x + dx, y + dy, rr2, 0, TAU); ctx.fill(); } }
  },
  drawLand(ctx) {
    for (const f of this.flyers) this._flyer(ctx, f);
    FX.draw(ctx, 0);                                     // Rauch & Lava hinter den Bergen? – vor den Bergen wirkt lebendiger
    ctx.drawImage(this.layerLand, 0, 740);
    // Vulkan-Glühen
    const gl = 0.35 + Math.sin(this.t * 2) * 0.08 + (this.eruption > 0 ? 0.6 : 0);
    ctx.globalAlpha = clamp(gl, 0, 1); ctx.globalCompositeOperation = 'lighter';
    ctx.drawImage(softBlob('#ff7a2f'), 835 - 70, 800 - 50, 140, 100);
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    if (this.rainbow > 0.02) this._rainbow(ctx);
    ctx.drawImage(this.layerGround, 0, 990);
  },
  _rainbow(ctx) {
    const cols = ['#ff5a5a', '#ff9d3d', '#ffe14d', '#6ee06e', '#4aa6ff', '#9b6bff'];
    ctx.save(); ctx.globalAlpha = this.rainbow * 0.5; ctx.lineWidth = 18;
    cols.forEach((c, i) => { ctx.strokeStyle = c; ctx.beginPath(); ctx.arc(480, 1060, 560 - i * 18, Math.PI * 1.05, Math.PI * 1.95); ctx.stroke(); });
    ctx.restore();
  },
  _flyer(ctx, f) {
    const flap = Math.sin(this.t * 6 + f.p);
    ctx.save(); ctx.translate(f.x, f.y); ctx.scale((f.vx > 0 ? 1 : -1) * f.s, f.s);
    ctx.fillStyle = this.night > 0.5 ? '#2a2650' : '#5a4a78';
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(-20, -30 * flap, -55, -24 * flap - 4); ctx.lineTo(-10, 6); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(4, 0); ctx.quadraticCurveTo(-14, -22 * flap, -38, -18 * flap + 2); ctx.lineTo(-6, 6); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0, 2, 16, 6, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.moveTo(10, -2); ctx.lineTo(34, 2); ctx.lineTo(10, 4); ctx.fill();
    ctx.beginPath(); ctx.moveTo(8, -2); ctx.lineTo(-6, -12); ctx.lineTo(4, 2); ctx.fill();
    ctx.restore();
  },
  drawHerd(ctx) {
    const list = this.herd.slice().sort((a, b) => a.y - b.y);
    for (const h of list) h.draw(ctx);
  },
  drawGrassAndFerns(ctx) {
    const wind = 1 + this.rain * 1.5;
    ctx.lineCap = 'round';
    for (const g of this.grass) {
      ctx.strokeStyle = g.c; ctx.lineWidth = 3 + (g.y - 1000) / 300;
      for (let i = 0; i < g.n; i++) {
        const bx = g.x + (i - g.n / 2) * 5, sway = Math.sin(this.t * 1.6 * wind + g.p + i * 0.5) * 6 * wind;
        ctx.beginPath(); ctx.moveTo(bx, g.y); ctx.quadraticCurveTo(bx + sway * 0.4, g.y - g.h * 0.6, bx + sway + (i - g.n / 2) * 3, g.y - g.h); ctx.stroke();
      }
    }
    for (const f of this.ferns) {
      for (let i = 0; i < f.n; i++) {
        const base = -Math.PI / 2 + (i - (f.n - 1) / 2) * 0.36;
        const sway = Math.sin(this.t * 1.1 * wind + f.p + i * 0.6) * 0.05 * wind;
        ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(base + sway); ctx.scale(f.s * (0.85 + (i % 3) * 0.1), f.s);
        ctx.drawImage(this.fernImg, 0, -45); ctx.restore();
      }
    }
  },
  drawNightTint(ctx) {
    if (this.night > 0.02) { ctx.fillStyle = `rgba(28,22,90,${this.night * 0.36})`; ctx.fillRect(0, 0, 1080, 1920); }
  },
  drawFront(ctx) {
    // Schmetterlinge & Regen ganz vorn (über dem Ei, unter der Schrift)
    for (const b of this.butterflies) {
      const f = Math.abs(Math.sin(b.t * 14));
      ctx.save(); ctx.translate(b.x, b.y); ctx.fillStyle = b.c; ctx.strokeStyle = OUTLINE; ctx.lineWidth = 2;
      for (const s of [-1, 1]) { ctx.beginPath(); ctx.ellipse(s * 9 * f, -4, 10 * f + 2, 8, s * 0.4, 0, TAU); ctx.fill(); ctx.stroke(); ctx.beginPath(); ctx.ellipse(s * 7 * f, 6, 7 * f + 1, 6, -s * 0.3, 0, TAU); ctx.fill(); ctx.stroke(); }
      ctx.fillStyle = OUTLINE; ctx.fillRect(-1.5, -8, 3, 18); ctx.restore();
    }
    if (this.drops.length) {
      ctx.strokeStyle = 'rgba(210,230,255,0.55)'; ctx.lineWidth = 3; ctx.beginPath();
      for (const d of this.drops) { ctx.moveTo(d.x, d.y); ctx.lineTo(d.x - d.vx * 0.025, d.y - d.vy * 0.025); }
      ctx.stroke();
    }
  },
  /* Meteor: wächst & wird heller, je näher der Countdown an 0 ist */
  drawMeteor(ctx, m) {
    if (!m || m.alpha <= 0.01) return;
    ctx.save(); ctx.globalAlpha = m.alpha;
    const dirx = 1, diry = -0.75, len = m.r * (3 + m.heat * 4);
    for (let i = 8; i >= 1; i--) {
      const k = i / 8, x = m.x + dirx * len * k, y = m.y + diry * len * k, s = m.r * (1.6 - k) * 1.3;
      ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = m.alpha * (1 - k) * (0.5 + m.heat * 0.5);
      ctx.drawImage(softBlob(i > 4 ? '#ff5a2f' : '#ffb13d'), x - s, y - s, s * 2, s * 2);
    }
    ctx.globalAlpha = m.alpha * (0.4 + m.heat * 0.6);
    const gs = m.r * (2.6 + m.heat * 1.6 + Math.sin(this.t * 12) * 0.15 * m.heat);
    ctx.drawImage(softBlob('#ff8a3d'), m.x - gs, m.y - gs, gs * 2, gs * 2);
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = m.alpha;
    ctx.fillStyle = '#6b4a5e'; ctx.strokeStyle = OUTLINE; ctx.lineWidth = Math.max(2, m.r * 0.12);
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#4e3346';
    for (const [dx, dy, rr2] of [[-0.3, -0.2, 0.22], [0.3, 0.25, 0.16], [0.05, 0.45, 0.12]]) { ctx.beginPath(); ctx.arc(m.x + dx * m.r, m.y + dy * m.r, rr2 * m.r, 0, TAU); ctx.fill(); }
    ctx.strokeStyle = `rgba(255,170,80,${0.4 + m.heat * 0.6})`; ctx.lineWidth = m.r * 0.18;
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r * 0.9, -2.4, 0.2); ctx.stroke();
    ctx.restore();
  },
};

/* ==========================================================================
   9. Users, Bestenlisten, Sammlungen, Persistenz
   ========================================================================== */
const Persist = {
  muted: {},                                  // id → Name (für das Panel)
  isMuted(id) { return Object.prototype.hasOwnProperty.call(this.muted, id); },
};

const Users = {
  map: new Map(),
  _active: 0, _activeAt: -9,
  touch(ev) {
    const raw = (CONFIG.names.useNickname && ev.nick) ? ev.nick : (ev.name || ev.nick || String(ev.uid));
    let u = this.map.get(ev.uid);
    if (!u) {
      const c = NameFilter.clean(raw);
      u = { id: ev.uid, raw, name: c.name, filtered: c.filtered, muted: Persist.isMuted(ev.uid), team: 0, lastActive: 0,
            lastHitAt: -1e9, greeted: false, likeBuf: 0, helper: null, hue: hashStr(String(ev.uid)) % 360, interactions: 0 };
      this.map.set(ev.uid, u);
    } else if (raw !== u.raw) { const c = NameFilter.clean(raw); u.raw = raw; u.name = c.name; u.filtered = c.filtered; }
    u.lastActive = gnow(); u.interactions++;
    return u;
  },
  label(u) { return !u || u.muted ? CONFIG.names.anonymous : u.name; },
  activeCount() {
    const tn = gnow();
    if (tn - this._activeAt > 1) {
      const lim = tn - CONFIG.hp.activeWindowSec; let n = 0;
      for (const u of this.map.values()) if (u.lastActive >= lim) n++;
      this._active = n; this._activeAt = tn;
    }
    return this._active;
  },
  refilter() { NameFilter.invalidate(); for (const u of this.map.values()) { const c = NameFilter.clean(u.raw); u.name = c.name; u.filtered = c.filtered; if (u.helper) u.helper.name = u.name; } },
  setMuted(id, m) {
    const u = this.map.get(id);
    if (m) Persist.muted[id] = u ? u.raw : String(id); else delete Persist.muted[id];
    if (u) { u.muted = m; if (m && u.helper) { u.helper.leave(); } }
    Game.boardDirty = true;
  },
  recent(n = 30) { return [...this.map.values()].sort((a, b) => b.lastActive - a.lastActive).slice(0, n); },
};

/* Bestenlisten: heute & gesamt (persistiert), aktuelles Ei (aus Egg.contrib) */
const Board = {
  today: { date: todayStr(), map: {} },
  all: {},
  add(u, pts) {
    if (this.today.date !== todayStr()) this.today = { date: todayStr(), map: {} };
    const t = this.today.map[u.id] || (this.today.map[u.id] = { n: u.name, p: 0 }); t.n = u.name; t.p += pts;
    const a = this.all[u.id] || (this.all[u.id] = { n: u.name, p: 0, d: 0 }); a.n = u.name; a.p += pts;
    Game.boardDirty = true;
  },
  top(kind, n = 5) {
    let entries;
    if (kind === 'egg') {
      const m = new Map();
      for (const e of Game.eggs) for (const [id, c] of e.contrib) { const o = m.get(id) || { n: c.n, p: 0 }; o.p += c.d; m.set(id, o); }
      entries = [...m.entries()];
    } else entries = Object.entries(kind === 'today' ? this.today.map : this.all);
    return entries.filter(([id]) => !Persist.isMuted(id)).sort((a, b) => b[1].p - a[1].p).slice(0, n).map(([id, v]) => ({ id, name: v.n, pts: v.p }));
  },
  prune() {
    const ids = Object.keys(this.all);
    if (ids.length > 1000) { ids.sort((a, b) => this.all[b].p - this.all[a].p).slice(1000).forEach(id => delete this.all[id]); }
  },
};

/* Sammlung pro Nutzer + Lexikon + "Erste ihrer Art" */
const Coll = {
  users: {},        // id → {n, c: {"art|seltenheit": anzahl}, t: gesamt}
  lexikon: {},      // art → anzahl
  firsts: {},       // "art|seltenheit" → true
  record(u, species, rarity) {
    const out = { total: 0, newSpecies: false, firstCombo: false };
    if (!this.lexikon[species]) out.newSpecies = true;
    this.lexikon[species] = (this.lexikon[species] || 0) + 1;
    const combo = species + '|' + rarity;
    if (!this.firsts[combo]) { this.firsts[combo] = true; out.firstCombo = true; }
    if (u) {
      const c = this.users[u.id] || (this.users[u.id] = { n: u.name, c: {}, t: 0 });
      c.n = u.name; c.c[combo] = (c.c[combo] || 0) + 1; c.t++; out.total = c.t;
      const a = Board.all[u.id] || (Board.all[u.id] = { n: u.name, p: 0, d: 0 }); a.d = c.t;
    }
    const ids = Object.keys(this.users);
    if (ids.length > 2000) ids.sort((a, b) => this.users[a].t - this.users[b].t).slice(0, ids.length - 2000).forEach(id => delete this.users[id]);
    return out;
  },
  discovered() { return SPECIES.filter(s => this.lexikon[s.key]).length; },
};

/* ==========================================================================
   Egg – ein Ei im Spiel
   ========================================================================== */
const EGG_SIZES = { normal: [150, 195], boss: [185, 240], duel: [118, 152] };

class Egg {
  constructor(o) {
    this.mode = o.mode; this.team = o.team || 0; this.boss = o.mode === 'boss';
    const sz = EGG_SIZES[o.mode] || EGG_SIZES.normal;
    this.rx = sz[0]; this.ry = sz[1];
    this.x = o.x; this.groundY = CONFIG.layout.groundY;
    this.maxHp = o.maxHp; this.hp = o.hp != null ? o.hp : o.maxHp;
    this.seed = o.seed || randInt(1, 1e9);
    this.palIdx = o.palIdx != null ? o.palIdx : randInt(0, EGG_PALETTES.length - 1);
    this.pattern = o.pattern || pick(EGG_PATTERNS);
    const pal = EGG_PALETTES[this.palIdx % EGG_PALETTES.length];
    this.color = this.boss ? '#6a5aa8' : pal.base; this.color2 = this.boss ? '#8a78d0' : pal.pat;
    this.tex = EggArt.texture({ rx: this.rx, ry: this.ry, base: this.color, pat: this.color2, pattern: this.pattern, seed: this.seed, boss: this.boss });
    this.cracks = EggArt.genCracks(this.seed, this.rx, this.ry);
    this.stageAt = [-9, -9, -9, -9];
    this.stage = 0;
    this.contrib = new Map(o.contrib || []);   // id → {n, d}
    this.lastHitter = o.last || null;            // {id, n}
    this.a = 0; this.va = 0; this.h = 0; this.vh = 0; this.flash = 0; this.bigCrack = 0; this.squash = 0;
    this.phase = rand(0, TAU);
    this.state = 'drop'; this.dropT = 0; this.drop = 1400; this.burstT = 0; this.rollDir = 1; this.alpha = 1;
    // Stufen aus gespeichertem Fortschritt wiederherstellen (ohne Effekte)
    const st = Math.min(4, Math.floor(this.progress / 0.2 + 1e-9)); this.stage = st;
  }
  get progress() { return clamp(1 - this.hp / this.maxHp, 0, 1); }
  get cy() { return this.groundY - this.ry * 0.95; }
}

/* Helfer-Dino eines Zuschauers */
class Helper {
  constructor(u) {
    this.uid = u.id; this.name = u.name; this.hue = u.hue;
    this.fromLeft = Math.random() < 0.5;
    this.x = this.fromLeft ? -60 : 1140; this.y = 1060; this.tx = this.x; this.ty = this.y; this.scale = 1;
    this.state = 'walk'; this.t = rand(0, 10); this.walk = 1; this.face = this.fromLeft ? 1 : -1;
    this.peckT = 0; this.hop = 0; this.vh = 0; this.cheerT = 0; this.lastAct = gnow(); this.tagUntil = now() + CONFIG.helpers.tagSec + 2;
    this.slot = null; this.dead = false; this.blinkT = rand(1, 5); this.blink = 0; this.joinedAt = gnow();
  }
  setSlot(s) { this.slot = s; this.tx = s.x; this.ty = s.y; this.scale = s.scale; if (this.state !== 'leave') this.state = 'walk'; }
  leave() { this.state = 'leave'; this.tx = this.x < 540 ? -120 : 1200; this.slot = null; }
  peck() { this.peckT = 0.28; this.tagUntil = now() + CONFIG.helpers.tagSec; }
  update(dt, eggX) {
    this.t += dt;
    this.blinkT -= dt; if (this.blinkT < 0) { this.blink = 0.13; this.blinkT = rand(2, 5); } if (this.blink > 0) this.blink -= dt;
    if (this.peckT > 0) this.peckT = Math.max(0, this.peckT - dt);
    if (this.cheerT > 0) { this.cheerT -= dt; if (this.hop <= 0 && Math.random() < dt * 6) this.vh = rand(260, 380); }
    this.vh -= 1500 * dt; this.hop += this.vh * dt; if (this.hop <= 0) { this.hop = 0; this.vh = 0; }
    if (this.state === 'walk' || this.state === 'leave') {
      const dx = this.tx - this.x, dy = this.ty - this.y, d = Math.hypot(dx, dy);
      const sp = (this.state === 'leave' ? 260 : 240) * dt;
      if (d <= sp) { this.x = this.tx; this.y = this.ty; if (this.state === 'leave') this.dead = true; else this.state = 'idle'; }
      else { this.x += dx / d * sp; this.y += dy / d * sp; if (Math.abs(dx) > 1) this.face = dx > 0 ? 1 : -1; }
      this.walk = 1;
    } else {
      this.walk = 0;
      if (eggX != null) this.face = eggX > this.x ? 1 : -1;
    }
  }
  draw(ctx) {
    const k = this.peckT > 0 ? Math.sin((1 - this.peckT / 0.28) * Math.PI) : 0;
    const x = this.x + this.face * k * 12;
    ctx.fillStyle = 'rgba(30,50,20,0.25)'; ctx.beginPath(); ctx.ellipse(this.x, this.y + 2, 30 * this.scale, 7 * this.scale, 0, 0, TAU); ctx.fill();
    const kind = this.walk ? 'w' : this.blink > 0 ? 'b' : 'i';
    const i = this.walk ? Math.floor((((this.t * 12) / TAU) % 1) * 6) : kind === 'i' ? Math.floor((((this.t * 3) / TAU) % 1) * 4) : 0;
    const img = helperFrame(this.hue, kind, i);
    ctx.save(); ctx.translate(x, this.y - this.hop); ctx.scale(this.face * this.scale, this.scale); if (k) ctx.rotate(k * 0.55);
    ctx.drawImage(img, HELP_SPR.x0, HELP_SPR.y0, HELP_SPR.w, HELP_SPR.h);
    ctx.restore();
  }
  /* Namensschild – wird separat gezeichnet (max. 6 gleichzeitig, versetzt, damit nichts überlappt) */
  drawTag(ctx, lift) {
    const a = clamp((this.tagUntil - now()) / 0.6, 0, 1);
    drawText(ctx, this.name, clamp(this.x, 90, 880), this.y - 92 * this.scale - this.hop - lift, { size: 24, strokeWidth: 6, color: '#fff', alpha: a, drop: false });
  }
}

/* ==========================================================================
   10. Game – Spielablauf
   ========================================================================== */
const Game = {
  t: 0, phase: 'boot', phaseT: 0, mode: 'normal', eggs: [], duration: 240, timeLeft: 240,
  paused: false, override: null, normalsSince: 0, specialIdx: 0, eggNumber: 0, softer: 1,
  helpers: [], pops: [], popOverflow: 0, popOverflowAt: 0, toasts: [], toastQueue: [],
  announce: null, hatchInfo: null, impactInfo: null, meteor: null,
  shake: 0, flash: 0, flashColor: '#ffffff', activity: [], boardDirty: true,
  totals: { eggs: 0, hatches: 0, impacts: 0 }, lastLikeFlush: 0, lastRescale: 0, lastTick: -1,
  hatchTimes: [], greetBuf: [], greetAt: 0, lastSaveAt: 0, sessionUsers: new Set(),

  /* ---------- Rundensteuerung ---------- */
  pickNextMode() {
    if (this.override) { const m = this.override; this.override = null; if (m !== 'normal') this.normalsSince = 0; return m; }
    const R = CONFIG.rotation;
    if (this.normalsSince >= R.normalsBeforeSpecial) {
      const sp = []; if (R.bossEnabled) sp.push('boss'); if (R.duelEnabled) sp.push('duel');
      if (sp.length) { const m = sp[this.specialIdx % sp.length]; this.specialIdx++; this.normalsSince = 0; return m; }
    }
    this.normalsSince++;
    return 'normal';
  },
  peekNextMode() {
    if (this.override) return this.override;
    const R = CONFIG.rotation; const sp = []; if (R.bossEnabled) sp.push('boss'); if (R.duelEnabled) sp.push('duel');
    return this.normalsSince >= R.normalsBeforeSpecial && sp.length ? sp[this.specialIdx % sp.length] : 'normal';
  },
  eggXs(mode) { return mode === 'duel' ? [270, 690] : mode === 'boss' ? [545] : [CONFIG.layout.centerX]; },

  startRound(mode) {
    this.mode = mode; this.eggNumber++; this.totals.eggs++;
    const R = CONFIG.rotation;
    const dur = mode === 'boss' ? R.bossAnnounceSec : mode === 'duel' ? R.duelAnnounceSec : R.normalAnnounceSec;
    this.phase = 'intro'; this.phaseT = 0; this.introDur = dur;
    this.eggs = []; this.hatchInfo = null; this.impactInfo = null;
    this.announce = { mode, t: 0, dur };
    this.meteor = { x: 860, y: 560, r: 8, heat: 0, alpha: 0, state: 'sky', t: 0 };
    Sound.announce(mode); Sound.setUrgency(0);
    if (mode === 'duel') {
      for (const u of Users.map.values()) u.team = 0;
      for (const h of this.helpers) { const u = Users.map.get(h.uid); if (u) u.team = Math.random() < 0.5 ? 1 : 2; }
    }
    this.layoutHelpers();
    this.boardDirty = true;
    StatsLog.mark('round', { mode, egg: this.eggNumber });
  },
  computeMaxHp(mode, soft = this.softer) {
    const H = CONFIG.hp, act = Math.max(1, Users.activeCount());
    const eff = H.smallGroup > 0 ? act * act / (act + H.smallGroup) : act;
    let hp = H.base + H.perUser * Math.pow(eff, H.exponent);
    if (mode === 'boss') hp *= H.bossMult;
    if (mode === 'duel') hp *= H.duelMult;
    hp *= soft;                                   // < 1 direkt nach einem Meteor-Einschlag
    return clamp(Math.round(hp), H.min, H.max);
  },
  spawnEggs(restore) {
    const xs = this.eggXs(this.mode);
    this.duration = restore ? restore.duration : CONFIG.timer[this.mode] || CONFIG.timer.normal;
    this.timeLeft = restore ? restore.timeLeft : this.duration;
    const used = new Set(this.lastPals || []);          // neue Farbe: nicht wie das letzte Ei
    this.eggs = xs.map((x, i) => {
      const r = restore && restore.eggs[i];
      let palIdx = r ? r.palIdx : randInt(0, EGG_PALETTES.length - 1);
      while (!r && used.has(palIdx)) palIdx = (palIdx + 1) % EGG_PALETTES.length;
      used.add(palIdx);
      const e = new Egg({ mode: this.mode, team: this.mode === 'duel' ? i + 1 : 0, x, maxHp: r ? r.maxHp : this.computeMaxHp(this.mode), hp: r ? r.hp : undefined,
        seed: r ? r.seed : undefined, palIdx, pattern: r ? r.pattern : undefined, contrib: r ? r.contrib : undefined, last: r ? r.last : undefined });
      e.dropT = -i * 0.25;
      e.soft = r ? (r.soft || 1) : this.softer;
      return e;
    });
    this.lastPals = this.eggs.map(e => e.palIdx);
    this.softer = 1;
    this.phase = 'play'; this.phaseT = 0; this.lastRescale = this.t;
    this.layoutHelpers();
    Sound.whoosh(0.5);
  },
  rescaleHp() {
    // HP passt sich der Zahl aktiver Nutzer an; der Fortschritt in % bleibt erhalten
    for (const e of this.eggs) {
      if (e.state !== 'idle' && e.state !== 'drop') continue;
      const target = this.computeMaxHp(this.mode, e.soft || 1);
      if (Math.abs(target - e.maxHp) / e.maxHp < 0.03) continue;
      const nm = clamp(target, e.maxHp * 0.8, e.maxHp * 1.5);     // nach oben schneller (Stream-Start)
      const ratio = e.hp / e.maxHp; e.maxHp = Math.round(nm); e.hp = Math.max(0.01, ratio * e.maxHp);
    }
  },

  /* ---------- Eingehende Events ---------- */
  handleEvent(ev) {
    if (!ev || !ev.type || ev.uid == null) return;
    StatsLog.count(ev);
    if (ev.type === 'member') return;                     // reiner Beitritt ohne Interaktion
    const u = Users.touch(ev);
    this.sessionUsers.add(u.id);
    const W = { chat: 1, like: Math.min(ev.count || 1, 20) * 0.25, follow: 3, share: 2, gift: 3 }[ev.type] || 1;
    this.activity.push({ t: this.t, w: W, team: u.team });
    const D = CONFIG.damage;
    switch (ev.type) {
      case 'chat': {
        if (!u.greeted) { u.greeted = true; this.greet(u); }
        if (this.mode === 'duel' && (this.phase === 'play' || this.phase === 'intro')) {
          const team = parseTeam(ev.text);
          if (team && team !== u.team) { u.team = team; this.teamPop(u, team); if (u.helper) this.layoutHelpers(); }
        }
        const tn = gnow() * 1000;
        if (tn - u.lastHitAt >= D.commentCooldownMs) { u.lastHitAt = tn; this.hit(u, D.comment, 'comment'); }
        else this.ensureHelper(u);
        break;
      }
      case 'like':
        u.likeBuf += Math.max(1, ev.count || 1); this.ensureHelper(u);
        if (Math.random() < 0.35) FX.spawn({ type: 'heart', layer: 2, x: rand(760, 900), y: rand(1000, 1150), vx: rand(-30, 30), vy: rand(-160, -110), size: rand(16, 24), life: 1.4, color: pick(['#ff5f8a', '#ff7fb0', '#ff9db8']) });
        break;
      case 'follow':
        this.hit(u, D.follow, 'follow');
        this.toast(`Danke fürs Folgen, ${Users.label(u)}!`, { color: '#ffd84a', icon: '⭐', prio: 3, u });
        break;
      case 'share':
        this.hit(u, D.share, 'share');
        this.toast(`${Users.label(u)} hat den LIVE geteilt – danke!`, { color: '#7fe0ff', icon: '📣', prio: 2, u });
        break;
      case 'gift': {
        const dmg = clamp((ev.diamonds || 1) * D.giftPerDiamond, D.giftMin, D.giftMax);
        this.hit(u, dmg, 'gift');
        this.toast(`Danke, ${Users.label(u)}!`, { color: '#ff9be0', icon: '💖', prio: 2, u });
        break;
      }
    }
  },
  flushLikes() {
    const D = CONFIG.damage;
    for (const u of Users.map.values()) {
      if (u.likeBuf <= 0) continue;
      const dmg = Math.min(u.likeBuf * D.like, D.likeMaxPerBundle);
      u.likeBuf = 0;
      if (dmg > 0) this.hit(u, dmg, 'like');
    }
  },
  ensureHelper(u) {
    if (u.muted) return;
    if (u.helper && !u.helper.dead && u.helper.state !== 'leave') { u.helper.lastAct = gnow(); return; }
    if (this.helpers.filter(h => h.state !== 'leave').length >= CONFIG.helpers.max) {
      let old = null; for (const h of this.helpers) if (h.state !== 'leave' && (!old || h.lastAct < old.lastAct)) old = h;
      if (!old || gnow() - old.lastAct < 8) return;
      old.leave(); const ou = Users.map.get(old.uid); if (ou) ou.helper = null;
    }
    if (this.mode === 'duel' && !u.team) u.team = Math.random() < 0.5 ? 1 : 2;
    const h = new Helper(u); u.helper = h; this.helpers.push(h);
    this.layoutHelpers();
  },
  /* Plätze rund um das Ei/die Eier verteilen */
  helperSlots() {
    const xs = this.eggXs(this.mode), gy = CONFIG.layout.groundY, rows = [[-4, 0.9], [36, 1], [76, 1.08], [116, 1.14]];
    const make = (ex, rx, team, innerSide, innerMax) => {
      const out = [];
      rows.forEach(([dy, sc], r) => {
        for (const side of [-1, 1]) {
          const maxK = side === innerSide ? innerMax : 6;
          for (let k = 0; k < maxK; k++) {
            const x = ex + side * (rx * 0.95 + 42 + k * 58 + (r % 2) * 22);
            if (x < 46 || x > 925) continue;
            out.push({ x, y: gy + dy, scale: sc, team, d: Math.abs(x - ex) + r * 40 });
          }
        }
      });
      return out.sort((a, b) => a.d - b.d);
    };
    if (this.mode === 'duel') { const rx = EGG_SIZES.duel[0]; return { 1: make(xs[0], rx, 1, 1, 1), 2: make(xs[1], rx, 2, -1, 1) }; }
    const rx = (EGG_SIZES[this.mode] || EGG_SIZES.normal)[0];
    return { 0: make(xs[0], rx, 0, 0, 6).filter(s => s.y < gy + 100) };
  },
  layoutHelpers() {
    const slots = this.helperSlots();
    const used = { 0: 0, 1: 0, 2: 0 };
    const active = this.helpers.filter(h => h.state !== 'leave').sort((a, b) => a.joinedAt - b.joinedAt);
    for (const h of active) {
      let team = 0;
      if (this.mode === 'duel') { const u = Users.map.get(h.uid); team = u && u.team ? u.team : 1; }
      const list = slots[team] || [];
      const s = list[used[team]++];
      if (s) h.setSlot(s); else { h.setSlot({ x: h.fromLeft ? -50 : 1130, y: 1060, scale: 1 }); }
    }
  },
  /* Treffer auf ein Ei */
  hit(u, dmg, kind) {
    this.ensureHelper(u);
    if (this.phase !== 'play' || this.paused) return;
    let egg = this.eggs[0];
    if (this.mode === 'duel') {
      if (!u.team) { u.team = Math.random() < 0.5 ? 1 : 2; this.layoutHelpers(); }
      egg = this.eggs.find(e => e.team === u.team);
    }
    if (!egg || (egg.state !== 'idle' && egg.state !== 'drop')) return;
    egg.hp = Math.max(0, egg.hp - dmg);
    const c = egg.contrib.get(u.id) || { n: u.name, d: 0 }; c.n = u.name; c.d += dmg; egg.contrib.set(u.id, c);
    if (!u.muted) egg.lastHitter = { id: u.id, n: u.name }; else egg.lastHitter = { id: u.id, n: CONFIG.names.anonymous };
    Board.add(u, dmg);
    // Effekte
    const W = CONFIG.wobble, big = dmg >= CONFIG.damage.bigHitAt;
    egg.va += (Math.random() < 0.5 ? -1 : 1) * W.hitImpulse * (0.4 + Math.min(dmg, 6) * 0.25) * (kind === 'like' ? 0.5 : 1);
    if (egg.h <= 0 && (kind !== 'like' || Math.random() < 0.3)) egg.vh = 90 + Math.min(dmg, 10) * 22;
    egg.flash = Math.max(egg.flash, big ? 0.7 : 0.25);
    const nShards = kind === 'like' ? (Math.random() < 0.5 ? 1 : 0) : clamp(Math.round(2 + dmg * 1.2), 2, 14);
    this.shards(egg, nShards, u.helper ? u.helper.x : null);
    if (kind !== 'like') Sound.knock(clamp(dmg / 6, 0, 1));
    if (big) this.shake = Math.min(1, this.shake + 0.4);
    if (kind === 'follow') { egg.bigCrack = 0.7; Sound.bigHit(); this.shake = Math.min(1, this.shake + 0.5); this.flash = Math.max(this.flash, 0.25); this.flashColor = '#fff6c2'; }
    else if (kind === 'share' || kind === 'gift') Sound.chime(kind === 'gift');
    if (!u.muted) {
      this.pop(u, egg, kind);
      if (u.helper && u.helper.state === 'idle') u.helper.peck();
    }
    // Riss-Stufen 20/40/60/80 %
    const st = Math.min(4, Math.floor(egg.progress / 0.2 + 1e-9));
    while (egg.stage < st) {
      egg.stage++; egg.stageAt[egg.stage - 1] = this.t;
      Sound.crack(egg.stage); this.shake = Math.min(1, this.shake + 0.35); this.shards(egg, 14);
    }
    if (egg.hp <= 0) this.hatch(egg);
  },
  shards(egg, n, fromX) {
    for (let i = 0; i < n; i++) {
      let a = rand(-Math.PI * 0.95, -Math.PI * 0.05);
      if (fromX != null) a = fromX < egg.x ? rand(-Math.PI * 0.95, -Math.PI * 0.55) : rand(-Math.PI * 0.45, -Math.PI * 0.05);
      const px = egg.x + Math.cos(a) * egg.rx * 0.85, py = egg.cy + Math.sin(a) * egg.ry * 0.75;
      FX.spawn({ type: 'shard', layer: 1, x: px, y: py, vx: Math.cos(a) * rand(150, 380), vy: Math.sin(a) * rand(200, 420) - 120, g: 1300, size: rand(7, 14),
        rot: rand(0, TAU), vr: rand(-10, 10), life: rand(0.8, 1.3), color: Math.random() < 0.7 ? egg.color : egg.color2, floor: egg.groundY + rand(10, 60) });
    }
  },
  pop(u, egg, kind) {
    if (this.pops.length >= CONFIG.pops.max) { this.popOverflow++; return; }
    const a = rand(-Math.PI * 0.92, -Math.PI * 0.08);
    const col = { comment: '#ffffff', like: '#ff9db8', follow: '#ffd84a', share: '#7fe0ff', gift: '#ff9be0' }[kind] || '#fff';
    this.pops.push({ text: u.name, x: egg.x + Math.cos(a) * egg.rx * 1.05, y: egg.cy + Math.sin(a) * egg.ry * 0.95, t: 0, life: 1.3, color: col, size: kind === 'follow' ? 40 : kind === 'like' ? 26 : 30 });
  },
  teamPop(u, team) {
    if (u.muted) return;
    const egg = this.eggs.find(e => e.team === team);
    const x = egg ? egg.x : this.eggXs('duel')[team - 1];
    const y = egg ? egg.cy + rand(-30, 50) : 860;
    if (this.pops.length < CONFIG.pops.max + 4) this.pops.push({ text: `${u.name} → ${team}`, x: x + rand(-50, 50), y, t: 0, life: 1.6, color: team === 1 ? '#ffb08a' : '#9fe0ff', size: 30 });
  },
  greet(u) {
    if (u.muted || u.filtered) return;            // gefilterte Namen nicht extra hervorheben
    this.greetBuf.push(u);
  },
  toast(text, o = {}) {
    if (o.u && o.u.muted) return;
    if (this.toastQueue.length > 8) { const i = this.toastQueue.findIndex(t => t.prio <= 1); if (i >= 0) this.toastQueue.splice(i, 1); else if ((o.prio || 1) <= 1) return; }
    this.toastQueue.push({ text, color: o.color || '#ffffff', icon: o.icon || '', prio: o.prio || 1, t: 0, life: o.life || 3.2 });
    this.toastQueue.sort((a, b) => b.prio - a.prio);
  },

  /* ---------- Schlüpfen ---------- */
  rollRarity(minKey) {
    const w = CONFIG.rarity.weights, minI = minKey ? RARITY_ORDER.indexOf(minKey) : 0;
    const keys = RARITY_ORDER.filter((k, i) => i >= minI);
    const sum = keys.reduce((a, k) => a + Math.max(0, w[k] || 0), 0);
    if (sum <= 0) return keys[keys.length - 1];
    let r = Math.random() * sum;
    for (const k of keys) { r -= Math.max(0, w[k] || 0); if (r <= 0) return k; }
    return keys[keys.length - 1];
  },
  hatch(egg) {
    egg.state = 'burst'; egg.burstT = 0;
    const rarity = this.rollRarity(this.mode === 'boss' ? 'epic' : null);
    const sp = pick(SPECIES);
    const pals = PALETTES[rarity];
    const last = egg.lastHitter;
    const namerU = last ? Users.map.get(last.id) : null;
    const name = last && namerU && !namerU.muted ? namerU.name : (last ? last.n : CONFIG.names.anonymous);
    const top3 = [...egg.contrib.entries()].filter(([id]) => !Persist.isMuted(id)).sort((a, b) => b[1].d - a[1].d).slice(0, 3).map(([id, c]) => ({ name: c.n, pts: c.d }));
    let team = null, members = [];
    if (this.mode === 'duel') {
      team = egg.team;
      members = [...Users.map.values()].filter(u => u.team === team && !u.muted && this.sessionUsers.has(u.id) && u.lastActive > gnow() - this.duration - 30)
        .sort((a, b) => ((egg.contrib.get(b.id) || { d: 0 }).d) - ((egg.contrib.get(a.id) || { d: 0 }).d)).map(u => u.name);
      for (const e of this.eggs) if (e !== egg) { e.state = 'roll'; e.rollDir = e.x < egg.x ? -1 : 1; }
    }
    const secs = Math.round(this.duration - this.timeLeft);
    this.hatchInfo = { egg, rarity, species: sp.key, speciesName: sp.name, palIdx: randInt(0, pals.length - 1), seed: randInt(1, 1e6), name, top3, team, members, secs, x: egg.x, y: egg.groundY };
    this.phase = 'hatch'; this.phaseT = 0;
    this.totals.hatches++; this.hatchTimes.push(secs); if (this.hatchTimes.length > 30) this.hatchTimes.shift();
    // Effekte
    this.flash = 1; this.flashColor = RARITIES[rarity].glow || '#ffffff'; this.shake = Math.min(1, this.shake + 0.7);
    Sound.hatch(rarity);
    this.shards(egg, 30);
    const confCols = ['#ff5f8a', '#ffd84a', '#5cc8ff', '#7bd35b', '#b86bff', '#ff9d5c'];
    for (let i = 0; i < 70; i++) FX.spawn({ type: 'confetti', layer: 2, x: egg.x + rand(-60, 60), y: egg.cy, vx: rand(-520, 520), vy: rand(-1100, -450), g: 900, drag: 1.2, size: rand(6, 11), rot: rand(0, TAU), vr: rand(-8, 8), life: rand(1.8, 2.8), color: pick(confCols), important: true });
    if (rarity === 'epic' || rarity === 'legendary') for (let i = 0; i < 40; i++) FX.spawn({ type: 'star', layer: 2, x: egg.x, y: egg.cy, vx: rand(-420, 420), vy: rand(-520, 200), drag: 1.5, size: rand(8, 16), rot: rand(0, TAU), vr: rand(-4, 4), life: rand(1.2, 2.2), color: RARITIES[rarity].glow, important: true });
    for (const h of this.helpers) h.cheerT = 2.4;
    // Meteor verglüht
    if (this.meteor) { this.meteor.state = 'fizzle'; this.meteor.t = 0; Sound.fizzle(); for (let i = 0; i < 30; i++) FX.spawn({ type: 'spark', layer: 1, x: this.meteor.x, y: this.meteor.y, vx: rand(-260, 260), vy: rand(-260, 200), drag: 2, size: rand(3, 7), life: rand(0.6, 1.2), color: pick(['#ffb13d', '#fff2a8', '#ff7a2f']) }); }
    Sound.setUrgency(0);
    // Sammlung, Lexikon, Meilensteine
    const res = Coll.record(namerU && !namerU.muted ? namerU : null, sp.key, rarity);
    const adj = { common: 'gewöhnlicher', rare: 'seltener', epic: 'epischer', legendary: 'legendärer' }[rarity];
    if (res.newSpecies) this.toast(`Neu im Lexikon: ${sp.name}!`, { color: '#7bd35b', icon: '📖', prio: 2, life: 3.6 });
    if (res.firstCombo && (rarity === 'epic' || rarity === 'legendary')) this.toast(`Erster ${adj} ${sp.name}!`, { color: RARITIES[rarity].color, icon: '🏆', prio: 3, life: 3.8 });
    if (namerU && !namerU.muted && CONFIG.milestones.includes(res.total)) this.toast(`${namerU.name} hat jetzt ${res.total} Dinos benannt!`, { color: '#ffd84a', icon: '🎉', prio: 3, life: 3.8 });
    HUD.lexDirty = true;
    StatsLog.event('hatch', { mode: this.mode, secs, species: sp.key, rarity, maxHp: Math.round(egg.maxHp), active: Users.activeCount() });
    Persist.save();
  },

  /* ---------- Meteor-Einschlag ---------- */
  impact() {
    this.phase = 'impact'; this.phaseT = 0; this._boomed = false;
    const target = this.eggs.length ? this.eggs.reduce((a, e) => a + e.x, 0) / this.eggs.length : CONFIG.layout.centerX;
    this.meteor.state = 'dive'; this.meteor.t = 0; this.meteor.fx = this.meteor.x; this.meteor.fy = this.meteor.y; this.meteor.fr = this.meteor.r;
    this.meteor.tx = target; this.meteor.ty = CONFIG.layout.groundY - 140;
    const best = this.eggs.reduce((a, e) => Math.max(a, e.progress), 0);
    this.impactInfo = { progress: best };
    Sound.whoosh(0.9); Sound.setUrgency(0);
    this.totals.impacts++;
    StatsLog.event('impact', { mode: this.mode, progress: Math.round(best * 100), active: Users.activeCount() });
  },
  boom() {
    this._boomed = true;
    this.flash = 1; this.flashColor = '#ffffff'; this.shake = 1;
    Sound.impact();
    const cx = this.meteor.tx, cy = CONFIG.layout.groundY - 60;
    for (let i = 0; i < 46; i++) FX.spawn({ type: 'blob', layer: 2, x: cx + rand(-120, 120), y: cy + rand(-60, 40), vx: rand(-420, 420), vy: rand(-320, 40), drag: 1.6, size: rand(40, 80), grow: 70, life: rand(2.4, 3.6), color: pick(['#b89a7a', '#9c8068', '#cdb89c']), alpha: 0.85, important: true });
    for (let i = 0; i < 22; i++) FX.spawn({ type: 'rock', layer: 2, x: cx, y: cy, vx: rand(-700, 700), vy: rand(-1000, -300), g: 1500, size: rand(8, 18), rot: rand(0, TAU), vr: rand(-8, 8), life: rand(1.2, 2), color: '#7a6a7e', floor: CONFIG.layout.groundY + rand(0, 120), important: true });
    for (let i = 0; i < 30; i++) FX.spawn({ type: 'spark', layer: 2, x: cx, y: cy, vx: rand(-600, 600), vy: rand(-700, 100), g: 600, size: rand(4, 9), life: rand(0.6, 1.3), color: pick(['#ffb13d', '#ff7a2f', '#fff2a8']), important: true });
    FX.spawn({ type: 'ring', layer: 2, x: cx, y: CONFIG.layout.groundY, size: 30, grow: 900, life: 0.7, color: 'rgba(255,240,200,0.9)', squash: 0.3, important: true });
    for (const e of this.eggs) { this.shards(e, 24); e.state = 'gone'; }
    for (const h of this.helpers) { h.vh = rand(400, 560); h.cheerT = 0; }
    this.meteor.alpha = 0;
  },

  /* ---------- Hotkeys / Host-Befehle ---------- */
  hotkey(k) {
    switch (k) {
      case 'B': this.override = 'boss'; return 'Boss-Ei kommt als Nächstes';
      case 'D': this.override = 'duel'; return 'Duell kommt als Nächstes';
      case 'E': return 'Ereignis: ' + World.randomEvent();
      case 'P': this.paused = !this.paused; Sound.paused = this.paused; return this.paused ? 'Pause an' : 'Pause aus';
      case 'M': Sound.setMuted(!Sound.muted); return Sound.muted ? 'Ton aus' : 'Ton an';
      case 'R': this.resetRound(); return 'Ei neu gestartet';
    }
    return '';
  },
  resetRound() {
    this.paused = false; Sound.paused = false;
    for (const e of this.eggs) e.state = 'gone';
    this.eggNumber = Math.max(0, this.eggNumber - 1); this.totals.eggs = Math.max(0, this.totals.eggs - 1);
    this.startRound(this.mode === 'boss' || this.mode === 'duel' ? this.mode : 'normal');
  },

  /* ---------- Update ---------- */
  update(dt) {
    const rdt = dt;                                   // Echtzeit (Animationen)
    if (!this.paused) this.t += dt;
    this.phaseT += this.paused ? 0 : dt;
    // Likes bündeln
    if (gnow() - this.lastLikeFlush >= CONFIG.damage.likeBundleMs / 1000) { this.lastLikeFlush = gnow(); this.flushLikes(); }
    // Begrüßungen bündeln
    if (this.greetBuf.length && now() - this.greetAt > 1.2) {
      this.greetAt = now();
      if (this.greetBuf.length === 1) this.toast(`${this.greetBuf[0].name} ist dabei!`, { icon: '👋', prio: 1, life: 2.4 });
      else this.toast(`${this.greetBuf[0].name} und ${this.greetBuf.length - 1} weitere sind dabei!`, { icon: '👋', prio: 1, life: 2.6 });
      Sound.pop(); this.greetBuf = [];
    }
    // Aktivität der letzten ~5 s
    const win = CONFIG.wobble.windowSec;
    while (this.activity.length && this.activity[0].t < this.t - win) this.activity.shift();
    if (this.activity.length > 4000) this.activity.splice(0, this.activity.length - 4000);

    if (!this.paused) {
      if (this.phase === 'intro') {
        if (this.announce) this.announce.t += dt;
        if (this.phaseT >= this.introDur) { this.announce = null; this.spawnEggs(); }
      } else if (this.phase === 'play') {
        this.timeLeft -= dt;
        if (this.t - this.lastRescale > CONFIG.hp.rescaleEverySec) { this.lastRescale = this.t; this.rescaleHp(); }
        const urg = clamp((CONFIG.timer.urgentAt - this.timeLeft) / CONFIG.timer.urgentAt, 0, 1);
        Sound.setUrgency(urg);
        const sec = Math.ceil(this.timeLeft);
        if (sec !== this.lastTick) { this.lastTick = sec; if (sec <= 10 && sec > 0) Sound.tick(sec <= 5); }
        if (this.timeLeft <= 0) this.impact();
      } else if (this.phase === 'hatch') {
        if (this.phaseT >= CONFIG.reveal.hatchSec) { this.phase = 'reveal'; this.phaseT = 0; Sound.sparkle(); }
      } else if (this.phase === 'reveal') {
        if (this.phaseT >= CONFIG.reveal.cardSec) this.finishReveal();
      } else if (this.phase === 'impact') {
        if (!this._boomed && this.phaseT >= 0.9) this.boom();
        if (this.phaseT >= 5.2) { this.softer = CONFIG.hp.afterImpactMult; this.startRound(this.pickNextMode()); }
      }
    }
    this.updateMeteor(rdt);
    this.updateEggs(rdt);
    // Helfer
    const eggXFor = h => { if (!h.slot) return null; const e = this.mode === 'duel' ? this.eggs.find(e => e.team === h.slot.team) : this.eggs[0]; return e ? e.x : this.eggXs(this.mode)[Math.max(0, (h.slot.team || 1) - 1)]; };
    for (const h of this.helpers) {
      if (h.state !== 'leave' && gnow() - h.lastAct > CONFIG.helpers.inactiveSec) { h.leave(); const u = Users.map.get(h.uid); if (u && u.helper === h) u.helper = null; }
      h.update(rdt, eggXFor(h));
    }
    if (this.helpers.some(h => h.dead)) { this.helpers = this.helpers.filter(h => !h.dead); }
    // Pops
    for (const p of this.pops) p.t += rdt;
    this.pops = this.pops.filter(p => p.t < p.life);
    if (this.popOverflow > 0 && now() - this.popOverflowAt > 0.6 && this.eggs.length) {
      this.popOverflowAt = now(); const e = pick(this.eggs);
      this.pops.push({ text: `+${this.popOverflow} weitere`, x: e.x + rand(-40, 40), y: e.cy - e.ry - 10, t: 0, life: 1.2, color: '#ffe680', size: 34 });
      this.popOverflow = 0;
    }
    // Toasts
    for (const t of this.toasts) t.t += rdt;
    this.toasts = this.toasts.filter(t => t.t < t.life);
    while (this.toasts.length < 2 && this.toastQueue.length) { const t = this.toastQueue.shift(); t.t = 0; this.toasts.push(t); if (t.prio >= 2) Sound.chime(t.prio >= 3); }
    // Effekte abklingen
    this.shake = Math.max(0, this.shake - rdt * 1.6);
    this.flash = Math.max(0, this.flash - rdt * 1.8);
    // Speichern
    if (now() - this.lastSaveAt > CONFIG.save.everySec) { this.lastSaveAt = now(); Persist.save(); }
  },
  finishReveal() {
    const info = this.hatchInfo;
    if (info) {
      const d = new HerdDino({ species: info.species, rarity: info.rarity, palIdx: info.palIdx, name: info.name, seed: info.seed });
      d.join(info.x, info.y);
      World.herd.push(d);
      const staying = World.herd.filter(h => !h.leaving);
      if (staying.length > CONFIG.herd.maxVisible) staying.slice(0, staying.length - CONFIG.herd.maxVisible).forEach(h => h.leave());
    }
    this.hatchInfo = null;
    this.startRound(this.pickNextMode());
    Persist.save();
  },
  intensity(team) {
    let s = 0; for (const a of this.activity) if (!team || a.team === team) s += a.w;
    const rate = s / CONFIG.wobble.windowSec;
    return 1 - Math.exp(-rate / 2.5);
  },
  updateEggs(dt) {
    const W = CONFIG.wobble;
    for (const e of this.eggs) {
      e.flash = Math.max(0, e.flash - dt * 3); e.bigCrack = Math.max(0, e.bigCrack - dt);
      if (e.state === 'drop') {
        e.dropT += dt;
        const k = clamp(e.dropT / 0.75, 0, 1);
        e.drop = (1 - easeInCubic(k)) * 1400;
        if (k >= 1) { e.state = 'idle'; e.drop = 0; e.squash = 0.25; Sound.thud(); this.shake = Math.min(1, this.shake + (e.boss ? 0.6 : 0.25));
          for (let i = 0; i < 14; i++) FX.spawn({ type: 'blob', layer: 1, x: e.x + rand(-e.rx, e.rx), y: e.groundY + rand(-6, 10), vx: rand(-160, 160), vy: rand(-60, -10), drag: 2, size: rand(14, 26), grow: 30, life: 0.9, color: '#d9c39c', alpha: 0.7 }); }
      }
      if (e.state === 'idle' || e.state === 'drop') {
        const I = this.intensity(this.mode === 'duel' ? e.team : 0);
        e.intensity = I;
        const drive = Math.sin(this.t * (5 + I * 7) + e.phase) * W.drive * I + (Math.random() - 0.5) * W.drive * I * 1.6;
        e.va += (-W.stiffness * e.a - W.damping * e.va + drive) * dt;
        e.a = clamp(e.a + e.va * dt, -0.45, 0.45);
        if (e.h <= 0 && I > 0.35 && Math.random() < I * dt * 1.6) e.vh = 120 + I * 260;
        e.vh -= 2200 * dt; e.h += e.vh * dt; if (e.h <= 0) { if (e.vh < -300) e.squash = 0.12; e.h = 0; e.vh = 0; }
        e.squash = Math.max(0, e.squash - dt * 1.5);
      } else if (e.state === 'burst') {
        e.burstT += dt;
      } else if (e.state === 'roll') {
        e.x += e.rollDir * 420 * dt; e.a += e.rollDir * 5 * dt; e.alpha = Math.max(0, e.alpha - dt * 0.6);
      }
    }
  },
  updateMeteor(dt) {
    const m = this.meteor; if (!m) return;
    m.t += dt;
    if (m.state === 'sky') {
      const q = this.phase === 'play' ? clamp(1 - this.timeLeft / this.duration, 0, 1) : 0;
      m.r = lerp(9, 72, Math.pow(q, 1.5)); m.heat = Math.pow(q, 2);
      m.alpha = this.phase === 'play' ? Math.min(1, m.alpha + dt * 0.8) : Math.max(0, m.alpha - dt);
      m.x = lerp(870, 805, q) + Math.sin(this.t * 0.7) * 4; m.y = lerp(545, 610, q);
      if (this.timeLeft < CONFIG.timer.urgentAt && this.phase === 'play') { m.x += rand(-1, 1) * m.heat * 3; m.y += rand(-1, 1) * m.heat * 3; }
    } else if (m.state === 'dive') {
      const k = clamp(m.t / 0.9, 0, 1), e = easeInCubic(k);
      m.x = lerp(m.fx, m.tx, e); m.y = lerp(m.fy, m.ty, e); m.r = lerp(m.fr, 120, e); m.heat = 1; m.alpha = this._boomed ? 0 : 1;
      if (!this._boomed && Math.random() < 0.8) FX.spawn({ type: 'blob', layer: 1, x: m.x + rand(-10, 10), y: m.y + rand(-10, 10), vx: rand(20, 80), vy: rand(-80, -20), size: m.r * 0.6, grow: 40, life: 0.6, color: '#ff8a3d', alpha: 0.6, additive: true });
    } else if (m.state === 'fizzle') {
      m.alpha = Math.max(0, m.alpha - dt * 2.2); m.r *= 1 + dt * 0.6;
    }
  },
};

/* Duell: "1"/"2" (auch "team 1", "#2", "1️⃣") erkennen */
function parseTeam(text) {
  if (!text) return 0;
  const s = String(text).trim().toLowerCase().replace(/️|⃣/g, '');
  const m = s.match(/^(?:team\s*|#)?([12])(?:\s*[!.]*)$/);
  return m ? Number(m[1]) : 0;
}

/* ==========================================================================
   Persistenz: Herde, Bestenlisten, Sammlungen, laufendes Ei (alle 10 s)
   ========================================================================== */
Persist.snapshot = function () {
  let round = null;
  if (Game.phase === 'play' && Game.eggs.length && Game.eggs.every(e => e.state === 'idle' || e.state === 'drop')) {
    round = { mode: Game.mode, timeLeft: Game.timeLeft, duration: Game.duration,

  drawScene(ctx, t) {
    const sh = Game.shake * Game.shake * 22;
