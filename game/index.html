<script>
'use strict';
/* ==========================================================================
   DINO-EI KNACKEN – interaktives TikTok-LIVE-Spiel
   --------------------------------------------------------------------------
   Eine Datei, keine Abhängigkeiten. Aufbau:
     1. CONFIG ............ alle Spielwerte zentral
     2. Utils ............. Mathe, Zufall, Farben, Text mit Kontur
     3. Store ............. localStorage (abgesichert)
     4. NameFilter ........ Wortfilter für eingeblendete Namen
     5. AudioEngine ....... WebAudio-Soundeffekte + dezente Eigenmusik
     6. Particles ......... Splitter, Staub, Funken, Konfetti …
     7. Art ............... prozedurale Dinos, Helfer, Eier, Risse
     8. World ............. Hintergrund (Tag/Nacht, Vulkan, Herde, Ereignisse)
     9. Users/Leaderboard . Mitspieler, Bestenlisten, Sammlungen
    10. Game .............. Spielablauf, Modi, Meteor, Schaden
    11. HUD ............... Texte, Karten, Banner, Ansagen
    12. Net/Test .......... Bridge-Verbindung, Testmodus-Simulation
    13. Panel ............. Host-Panel (lokal oder eigenes Fenster)
    14. StatsLog .......... Stream-Statistik (CSV/JSON)
    15. Boot .............. Start, Spielschleife, Eingaben
   ========================================================================== */

/* ==========================================================================
   1. CONFIG – alle Spielwerte an einer Stelle
   (Änderungen im Host-Panel werden als Overrides in localStorage gespeichert)
   ========================================================================== */
const CONFIG = {
  W: 1080, H: 1920,                       // Zeichenfläche 9:16
  layout: {
    safeTop: 140,                         // darüber: TikTok-Profilzeile
    safeRight: 945,                       // rechts davon: TikTok-Buttons → nur Deko
    safeBottom: 1280,                     // unteres Drittel: Chat → nur Deko
    centerX: 480,                         // Mitte der sicheren Fläche (für Texte/Banner)
    eggX: 450,                            // Ei leicht links der Mitte; rechts oben die große Bestenliste
    groundY: 1118,                        // Felskante (Bühne) im Höhlenbild, auf der das Ei im Steinnest liegt → Ei-Mitte ≈ 930
  },
  assets: { enabled: true },              // Bilder aus game/assets (Höhle, Eier, Dinos). Fehlt ein Bild → gezeichnete Grafik
  timer: {                                 // Meteor-Countdown in Sekunden
    normal: 240, boss: 360, duel: 240,
    urgentAt: 30,                         // ab hier wird es dringlich
  },
  hp: {                                    // HP = (base + perUser · eff^exponent) · Modus-Faktor
    base: 8, perUser: 11, exponent: 0.95, // Testmodus (60 % Aktivität): ≈ 3–4 min pro Ei bei 30–500 Zuschauern
    smallGroup: 3,                        // Kleingruppen-Bonus: eff = aktive² / (aktive + smallGroup) → 1–3 Leute schaffen es locker (0 = aus)
    min: 8, max: 8000,
    bossMult: 2.2, duelMult: 0.55,
    afterImpactMult: 0.8,                 // nach Meteor-Einschlag ist das nächste Ei weicher
    activeWindowSec: 60,                  // "aktiv" = interagiert in den letzten 60 s
    rescaleEverySec: 5,
  },
  damage: {
    comment: 1, commentCooldownMs: 2000,  // pro Nutzer max. 1 Treffer / 2 s
    like: 0.04, likeBundleMs: 1000, likeMaxPerBundle: 0.6,
    follow: 10, share: 5,
    giftPerDiamond: 0.5, giftMin: 2, giftMax: 15,   // gedeckelt – Spiel ist ohne Gifts schaffbar
    bigHitAt: 4,                          // ab diesem Schaden: Screenshake
  },
  rarity: {
    weights: { common: 60, rare: 25, epic: 12, legendary: 3 },
  },
  rotation: {
    normalsBeforeSpecial: 3,              // 3× Normal → 1× Spezial
    bossEnabled: true, duelEnabled: true,
    bossAnnounceSec: 30, duelAnnounceSec: 5, normalAnnounceSec: 2.5,
  },
  reveal: { hatchSec: 1.8, cardSec: 6 },
  helpers: { max: 30, inactiveSec: 60, tagSec: 4 },
  pops: { max: 8 },
  herd: { maxVisible: 15 },
  wobble: { windowSec: 5, stiffness: 55, damping: 5.5, drive: 9, hitImpulse: 2.2 },
  infoBanner: { always: true, everySec: 45, showSec: 8 },   // always: Regeln dauerhaft (außer bei Missionen); everySec = Lichtschimmer bzw. Banner-Abstand
  leaderboard: { rotateSec: 9 },
  dayNight: { cycleSec: 600 },
  miniEvents: { minSec: 35, maxSec: 70 },  // Hintergrund-Ereignisse (Regen, Parade, Glühwürmchen …)
  missions: {                             // Mini-Missionen: z. B. "25 Kommentare in 30 s" → MEGA-RISS
    enabled: true, minGapSec: 55, maxGapSec: 95,
    rewardPct: 0.15,                      // Bonus-Schaden in % der Ei-HP
    difficulty: 1.0,                      // Ziel = aktuelle Aktivität × difficulty (0.6 = leichter, 1.3 = schwerer)
  },
  hype: {                                 // Hype-Leiste füllt sich durch Aktivität → kurz doppelter Schaden
    enabled: true, durationSec: 12, multiplier: 2, cooldownSec: 30,
  },
  bubbles: { enabled: true },             // Sprechblasen des Eis ("Hallo? Ist da wer?" …)
  audio: { master: 0.55, sfx: 0.7, music: 0.35, musicEnabled: true },
  names: { maxLen: 16, useNickname: false, anonymous: 'Anonymer Knacker' },
  avatars: { enabled: true },             // Profilbilder in Bestenliste, Karte & Einblendungen (nur mit Bridge)
  filter: { extraWords: [] },
  bridge: { url: 'ws://localhost:8787', retryMinMs: 1500, retryMaxMs: 15000 },
  save: { everySec: 10, key: 'dinoEi.v1', settingsKey: 'dinoEi.settings.v1', logKey: 'dinoEi.logs.v1' },
  perf: { maxParticles: 650, eventsPerFrame: 50, maxQueue: 2500 },
  test: { viewers: 20, activity: 45 },
  game: 'monster',                      // Spiel: 'monster' (Monster füttern), 'race' (Farb-Rennen), 'egg' (Dino-Ei) – im Panel umschaltbar
  monster: {                            // MONSTER FÜTTERN
    name: 'Pupi',                         // Name des Monsters (Texte & Ansagen)
    levelSec: 100,                        // Ziel: so lange dauert ein Level bei der aktuellen Aktivität
    maxLevel: 10, minNeed: 12,            // ab Max-Level: Party → Chat wählt die Farbe des nächsten Baby-Monsters
    comment: 1, commentCooldownMs: 2000,  // Kommentar = Keks (pro Nutzer max. 1 / 2 s)
    namedBonus: 0.5, favMult: 2,          // Essen im Kommentar genannt = +0,5; Lieblingsessen des Tages = ×2
    like: 0.08, likeMaxPerBundle: 1.2,    // Likes = Snacks (gebündelt je Nutzer und Sekunde)
    follow: 8, share: 5, giftPerDiamond: 0.5, giftMin: 2, giftMax: 15,   // Geschenke gedeckelt, keine Aufforderung
    hungerSec: 100, sleepAfterSec: 75,    // Hunger sinkt in ~100 s auf null; ohne Futter schläft es nach 75 s ein
    burpAt: 14, voteSec: 20, maxFlying: 30,
    saveKey: 'dinoMonster.v1',
  },
  race: {                               // FARB-RENNEN
    enabled: true,
    targetSec: 60, maxSec: 90,            // Ziel-Dauer eines Rennens (Distanz passt sich der Aktivität an) / Zeitlimit
    startSec: 4, finishSec: 9,            // Countdown vor dem Start / Siegerkarte
    minDist: 6,                           // mind. so viele Punkte bis ins Ziel
    cooldownMs: 1500,                     // pro Nutzer max. 1 Kommentar-Punkt / 1,5 s
    autoTeam: true,                       // Kommentar ohne Farbe → automatisch ins kleinste Team (zählt sofort mit)
    like: 0.05, likeMaxPerBundle: 0.6,    // Likes = kleiner Turbo fürs eigene Team (gedeckelt)
    follow: 5, share: 3, giftPerDiamond: 0.3, giftMax: 8,
    saveKey: 'dinoRennen.v1',
  },
  bots: {                               // Start-Bots: füllen auf, solange noch keine 20 echten Mitspieler da sind
    enabled: false, fill: 20,             // AUS: sichtbare Bots können für TikTok nach unechter Aktivität aussehen. Bots = fill − echte Mitspieler (jeder echte ersetzt nach und nach einen Bot)
    activity: 55,                         // % – wie fleißig die Bots kommentieren (nur Kommentare, als „Bot …“ erkennbar)
    realWindowSec: 300,                   // „echter Mitspieler“ = hat in den letzten 5 min mitgemacht
  },
  milestones: [3, 5, 10, 25, 50, 100, 250],
};
const CONFIG_DEFAULTS = JSON.parse(JSON.stringify(CONFIG));
let RACE_MODE = false, MONSTER_MODE = false, GAME = 'monster';                    // wird beim Start gesetzt (CONFIG.race.enabled oder ?spiel=ei / ?spiel=rennen)
/* Verschiebung der Landschaft gegenüber dem ursprünglichen Entwurf (Boden bei y = 1010) */
const LAND_DY = CONFIG.layout.groundY - 1010;

/* ==========================================================================
   2. Utils
   ========================================================================== */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a = 0, b = 1) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const easeInCubic = t => t * t * t;
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const easeInOutSine = t => -(Math.cos(Math.PI * t) - 1) / 2;
const now = () => performance.now() / 1000;
const gnow = () => Game.t;                 // Spielzeit (steht bei Pause) – für Aktivität, Cooldowns, Helfer
const fmtTime = s => { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };

function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function getPath(obj, path) { return path.split('.').reduce((o, k) => (o == null ? undefined : o[k]), obj); }
function setPath(obj, path, val) { const ks = path.split('.'); let o = obj; for (let i = 0; i < ks.length - 1; i++) { if (typeof o[ks[i]] !== 'object' || o[ks[i]] === null) o[ks[i]] = {}; o = o[ks[i]]; } o[ks[ks.length - 1]] = val; }

/* Farben */
function hexToRgb(h) { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function rgbStr(c, a = 1) { return a >= 1 ? `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})` : `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`; }
function mixRgb(a, b, t) { return [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)]; }
function shade(hex, amt) { const c = hexToRgb(hex); const t = amt < 0 ? [0, 0, 0] : [255, 255, 255]; return rgbStr(mixRgb(c, t, Math.abs(amt))); }
function hsl(h, s, l, a = 1) { return `hsla(${h},${s}%,${l}%,${a})`; }

/* Rechteck mit runden Ecken (eigene Implementierung → läuft auch in älteren Browsern/OBS) */
function rr(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
}

/* Typografie: große Spiel-Ansagen in "Cooper Black" (rund, kräftig – passt zu den 3D-Spielzeug-Dinos),
   Tafel-Überschriften in einer klassischen Serifenschrift (Bodoni – wie im Mockup),
   Namen & Fließtext in "Segoe UI Semibold" (klar, App-artig). Auf iPad/Mac greifen Ersatzschriften.
   Emojis werden nur gefüllt, nie umrandet. */
const FONTS = {
  title: '"Cooper Black", "Rockwell-ExtraBold", "Rockwell Extra Bold", "AmericanTypewriter-Bold", "Arial Rounded MT Bold", Georgia, serif',
  serif: '"Bodoni MT", "Bodoni 72", Didot, Georgia, "Times New Roman", serif',
  body: '"Segoe UI Semibold", "Segoe UI", -apple-system, "SF Pro Text", "Helvetica Neue", Arial, sans-serif',
};
FONTS.ui = '"SF Pro Display", "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI Variable Display", "Segoe UI", Inter, Roboto, Arial, sans-serif';   // Apple-Look
FONTS.uiHeavy = FONTS.ui;
const FONT_WEIGHT = { title: 400, serif: 700, body: 600, ui: 600, uiHeavy: 800 };
const fontStr = (size, f = 'body') => { const k = FONTS[f] ? f : 'body'; return `${FONT_WEIGHT[k]} ${size}px ${FONTS[k]}`; };
const EMOJI_SPLIT = /(\p{Extended_Pictographic}(?:️|‍\p{Extended_Pictographic}|[\u{1F3FB}-\u{1F3FF}])*)/u;
const EMOJI_TEST = /^\p{Extended_Pictographic}/u;
const OUTLINE = '#3b2617';                 // warme, dunkelbraune "Tusche" für alle Konturen
const CREAM = '#fff4dc';                   // Standard-Schriftfarbe

function measureText(ctx, text, size, f = 'body') { ctx.font = fontStr(size, f); return ctx.measureText(text).width; }

/* o: size, color, font ('title'|'body'), align, maxWidth, stroke(false), strokeWidth, strokeColor,
      drop (weicher Schatten), extrude (px: 3D-Kante nach unten wie bei Cartoon-Logos), alpha */
function drawText(ctx, text, x, y, o = {}) {
  text = String(text);
  const size = o.size || 48;
  ctx.font = fontStr(size, o.font);
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left';
  const parts = text.split(EMOJI_SPLIT).filter(p => p.length);
  const widths = parts.map(p => ctx.measureText(p).width);
  const total = widths.reduce((a, b) => a + b, 0);
  const sx = o.maxWidth && total > o.maxWidth ? o.maxWidth / total : 1;
  const w = total * sx;
  const start = o.align === 'left' ? x : o.align === 'right' ? x - w : x - w / 2;
  const sw = o.stroke === false ? 0 : (o.strokeWidth != null ? o.strokeWidth : Math.max(4, size * 0.17));
  ctx.save();
  if (o.alpha != null) ctx.globalAlpha *= o.alpha;
  ctx.translate(start, y);
  ctx.scale(sx, 1);
  ctx.lineJoin = 'round'; ctx.miterLimit = 2;
  const strokeCol = o.strokeColor || OUTLINE;
  const strokeAll = (dy, col) => { ctx.strokeStyle = col; let cx = 0; for (let i = 0; i < parts.length; i++) { if (!EMOJI_TEST.test(parts[i])) ctx.strokeText(parts[i], cx, dy); cx += widths[i]; } };
  if (sw > 0) {
    ctx.lineWidth = sw;
    if (o.extrude) { for (let d = o.extrude; d >= 1; d -= 2) strokeAll(d, strokeCol); }
    else if (o.drop !== false) strokeAll(size * 0.07, 'rgba(59,38,23,0.38)');   // weicher, warmer Schatten
    strokeAll(0, strokeCol);
  }
  ctx.fillStyle = o.color || CREAM;
  let cx = 0; for (let i = 0; i < parts.length; i++) { ctx.fillText(parts[i], cx, 0); cx += widths[i]; }
  ctx.restore();
  return w;
}

/* Text auf mehrere Zeilen umbrechen, damit er in maxWidth passt */
function wrapText(ctx, text, size, maxWidth, f = 'body') {
  ctx.font = fontStr(size, f);
  const words = String(text).split(' '); const lines = []; let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxWidth && line) { lines.push(line); line = w; } else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

/* weiches Leuchten/Staub als vorgerenderter Sprite (schneller als shadowBlur) */
const _blobCache = new Map();
function softBlob(color) {
  if (_blobCache.has(color)) return _blobCache.get(color);
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'); const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  const rgb = hexToRgb(color);
  gr.addColorStop(0, rgbStr(rgb, 1)); gr.addColorStop(0.45, rgbStr(rgb, 0.55)); gr.addColorStop(1, rgbStr(rgb, 0));
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  _blobCache.set(color, c); return c;
}

function downloadFile(filename, content, mime = 'application/json') {
  try {
    const blob = new Blob([content], { type: mime });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  } catch (e) { console.warn('Download fehlgeschlagen', e); }
}

/* --------------------------------------------------------------------------
   Bilder (game/assets): Höhle, Eier, Dinos, Steinnest, Meteor.
   Werden im Hintergrund geladen; solange ein Bild fehlt (oder nicht existiert),
   zeichnet das Spiel die alte prozedurale Grafik → läuft immer, auch offline/per Doppelklick.
   Wichtig: Pixel werden NIE ausgelesen (file:// würde das blockieren) – nur gezeichnet.
   -------------------------------------------------------------------------- */
const DINO_KEYS = ['trex', 'triceratops', 'stegosaurus', 'brachiosaurus', 'velociraptor', 'ankylosaurus', 'parasaurolophus', 'spinosaurus', 'pteranodon', 'dilophosaurus'];

  files: Object.assign({ bg: 'bg_cave.jpg', bgBoss: 'bg_cave_boss.jpg', bgRace: 'bg_race.jpg', bgMonster: 'bg_monster.jpg',

/* ==========================================================================
   3. Store – localStorage mit try/catch (privater Modus, volle Quote, file:// …)
   ========================================================================== */
const Store = {
  ok: true,
  get(key, fallback) { try { const s = localStorage.getItem(key); return s ? JSON.parse(s) : fallback; } catch (e) { return fallback; } },
  set(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); this.ok = true; return true; } catch (e) { this.ok = false; return false; } },
  del(key) { try { localStorage.removeItem(key); } catch (e) { /* egal */ } },
};

/* Einstellungen (Overrides) aus dem Host-Panel laden */
(function loadSettings() {
  const s = Store.get(CONFIG.save.settingsKey, null);
  if (!s || typeof s !== 'object') return;
  for (const [path, val] of Object.entries(s)) {
    const def = getPath(CONFIG_DEFAULTS, path);
    if (def === undefined) continue;
    if (typeof def === typeof val || (Array.isArray(def) && Array.isArray(val))) setPath(CONFIG, path, val);
  }
})();
function saveSetting(path, val) {
  const s = Store.get(CONFIG.save.settingsKey, {}) || {};
  s[path] = val; Store.set(CONFIG.save.settingsKey, s);
}

const NameFilter = {
  leet: { '0': 'o', '1': 'i', '2': 'z', '3': 'e', '4': 'a', '5': 's', '6': 'g', '7': 't', '8': 'b', '9': 'g', '@': 'a', '$': 's', '!': 'i', '|': 'i', '€': 'e' },
  _list: null,
  norm(s) { return String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); },
  plain(s) { return this.norm(s).replace(/[^a-z0-9]/g, ''); },
  /* zwei Varianten: "1" und "|" können für i ODER l stehen (sch1ampe → schlampe) */
  leetify(s, oneIsL) { return this.norm(s).replace(/[0-9@$!|€]/g, c => (oneIsL && (c === '1' || c === '|')) ? 'l' : (this.leet[c] || c)).replace(/[^a-z0-9]/g, ''); },
  collapse(s) { return s.replace(/(.)\1+/g, '$1'); },
  list() {
    if (!this._list) {
      const all = BLOCKLIST.concat(CONFIG.filter.extraWords || []);
      // c = Wort ohne Buchstaben-Wiederholungen ("fuuuck" → "fuck"); nur ab 4 Zeichen nutzen,
      // sonst würde z. B. "xxx" → "x" jeden Namen mit einem x treffen.
      this._list = all.map(w => this.plain(w)).filter(w => w.length >= 3).map(w => ({ w, c: this.collapse(w) }));
    }

  },
  invalidate() { this._list = null; },
  isBad(name) {
    const p = this.plain(name), l = this.leetify(name), l2 = this.leetify(name, true), lc = this.collapse(l), lc2 = this.collapse(l2);
    return this.list().some(({ w, c }) => p.includes(w) || l.includes(w) || l2.includes(w) || (c.length >= 4 && (lc.includes(c) || lc2.includes(c))));
  },
  /* liefert {name, filtered} – name ist sicher für die Anzeige */
  clean(raw) {
    let s = String(raw || '').replace(/[\p{C}]/gu, '').replace(/\s+/g, ' ').trim();
    if (!s) return { name: CONFIG.names.anonymous, filtered: true };
    if (this.isBad(s)) return { name: CONFIG.names.anonymous, filtered: true };
    const chars = Array.from(s);

    return { name: s, filtered: false };

  _paths: new Map(),
  /* Eiform: oben spitzer, unten runder; Mittelpunkt (0,0) */

    for (let i = 0; i <= N; i++) {

/* ==========================================================================
   8. World – Hintergrund ist NIE statisch (TikTok beendet statische Streams):

/* --------------------------------------------------------------------------
   Sprite-Cache: Herde und Helfer werden als vorgerenderte Animations-Einzelbilder

/* --------------------------------------------------------------------------
   Dino-Bilder (assets/dino_*.webp): Seltenheit = Farbvariante.

const DINO_HUE = { trex: 105, triceratops: 205, stegosaurus: 26, brachiosaurus: 178, velociraptor: 36, ankylosaurus: 48, parasaurolophus: 272, spinosaurus: 4, pteranodon: 8, dilophosaurus: 68 };

  hueOf(hex) {

  dims(sp, size) { const im = Assets.img['dino_' + sp], w = im.naturalWidth, h = im.naturalHeight, s = size / Math.sqrt(w * h); return [w * s, h * s]; },

const CAVE_CRYSTALS = [
  { x: 90, y: 500, r: 110, c: '#b45cff' }, { x: 270, y: 390, r: 70, c: '#c77dff' }, { x: 370, y: 650, r: 70, c: '#c77dff' },
  { x: 420, y: 770, r: 60, c: '#c77dff' }, { x: 70, y: 910, r: 140, c: '#b45cff' }, { x: 880, y: 260, r: 70, c: '#c77dff' },
  { x: 1030, y: 300, r: 90, c: '#b45cff' }, { x: 840, y: 630, r: 80, c: '#ff3b4f' }, { x: 990, y: 770, r: 80, c: '#c77dff' },
  { x: 1010, y: 930, r: 110, c: '#b45cff' }, { x: 940, y: 1390, r: 110, c: '#9a5cff' },
  { x: 330, y: 760, r: 120, c: '#ff3346' }, { x: 800, y: 760, r: 130, c: '#ff3346' }, { x: 620, y: 880, r: 120, c: '#ff3346' },
].map((c, i) => Object.assign({ a: c.c === '#ff3346' ? 0.22 : 0.4, f: 0.9 + (i % 4) * 0.35, p: i * 1.3 }, c));

const World = {
  t: 0, dayPhase: 0.12, night: 0,
  clouds: [], stars: [], flyers: [], butterflies: [], fireflies: [], drops: [], herd: [], shooting: [], grass: [], ferns: [],
  rain: 0, rainTarget: 0, rainEnd: 0, rainbow: 0, rainbowEnd: 0, eruption: 0, nextEventAt: 0, nextFlyerAt: 8, nextEruptAt: 200,
  lastEvent: '',
  embers: [], motes: [], cdrops: [], bossK: 0, lavaBoost: 0, quakeT: 0, dripUntil: 0, _emT: 0,

  /* Höhlen-Look aktiv, sobald das Höhlenbild geladen ist */
  cave() { return Assets.has('bg'); },

  init() {
    for (let i = 0; i < 34; i++) this.motes.push({ x: rand(300, 900), y: rand(260, 980), vx: rand(-6, 6), vy: rand(-14, -4), p: rand(0, TAU), s: rand(1.2, 2.8) });
    this.renderLayers();
    const r = mulberry32(42);
    for (let i = 0; i < 150; i++) this.stars.push({ x: r() * 1080, y: r() * (820 + LAND_DY), s: 1 + r() * 2.6, p: r() * TAU, sp: 0.8 + r() * 2.5 });
    for (let i = 0; i < 6; i++) this.clouds.push(this.makeCloud(r() * 1300 - 100, true));
    for (let i = 0; i < 46; i++) {
      const y = 1040 + LAND_DY + Math.pow(r(), 0.8) * (860 - LAND_DY);
      this.grass.push({ x: r() * 1080, y, h: 18 + (y - 1000) / 900 * 34 + r() * 10, n: 3 + Math.floor(r() * 3), p: r() * TAU, c: r() < 0.5 ? '#4f9f3f' : '#62b84a' });
    }
    this.grass.sort((a, b) => a.y - b.y);
    // Farne: [x, y, Größe, Anzahl Wedel] – wenige, sich nicht überlappende Büschel.
    // Jeder Wedel ist eine gebogene Mittelrippe mit gezackten Fiedern; beim Wiegen biegt sich
    // die Spitze stärker als der Ansatz (statt starrer, rotierender Stäbe).
    this.ferns = [
      [-30, 1940, 1.15, 7], [1110, 1940, 1.2, 7],
      [40, 1090 + LAND_DY, 0.6, 6], [1040, 1075 + LAND_DY, 0.62, 6],
      [-10, 1450 + LAND_DY / 2, 0.8, 6], [1090, 1480 + LAND_DY / 2, 0.82, 6],
    ].map(([x, y, s, n], fi) => {
      const fronds = [];
      for (let i = 0; i < n; i++) {
        const off = (i - (n - 1) / 2) / ((n - 1) / 2);          // -1 … 1 (links … rechts)
        fronds.push({ a: -Math.PI / 2 + off * 1.0 + (r() - 0.5) * 0.12, L: 270 * s * (0.78 + 0.22 * Math.cos(off * 1.2)) * (0.92 + r() * 0.16),
          droop: 0.1 + Math.abs(off) * 0.16, p: r() * TAU, col: i % 2 ? '#5cbc4e' : '#4aa645', order: Math.abs(off) });
      }
      fronds.sort((a, b) => b.order - a.order);                  // äußere Wedel zuerst (hinten)
      return { x, y, s, fronds, p: fi * 1.7 };
    });
    this.nextEventAt = rand(CONFIG.miniEvents.minSec, CONFIG.miniEvents.maxSec);
  },

  makeCloud(x, init) {
    const c = document.createElement('canvas'); const w = randInt(220, 340), h = Math.round(w * 0.45), pad = 10;
    c.width = w + pad * 2; c.height = h + pad * 2; const g = c.getContext('2d'); g.translate(pad, pad);
    const r = Math.random;
    const puffs = []; for (let i = 0; i < 6; i++) puffs.push([w * (0.18 + i * 0.13) + (r() - 0.5) * 12, h * (0.55 + (r() - 0.5) * 0.25), h * (0.26 + r() * 0.16)]);
    const shape = (dy, k) => { g.beginPath(); for (const [px, py, pr] of puffs) { g.moveTo(px + pr * k, py + dy); g.arc(px, py + dy, pr * k, 0, TAU); } g.rect(w * 0.15, h * 0.6 + dy, w * 0.7, h * 0.22); };
    shape(4, 1); g.lineWidth = 6; g.strokeStyle = 'rgba(59,38,23,0.28)'; g.stroke();     // Tusche-Kontur (weich)
    shape(4, 1); g.fillStyle = '#e2dbea'; g.fill();                                           // Schattenseite
    shape(0, 0.94); g.fillStyle = '#fffaf0'; g.fill();                                        // Lichtseite
    g.fillStyle = 'rgba(255,255,255,0.8)'; for (const [px, py, pr] of puffs.slice(1, 4)) { g.beginPath(); g.arc(px - pr * 0.3, py - pr * 0.35, pr * 0.28, 0, TAU); g.fill(); }
    return { img: c, x, y: rand(170, 640), sp: rand(5, 14), w, h, a: rand(0.75, 0.95) };
  },

  /* statische Ebenen einmal vorrendern (Berge, Vulkan, Hügel, Boden) */
  renderLayers() {
    const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; };
    const r = mulberry32(7);
    // Berge + Vulkan
    const [m, g] = mk(1080, 1080);
    const range = (yBase, amp, col, step) => {
      const pts = []; for (let x = -20; x <= 1100; x += step) pts.push([x, yBase - amp * (0.4 + r() * 0.6) * (x % (step * 2) === 0 ? 1 : 0.55)]);
      g.fillStyle = col; g.beginPath(); g.moveTo(0, 1080); for (const [x, y] of pts) g.lineTo(x, y); g.lineTo(1080, 1080); g.closePath(); g.fill();
      g.strokeStyle = 'rgba(59,38,23,0.22)'; g.lineWidth = 3; g.lineJoin = 'round'; g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.stroke();
      g.strokeStyle = 'rgba(59,38,23,0.1)'; g.lineWidth = 2;                                  // Schraffur auf den Schattenhängen
      for (let i = 1; i < pts.length; i++) { const [x0, y0] = pts[i - 1], [x1, y1] = pts[i]; if (y1 <= y0) continue; for (let k = 0.2; k < 0.9; k += 0.22) { const hx = lerp(x0, x1, k), hy = lerp(y0, y1, k); g.beginPath(); g.moveTo(hx, hy + 6); g.lineTo(hx + 8, hy + 34); g.stroke(); } }
    };
    range(900, 120, '#a9b9ee', 70);
    range(950, 90, '#8ea4e2', 55);
    // Vulkan (rechts hinten)
    const vx = 835, vy = 800;
    g.fillStyle = '#9a6276'; g.beginPath(); g.moveTo(600, 1010); g.quadraticCurveTo(760, 900, vx - 38, vy); g.lineTo(vx + 38, vy); g.quadraticCurveTo(910, 900, 1080, 1000); g.lineTo(1080, 1080); g.lineTo(600, 1080); g.closePath(); g.fill();
    g.fillStyle = '#7d4a5f'; g.beginPath(); g.moveTo(vx + 5, vy); g.lineTo(vx + 38, vy); g.quadraticCurveTo(910, 900, 1080, 1000); g.lineTo(1080, 1080); g.lineTo(900, 1080); g.quadraticCurveTo(880, 900, vx + 5, vy); g.closePath(); g.fill();
    g.strokeStyle = '#ff8a3d'; g.lineWidth = 7; g.lineCap = 'round';
    for (const [dx, len] of [[-18, 70], [6, 110], [22, 55]]) { g.beginPath(); g.moveTo(vx + dx, vy + 4); g.quadraticCurveTo(vx + dx * 2.2, vy + len * 0.5, vx + dx * 3, vy + len); g.stroke(); }
    g.strokeStyle = 'rgba(59,38,23,0.4)'; g.lineWidth = 4; g.beginPath(); g.moveTo(600, 1010); g.quadraticCurveTo(760, 900, vx - 38, vy); g.lineTo(vx + 38, vy); g.quadraticCurveTo(910, 900, 1080, 1000); g.stroke();
    g.fillStyle = '#5c3346'; g.beginPath(); g.ellipse(vx, vy + 2, 38, 9, 0, 0, TAU); g.fill();
    g.fillStyle = '#ff7a2f'; g.beginPath(); g.ellipse(vx, vy + 3, 28, 5, 0, 0, TAU); g.fill();
    // Hügel mit Palmfarnen
    const hill = (yb, col, n, amp) => {
      const pts = []; for (let i = 0; i <= n; i++) { const x = i * 1080 / n; pts.push([x, yb - Math.sin(i * 1.7 + yb) * amp - amp]); }
      g.fillStyle = col; g.beginPath(); g.moveTo(0, 1080); for (const [x, y] of pts) g.lineTo(x, y); g.lineTo(1080, 1080); g.closePath(); g.fill();
      g.strokeStyle = shade(col, -0.28); g.lineWidth = 4; g.lineJoin = 'round'; g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.stroke();
      g.lineWidth = 2.5; g.lineCap = 'round';
      for (let x = 10; x < 1080; x += 26 + r() * 30) { const i = Math.min(n - 1, Math.floor(x / (1080 / n))), k = (x - pts[i][0]) / (1080 / n), y = lerp(pts[i][1], pts[i + 1][1], k); g.beginPath(); g.moveTo(x, y + 2); g.lineTo(x - 3, y - 7); g.moveTo(x + 4, y + 2); g.lineTo(x + 6, y - 6); g.stroke(); }
    };
    hill(985, '#9edb78', 9, 18);
    const tree = (x, y, s) => {
      g.strokeStyle = '#7a5a3c'; g.lineWidth = 7 * s; g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + 6 * s, y - 40 * s, x + 2 * s, y - 80 * s); g.stroke();
      g.fillStyle = '#4f9a44';
      for (let i = 0; i < 6; i++) { const a = -Math.PI / 2 + (i - 2.5) * 0.5; g.beginPath(); g.ellipse(x + 2 * s + Math.cos(a) * 26 * s, y - 80 * s + Math.sin(a) * 14 * s + 8 * s, 30 * s, 8 * s, a, 0, TAU); g.fill(); }
    };
    for (const [x, y, s] of [[90, 975, 0.9], [170, 985, 0.7], [610, 990, 0.8], [700, 978, 1.0], [985, 990, 0.75]]) tree(x, y, s);
    hill(1012, '#86cf66', 7, 12);
    // nur den unteren Teil behalten (darüber ist alles transparent) → spart Füllrate
    const [landC, landG] = mk(1080, 1080 - 740); landG.drawImage(m, 0, 740, 1080, 340, 0, 0, 1080, 340);
    this.layerLand = landC;
    // Boden (Wiese) ab y=990
    const [gr, gg] = mk(1080, 940);
    const grad = gg.createLinearGradient(0, 0, 0, 940); grad.addColorStop(0, '#8fd468'); grad.addColorStop(0.35, '#79c457'); grad.addColorStop(1, '#4f9a3c');
    gg.fillStyle = grad; gg.fillRect(0, 0, 1080, 940);
    for (let i = 0; i < 26; i++) { gg.fillStyle = 'rgba(255,255,255,0.06)'; gg.beginPath(); gg.ellipse(r() * 1080, 60 + r() * 860, 60 + r() * 120, 14 + r() * 26, 0, 0, TAU); gg.fill(); }
    const flowerCols = ['#ffe14d', '#ff7fb0', '#ffffff', '#8fd3ff', '#ff9d5c'];
    for (let i = 0; i < 70; i++) {
      const x = r() * 1080, y = 120 + r() * 800, s = 3 + (y / 940) * 5;
      gg.fillStyle = flowerCols[i % flowerCols.length];
      for (let k = 0; k < 5; k++) { const a = k * TAU / 5; gg.beginPath(); gg.arc(x + Math.cos(a) * s, y + Math.sin(a) * s, s * 0.7, 0, TAU); gg.fill(); }
      gg.fillStyle = '#ffcf3a'; gg.beginPath(); gg.arc(x, y, s * 0.55, 0, TAU); gg.fill();
    }
    for (let i = 0; i < 9; i++) { const x = r() * 1080, y = 200 + r() * 700, s = 10 + r() * 16; gg.fillStyle = '#a9a3b8'; gg.beginPath(); gg.ellipse(x, y, s * 1.4, s, 0, 0, TAU); gg.fill(); gg.fillStyle = '#c9c4d6'; gg.beginPath(); gg.ellipse(x - s * 0.3, y - s * 0.3, s * 0.7, s * 0.45, 0, 0, TAU); gg.fill(); }
    this.layerGround = gr;
  },

  skyAt(p) {
    let i = 0; while (i < SKY_KEYS.length - 2 && p > SKY_KEYS[i + 1][0]) i++;
    const a = SKY_KEYS[i], b = SKY_KEYS[i + 1], k = clamp((p - a[0]) / (b[0] - a[0]), 0, 1);
    return { top: mixRgb(a[1], b[1], k), bot: mixRgb(a[2], b[2], k), night: lerp(a[3], b[3], k) };
  },

  update(dt) {
    this.t += dt;
    this.dayPhase = (this.dayPhase + dt / CONFIG.dayNight.cycleSec) % 1;
    this.night = this.skyAt(this.dayPhase).night;          // auch ohne Zeichnen aktuell (z. B. für Glühwürmchen)
    for (const c of this.clouds) { c.x += c.sp * dt * (1 + this.rain * 2); if (c.x > 1180) { Object.assign(c, this.makeCloud(-c.w - rand(0, 200))); } }
    const cave = this.cave();
    if (cave) this.updateCave(dt);
    // Vulkanrauch (immer) + gelegentliche Eruption
    this._smokeT = (this._smokeT || 0) - dt;
    if (this._smokeT <= 0 && !cave) {
      this._smokeT = this.eruption > 0 ? 0.08 : 0.45;
      FX.spawn({ type: 'blob', layer: 0, x: 835 + rand(-12, 12), y: 790 + LAND_DY, vx: rand(4, 16), vy: rand(-38, -24) * (this.eruption > 0 ? 2 : 1), size: rand(16, 26), grow: 9, life: rand(5, 7), alpha: this.eruption > 0 ? 0.75 : 0.5, color: this.eruption > 0 ? '#7b6f88' : '#c9c1d6', fadeIn: 0.6 });
    }
    if (this.eruption > 0) {
      this.eruption -= dt;
      if (!cave && Math.random() < dt * 22) FX.spawn({ type: 'spark', layer: 0, x: 835 + rand(-15, 15), y: 795 + LAND_DY, vx: rand(-120, 120), vy: rand(-380, -220), g: 420, size: rand(5, 9), life: rand(1.2, 1.8), color: pick(['#ff7a2f', '#ffb13d', '#ff4d2e']) });
    }
    if (this.t > this.nextEruptAt) { this.nextEruptAt = this.t + rand(150, 260); this.erupt(); }
    // Flugsaurier im Hintergrund
    if (this.t > this.nextFlyerAt) { this.nextFlyerAt = this.t + rand(10, 24); this.spawnFlyer(Math.random() < 0.3 ? 2 : 1); }
    for (const f of this.flyers) { f.x += f.vx * dt; f.y += Math.sin(this.t * 1.3 + f.p) * 8 * dt; }
    this.flyers = this.flyers.filter(f => f.x > -150 && f.x < 1230);
    // Schmetterlinge
    for (const b of this.butterflies) {
      b.t += dt; b.life -= dt;
      b.vx += (Math.random() - 0.5) * 300 * dt; b.vy += (Math.random() - 0.5) * 300 * dt;
      b.vx = clamp(b.vx, -90, 90); b.vy = clamp(b.vy, -70, 70);
      if (b.life < 3) b.vy -= 120 * dt;
      b.x += b.vx * dt; b.y += b.vy * dt;
      if (b.x < 30) b.vx += 200 * dt; if (b.x > 1050) b.vx -= 200 * dt; if (b.y > 1500) b.vy -= 200 * dt; if (b.y < 600 && b.life > 3) b.vy += 200 * dt;
    }
    this.butterflies = this.butterflies.filter(b => b.life > 0 && b.y > -50);
    // Glühwürmchen (nachts)
    for (const g of this.fireflies) { g.t += dt; g.life -= dt; g.vx += (Math.random() - 0.5) * 120 * dt; g.vy += (Math.random() - 0.5) * 120 * dt; g.vx = clamp(g.vx, -40, 40); g.vy = clamp(g.vy, -30, 30); g.x += g.vx * dt; g.y += g.vy * dt; }
    this.fireflies = this.fireflies.filter(g => g.life > 0);
    // Regen
    if (this.rainTarget && this.t > this.rainEnd) { this.rainTarget = 0; this.rainbowEnd = this.t + 24; }
    this.rain = lerp(this.rain, this.rainTarget, dt * 0.8);
    this.rainbow = lerp(this.rainbow, this.t < this.rainbowEnd && this.rain < 0.3 ? 1 : 0, dt * 0.6);
    if (this.rain > 0.05) {
      const n = Math.floor(this.rain * 260 * dt + Math.random());
      for (let i = 0; i < n && this.drops.length < 260; i++) this.drops.push({ x: rand(-100, 1080), y: rand(-60, 300), vx: 140, vy: rand(1300, 1600), floor: rand(1000, 1900) });
    }
    for (const d of this.drops) { d.x += d.vx * dt; d.y += d.vy * dt; if (d.y > d.floor) { d.dead = true; if (Math.random() < 0.3) FX.spawn({ type: 'ring', layer: 1, x: d.x, y: d.floor, size: 4, grow: 40, life: 0.35, color: 'rgba(220,240,255,0.8)', squash: 0.35 }); } }
    this.drops = this.drops.filter(d => !d.dead);
    // Sternschnuppen
    for (const s of this.shooting) { s.t += dt; s.x += s.vx * dt; s.y += s.vy * dt; }
    this.shooting = this.shooting.filter(s => s.t < s.life);
    // Herde
    for (const h of this.herd) h.update(dt);
    if (this.herd.some(h => h.dead)) { for (const h of this.herd) if (h.dead) SpriteCache.drop(`h|${h.id}|`); this.herd = this.herd.filter(h => !h.dead); }
    // Zufalls-Mini-Ereignisse alle 1–2 Minuten
    if (this.t > this.nextEventAt) { this.nextEventAt = this.t + rand(CONFIG.miniEvents.minSec, CONFIG.miniEvents.maxSec); this.randomEvent(); }
  },

  /* --- Höhle: Glut, Staub, Tropfen, Beben, Boss-Überblendung --- */
  updateCave(dt) {
    const boss = Game.mode === 'boss' && Game.phase !== 'impact';
    this.bossK = clamp(this.bossK + (boss ? dt : -dt) / 1.6, 0, 1);
    this.lavaBoost = Math.max(0, this.lavaBoost - dt);
    this._emT += dt * (8 + (this.lavaBoost > 0 ? 45 : 0) + (Hype.active > 0 ? 10 : 0));
    while (this._emT >= 1) { this._emT -= 1; if (this.embers.length < 130) this.embers.push(this.makeEmber()); }
    for (const e of this.embers) { e.t += dt; e.x += (e.vx + Math.sin(e.t * e.f + e.p) * 16) * dt; e.y += e.vy * dt; }
    if (this.embers.length && this.embers[0].t > this.embers[0].life) this.embers = this.embers.filter(e => e.t < e.life);
    for (const m of this.motes) {
      m.x += (m.vx + Math.sin(this.t * 0.3 + m.p) * 5) * dt; m.y += m.vy * dt;
      if (m.y < 250) { m.y = 990; m.x = rand(300, 900); }
    }
    if (this.dripUntil > this.t && Math.random() < dt * 4) this.cdrops.push({ x: rand(150, 930), y: rand(140, 300), vy: rand(0, 60), floor: rand(1030, 1110) });
    for (const d of this.cdrops) {
      d.vy += 1500 * dt; d.y += d.vy * dt;
      if (d.y >= d.floor) {
        d.dead = true;
        FX.spawn({ type: 'ring', layer: 1, x: d.x, y: d.floor, size: 4, grow: 46, life: 0.4, color: 'rgba(190,225,255,0.85)', squash: 0.32 });
        for (let i = 0; i < 3; i++) FX.spawn({ type: 'spark', layer: 1, x: d.x, y: d.floor - 2, vx: rand(-90, 90), vy: rand(-220, -120), g: 900, size: rand(2, 4), life: 0.45, color: '#cfe8ff' });
      }
    }
    if (this.cdrops.length) this.cdrops = this.cdrops.filter(d => !d.dead);
    if (this.quakeT > 0) {
      this.quakeT -= dt;
      Game.shake = Math.max(Game.shake, 0.32 * clamp(this.quakeT, 0, 1));
      if (Math.random() < dt * 14) FX.spawn({ type: 'rock', layer: 1, x: rand(120, 960), y: rand(120, 260), vx: rand(-40, 40), vy: rand(0, 80), g: 1400, size: rand(5, 11), rot: rand(0, TAU), vr: rand(-6, 6), life: 1.6, color: '#5b4a46', floor: rand(1030, 1110) });
      if (Math.random() < dt * 8) FX.spawn({ type: 'blob', layer: 1, x: rand(120, 960), y: rand(150, 300), vx: rand(-10, 10), vy: rand(20, 60), size: rand(18, 30), grow: 20, life: 2.4, color: '#7a6a62', alpha: 0.35 });
    }
  },
  makeEmber() {
    const boss = this.bossK > 0.5, r = Math.random(), left = Math.random() < 0.5;
    let x, y;
    if (!boss && r < 0.62) { x = left ? rand(0, 190) : rand(850, 1080); y = rand(1470, 1540); }        // Lavabecken
    else if (!boss && r < 0.8) { x = left ? rand(10, 90) : rand(1000, 1075); y = rand(820, 1010); }   // Lava an den Wänden
    else { x = rand(80, 1000); y = rand(1120, 1680); }
    const col = boss ? (Math.random() < 0.7 ? '#c77dff' : '#ff4d5e') : (Math.random() < 0.72 ? '#ff8a2a' : '#ffc94a');
    return { x, y, vx: rand(-14, 14), vy: rand(-115, -45), t: 0, life: rand(3.2, 6.5), f: rand(1, 2.6), p: rand(0, TAU), s: rand(0.55, 1.25), c: col };
  },

  /* --- Mini-Ereignisse --- */
  randomEvent(forced) {
    const cave = this.cave();
    const all = cave ? ['drips', 'quake', 'stumble', 'butterflies', 'eruption', 'flyby', 'parade', 'fireflies'] : ['rain', 'shooting', 'stumble', 'butterflies', 'eruption', 'flyby', 'parade', 'fireflies'];
    const opts = all.filter(o => o !== this.lastEvent && (o !== 'parade' || this.herd.length >= 3));
    let ev = forced || pick(opts);
    ev = cave ? ({ rain: 'drips', shooting: 'quake' }[ev] || ev) : ({ drips: 'rain', quake: 'shooting' }[ev] || ev);
    this.lastEvent = ev;
    switch (ev) {
      case 'drips': this.dripUntil = this.t + 16; break;
      case 'quake':
        this.quakeT = 2.6; Sound.rumble(2.2, 0.2);
        for (const h of this.herd) h.jump(rand(0, 0.4));
        for (const h of Game.helpers) if (h.hop <= 0) h.vh = rand(200, 320);
        break;
      case 'rain': this.rainTarget = 1; this.rainEnd = this.t + 18; break;
      case 'shooting': for (let i = 0; i < 3; i++) this.shooting.push({ x: rand(-50, 400), y: rand(160, 420), vx: rand(700, 900), vy: rand(160, 260), t: -i * 0.6, life: 1.6 + i * 0.6 }); break;
      case 'stumble': { const c = this.herd.filter(h => h.state !== 'stumble' && !h.joining && !h.leaving && h.species !== 'pteranodon'); if (c.length) { const h = pick(c); if (h.stumble()) for (let i = 0; i < 10; i++) FX.spawn({ type: 'blob', layer: 1, x: h.x + rand(-40, 40), y: h.y - 5, vx: rand(-60, 60), vy: rand(-40, -10), size: rand(10, 18), grow: 20, life: 1, color: '#c9b08a', alpha: 0.7 }); } else this.randomEvent('butterflies'); break; }
      case 'butterflies': for (let i = 0; i < 7; i++) this.butterflies.push({ x: rand(100, 900), y: cave ? rand(900, 1250) : rand(1300, 1700), vx: rand(-40, 40), vy: rand(-60, -20), t: rand(0, 5), life: rand(20, 28), c: pick(['#ff7fb0', '#ffe14d', '#8fd3ff', '#b98bff', '#ff9d5c']) }); break;
      case 'eruption': this.erupt(); break;
      case 'flyby': this.spawnFlyer(rand(0, 1) < 0.5 ? 4 : 7); break;
      case 'parade': {                                       // Herden-Parade: alle rennen quer über die Wiese
        const dir = Math.random() < 0.5 ? 1 : -1;
        this.herd.filter(h => !h.joining && !h.leaving && h.state !== 'stumble').forEach((h, i) => { h.parade = true; h.speed = rand(130, 170); h.state = 'walk'; h.tx = dir > 0 ? HERD_BAND.x1 - rand(0, 80) : HERD_BAND.x0 + rand(0, 80); h.ty = clamp(h.y + rand(-40, 40), HERD_BAND.y0, HERD_BAND.y1); h.jump(i * 0.12); });
        break;
      }
      case 'fireflies':                                      // nachts Glühwürmchen, tagsüber Schmetterlinge
        if (!cave && this.night < 0.4) return this.randomEvent('butterflies');
        for (let i = 0; i < 26; i++) this.fireflies.push({ x: rand(60, 1020), y: cave ? rand(640, 1300) : rand(1150, 1750), vx: rand(-20, 20), vy: rand(-15, 15), t: rand(0, 6), life: rand(20, 28), p: rand(0, TAU) });
        break;
    }
    return ev;
  },
  erupt() {
    this.eruption = 4.5; Sound.rumble(2.2, 0.16);
    if (this.cave()) {                                     // Höhle: die Lava kocht hoch, Glut spritzt
      this.lavaBoost = 5;
      for (let i = 0; i < 26; i++) { const L = pick(CAVE_LAVA.slice(2)); FX.spawn({ type: 'spark', layer: 1, x: L.x + rand(-60, 60), y: L.y - 10, vx: rand(-160, 160), vy: rand(-520, -260), g: 700, size: rand(4, 8), life: rand(1, 1.6), color: pick(['#ff7a2f', '#ffb13d', '#ff4d2e']) }); }
    }
  },
  spawnFlyer(n) {
    const dir = Math.random() < 0.5 ? 1 : -1, y = this.cave() ? rand(620, 760) : rand(380, 620);
    for (let i = 0; i < n; i++) this.flyers.push({ x: dir > 0 ? -80 - i * 70 : 1160 + i * 70, y: y + (i % 2) * 40 + i * 12, vx: dir * rand(80, 110), p: rand(0, TAU), s: rand(0.7, 1.1) });
  },

  /* --- Zeichnen: Höhle --- */
  _shaft: null,
  shaftSprite() {
    if (this._shaft) return this._shaft;
    const c = SpriteCache.canvas(220, 900), g = c.getContext('2d');
    const gr = g.createLinearGradient(0, 0, 0, 900); gr.addColorStop(0, 'rgba(255,226,180,0.9)'); gr.addColorStop(0.55, 'rgba(255,200,150,0.35)'); gr.addColorStop(1, 'rgba(255,190,140,0)');
    g.fillStyle = gr; g.beginPath(); g.moveTo(80, 0); g.lineTo(140, 0); g.lineTo(220, 900); g.lineTo(0, 900); g.closePath(); g.fill();
    const side = g.createLinearGradient(0, 0, 220, 0); side.addColorStop(0, 'rgba(0,0,0,1)'); side.addColorStop(0.35, 'rgba(0,0,0,0)'); side.addColorStop(0.65, 'rgba(0,0,0,0)'); side.addColorStop(1, 'rgba(0,0,0,1)');
    g.globalCompositeOperation = 'destination-out'; g.fillStyle = side; g.fillRect(0, 0, 220, 900);
    return (this._shaft = c);
  },
  drawCave(ctx, t) {
    const k = this.bossK, bgB = Assets.get('bgBoss');
    if (k < 1 || !bgB) ctx.drawImage(Assets.img.bg, 0, 0);
    if (k > 0 && bgB) { ctx.globalAlpha = k; ctx.drawImage(bgB, 0, 0); ctx.globalAlpha = 1; }
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    // Lichtkegel aus der Öffnung in der Höhlendecke (wandern & atmen langsam)
    const sh = this.shaftSprite();
    [[560, -0.16, 0], [700, 0.05, 2.1], [830, 0.2, 4.2]].forEach(([bx, ang, p]) => {
      const a = (0.06 + 0.04 * Math.sin(t * 0.35 + p)) * (1 - k); if (a < 0.005) return;
      ctx.globalAlpha = a; ctx.save(); ctx.translate(bx + Math.sin(t * 0.12 + p) * 30, 220); ctx.rotate(ang + Math.sin(t * 0.1 + p) * 0.03); ctx.drawImage(sh, -110, 0); ctx.restore();
    });
    // Lava pulsiert (beim Ausbruch deutlich heller)
    const boost = 1 + clamp(this.lavaBoost, 0, 1) * 1.3;
    const lava = softBlob('#ff6a1a');
    for (const L of CAVE_LAVA) {
      const a = L.a * (0.72 + 0.28 * Math.sin(t * L.f + L.p)) * boost * (1 - k); if (a < 0.01) continue;
      const r = L.r * (1 + 0.07 * Math.sin(t * L.f * 0.7 + L.p)); ctx.globalAlpha = Math.min(1, a);
      ctx.drawImage(lava, L.x - r, L.y - r * 0.62, r * 2, r * 1.24);
    }
    // Boss-Höhle: Kristalle & rote Risse leuchten
    if (k > 0.01) for (const C of CAVE_CRYSTALS) {
      const a = C.a * (0.55 + 0.45 * Math.sin(t * C.f + C.p)) * k; ctx.globalAlpha = a;
      ctx.drawImage(softBlob(C.c), C.x - C.r, C.y - C.r, C.r * 2, C.r * 2);
    }
    ctx.restore();
  },
  /* Flugsaurier ziehen als dunkle Silhouetten durch die Höhle (Flügelschlag = Stauchen) */
  drawFlyers(ctx) {
    if (!this.flyers.length) return;
    if (!DinoArt.has('pteranodon')) { for (const f of this.flyers) this._flyer(ctx, f); return; }
    if (!this._flySil) {
      const src = DinoArt.sprite('pteranodon', 'common', 0, 110), c = SpriteCache.canvas(src.width, src.height), g = c.getContext('2d');
      g.drawImage(src, 0, 0); g.globalCompositeOperation = 'source-atop'; g.fillStyle = 'rgba(28,16,14,0.82)'; g.fillRect(0, 0, c.width, c.height);
      this._flySil = c;
    }
    const im = this._flySil;
    for (const f of this.flyers) {
      const flap = 0.72 + 0.28 * Math.sin(this.t * 7 + f.p);
      ctx.save(); ctx.translate(f.x, f.y); ctx.scale((f.vx > 0 ? 1 : -1) * f.s * 0.8, f.s * 0.8 * flap);
      ctx.drawImage(im, -im.width / 2, -im.height / 2); ctx.restore();
    }
  },
  drawCaveFront(ctx) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (const m of this.motes) { ctx.globalAlpha = (0.25 + 0.25 * Math.sin(this.t * 1.3 + m.p)) * (1 - this.bossK * 0.6); ctx.fillStyle = '#ffe9c8'; ctx.fillRect(m.x, m.y, m.s, m.s); }
    for (const e of this.embers) {
      const a = clamp(e.t / 0.4, 0, 1) * clamp((e.life - e.t) / 1.2, 0, 1) * (0.6 + 0.4 * Math.sin(e.t * 9 + e.p));
      if (a <= 0.02) continue;
      const s = 15 * e.s; ctx.globalAlpha = a * 0.7; ctx.drawImage(softBlob(e.c), e.x - s, e.y - s, s * 2, s * 2);
      ctx.globalAlpha = a; ctx.fillStyle = '#fff1c2'; ctx.fillRect(e.x - 1.5 * e.s, e.y - 1.5 * e.s, 3 * e.s, 3 * e.s);
    }
    ctx.restore();
    if (this.cdrops.length) {
      ctx.strokeStyle = 'rgba(200,230,255,0.75)'; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.beginPath();
      for (const d of this.cdrops) { ctx.moveTo(d.x, d.y); ctx.lineTo(d.x, d.y - Math.min(30, d.vy * 0.03)); }
      ctx.stroke();
    }
  },

  /* --- Zeichnen: Wiese (Ersatz, falls die Bilder fehlen) --- */
  drawSky(ctx) {
    const sky = this.skyAt(this.dayPhase); this.night = sky.night;
    const grd = ctx.createLinearGradient(0, 0, 0, 1050 + LAND_DY);
    grd.addColorStop(0, rgbStr(sky.top)); grd.addColorStop(1, rgbStr(sky.bot));
    ctx.fillStyle = grd; ctx.fillRect(0, 0, 1080, 1060 + LAND_DY);
    if (this.night > 0.05) {
      ctx.fillStyle = '#ffffff';
      for (const s of this.stars) { ctx.globalAlpha = this.night * (0.55 + 0.45 * Math.sin(this.t * s.sp + s.p)) * (1 - this.rain * 0.8); ctx.fillRect(s.x, s.y, s.s, s.s); }
      ctx.globalAlpha = 1;
    }
    // Sonne / Mond
    const p = this.dayPhase;
    if (p < 0.58) { const q = p / 0.58; this._body(ctx, lerp(40, 1040, q), 960 - Math.sin(q * Math.PI) * 650, '#fff4a8', '#ffd84a', 58, false); }
    else { const q = (p - 0.58) / 0.42; this._body(ctx, lerp(40, 1040, q), 960 - Math.sin(q * Math.PI) * 620, '#f4f1ff', '#d6d0f5', 44, true); }
    for (const s of this.shooting) {
      if (s.t < 0) continue;
      const a = Math.sin(clamp(s.t / s.life, 0, 1) * Math.PI);
      const g = ctx.createLinearGradient(s.x, s.y, s.x - s.vx * 0.18, s.y - s.vy * 0.18);
      g.addColorStop(0, `rgba(255,255,255,${a})`); g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.strokeStyle = g; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x - s.vx * 0.18, s.y - s.vy * 0.18); ctx.stroke();
    }
    for (const c of this.clouds) { ctx.globalAlpha = c.a * (1 - this.night * 0.45); ctx.drawImage(c.img, c.x, c.y); }
    ctx.globalAlpha = 1;
    if (this.rain > 0.02) { ctx.fillStyle = `rgba(70,80,110,${this.rain * 0.35})`; ctx.fillRect(0, 0, 1080, 1060 + LAND_DY); }
  },
  _body(ctx, x, y, c1, c2, r, moon) {
    const glow = softBlob(moon ? '#c9c4ff' : '#ffe98a');
    ctx.globalAlpha = 0.55; ctx.drawImage(glow, x - r * 2.6, y - r * 2.6, r * 5.2, r * 5.2); ctx.globalAlpha = 1;
    ctx.fillStyle = c2; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
    ctx.fillStyle = c1; ctx.beginPath(); ctx.arc(x - r * 0.12, y - r * 0.12, r * 0.82, 0, TAU); ctx.fill();
    if (moon) { ctx.fillStyle = 'rgba(160,150,210,0.5)'; for (const [dx, dy, rr2] of [[-12, -8, 8], [10, 10, 6], [14, -14, 4]]) { ctx.beginPath(); ctx.arc(x + dx, y + dy, rr2, 0, TAU); ctx.fill(); } }
  },
  drawLand(ctx) {
    for (const f of this.flyers) this._flyer(ctx, f);
    FX.draw(ctx, 0);                                     // Rauch & Lava hinter den Bergen? – vor den Bergen wirkt lebendiger
    ctx.drawImage(this.layerLand, 0, 740 + LAND_DY);
    // Vulkan-Glühen
    const gl = 0.35 + Math.sin(this.t * 2) * 0.08 + (this.eruption > 0 ? 0.6 : 0);
    ctx.globalAlpha = clamp(gl, 0, 1); ctx.globalCompositeOperation = 'lighter';
    ctx.drawImage(softBlob('#ff7a2f'), 835 - 70, 750 + LAND_DY, 140, 100);
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    if (this.rainbow > 0.02) this._rainbow(ctx);
    ctx.drawImage(this.layerGround, 0, 990 + LAND_DY);
  },
  _rainbow(ctx) {
    const cols = ['#ff5a5a', '#ff9d3d', '#ffe14d', '#6ee06e', '#4aa6ff', '#9b6bff'];
    ctx.save(); ctx.globalAlpha = this.rainbow * 0.5; ctx.lineWidth = 18;
    cols.forEach((c, i) => { ctx.strokeStyle = c; ctx.beginPath(); ctx.arc(480, 1060 + LAND_DY, 560 - i * 18, Math.PI * 1.05, Math.PI * 1.95); ctx.stroke(); });
    ctx.restore();
  },
  _flyer(ctx, f) {
    const flap = Math.sin(this.t * 6 + f.p);
    ctx.save(); ctx.translate(f.x, f.y); ctx.scale((f.vx > 0 ? 1 : -1) * f.s, f.s);
    ctx.fillStyle = this.night > 0.5 ? '#2a2650' : '#5a4a78';
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(-20, -30 * flap, -55, -24 * flap - 4); ctx.lineTo(-10, 6); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(4, 0); ctx.quadraticCurveTo(-14, -22 * flap, -38, -18 * flap + 2); ctx.lineTo(-6, 6); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0, 2, 16, 6, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.moveTo(10, -2); ctx.lineTo(34, 2); ctx.lineTo(10, 4); ctx.fill();
    ctx.beginPath(); ctx.moveTo(8, -2); ctx.lineTo(-6, -12); ctx.lineTo(4, 2); ctx.fill();
    ctx.restore();
  },
  drawHerd(ctx) {
    const list = this.herd.slice().sort((a, b) => a.y - b.y);
    for (const h of list) h.draw(ctx);
  },
  drawGrassAndFerns(ctx) {
    const wind = 1 + this.rain * 1.5;
    ctx.lineCap = 'round';
    for (const g of this.grass) {
      ctx.strokeStyle = g.c; ctx.lineWidth = 3 + (g.y - 1000) / 300;
      for (let i = 0; i < g.n; i++) {
        const bx = g.x + (i - g.n / 2) * 5, sway = Math.sin(this.t * 1.6 * wind + g.p + i * 0.5) * 6 * wind;
        ctx.beginPath(); ctx.moveTo(bx, g.y); ctx.quadraticCurveTo(bx + sway * 0.4, g.y - g.h * 0.6, bx + sway + (i - g.n / 2) * 3, g.y - g.h); ctx.stroke();
      }
    }
    for (const f of this.ferns) {
      for (const fr of f.fronds) {
        const sway = (Math.sin(this.t * 1.15 * wind + f.p + fr.p) * 0.05 + Math.sin(this.t * 0.37 + f.p) * 0.025) * wind;
        this._frond(ctx, f.x, f.y, fr, sway, f.s);
      }
    }
  },
  /* Ein Farnwedel: gebogene Mittelrippe (quadratische Kurve) + gezackte Fiedern als EINE Fläche */
  _frond(ctx, bx, by, fr, sway, s) {
    const L = fr.L, a = fr.a + sway * 0.5;
    const dx = Math.cos(a), dy = Math.sin(a);
    const droop = fr.droop + Math.sin(this.t * 0.9 + fr.p) * 0.02;
    const ex = bx + dx * L + sway * L * 0.35, ey = by + dy * L + droop * L;      // Spitze hängt & wiegt stärker
    const cx = bx + dx * L * 0.55, cy = by + dy * L * 0.55;
    const K = 12, plus = [], minus = [];
    for (let k = 0; k <= K; k++) {
      const t = 0.07 + 0.87 * k / K, u = 1 - t;
      const px = u * u * bx + 2 * u * t * cx + t * t * ex, py = u * u * by + 2 * u * t * cy + t * t * ey;
      let tx = 2 * u * (cx - bx) + 2 * t * (ex - cx), ty = 2 * u * (cy - by) + 2 * t * (ey - cy);
      const tl = Math.hypot(tx, ty) || 1; tx /= tl; ty /= tl;
      const nx = -ty, ny = tx;
      const pl = L * 0.16 * (1 - t * 0.78) * Math.min(1, t / 0.16);            // Fiederlänge: zur Spitze kürzer
      for (const [arr, sg] of [[plus, 1], [minus, -1]]) {
        arr.push([px + sg * nx * pl * 0.12, py + sg * ny * pl * 0.12,                                   // Kerbe an der Rippe
                  px + sg * nx * pl * 0.75 - tx * pl * 0.2, py + sg * ny * pl * 0.75 - ty * pl * 0.2,       // Kontrollpunkt (runder Rücken)
                  px + sg * nx * pl * 0.8 + tx * pl * 0.6, py + sg * ny * pl * 0.8 + ty * pl * 0.6]);      // Fiederspitze (nach vorn)
      }
    }
    ctx.beginPath(); ctx.moveTo(bx, by);
    for (const q of plus) { ctx.lineTo(q[0], q[1]); ctx.quadraticCurveTo(q[2], q[3], q[4], q[5]); }
    ctx.lineTo(ex, ey);
    for (let k = minus.length - 1; k >= 0; k--) { const q = minus[k]; ctx.lineTo(q[4], q[5]); ctx.quadraticCurveTo(q[2], q[3], q[0], q[1]); }
    ctx.closePath();
    ctx.fillStyle = fr.col; ctx.fill();
    ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(1.5, 3 * s); ctx.strokeStyle = '#2f7a30'; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(bx, by); ctx.quadraticCurveTo(cx, cy, ex, ey);
    ctx.lineWidth = Math.max(2, 4.5 * s); ctx.strokeStyle = '#2f7a30'; ctx.stroke();
  },
  drawNightTint(ctx) {
    if (this.night > 0.02) { ctx.fillStyle = `rgba(28,22,90,${this.night * 0.36})`; ctx.fillRect(0, 0, 1080, 1920); }
  },
  drawFront(ctx) {
    // Glühwürmchen: weich leuchtende Punkte, flackern
    if (this.fireflies.length) {
      ctx.globalCompositeOperation = 'lighter';
      const img = softBlob('#d8ff6a');
      for (const g of this.fireflies) {
        const a = clamp(0.35 + 0.65 * Math.max(0, Math.sin(g.t * 3 + g.p)), 0, 1) * clamp(g.life / 2, 0, 1);
        ctx.globalAlpha = a; ctx.drawImage(img, g.x - 22, g.y - 22, 44, 44);
        ctx.globalAlpha = Math.min(1, a * 1.4); ctx.fillStyle = '#fbffd0'; ctx.fillRect(g.x - 2.5, g.y - 2.5, 5, 5);
      }
      ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    }
    // Schmetterlinge & Regen ganz vorn (über dem Ei, unter der Schrift)
    for (const b of this.butterflies) {
      const f = Math.abs(Math.sin(b.t * 14));
      ctx.save(); ctx.translate(b.x, b.y); ctx.fillStyle = b.c; ctx.strokeStyle = OUTLINE; ctx.lineWidth = 2;
      for (const s of [-1, 1]) { ctx.beginPath(); ctx.ellipse(s * 9 * f, -4, 10 * f + 2, 8, s * 0.4, 0, TAU); ctx.fill(); ctx.stroke(); ctx.beginPath(); ctx.ellipse(s * 7 * f, 6, 7 * f + 1, 6, -s * 0.3, 0, TAU); ctx.fill(); ctx.stroke(); }
      ctx.fillStyle = OUTLINE; ctx.fillRect(-1.5, -8, 3, 18); ctx.restore();
    }
    if (this.drops.length) {
      ctx.strokeStyle = 'rgba(210,230,255,0.55)'; ctx.lineWidth = 3; ctx.beginPath();
      for (const d of this.drops) { ctx.moveTo(d.x, d.y); ctx.lineTo(d.x - d.vx * 0.025, d.y - d.vy * 0.025); }
      ctx.stroke();
    }
  },
  /* Meteor: wächst & wird heller, je näher der Countdown an 0 ist */
  drawMeteor(ctx, m) {
    if (!m || m.alpha <= 0.01) return;
    const im = Assets.get('meteor');
    if (im) {                                              // Bild: Gesteinskern unten links, Feuerschweif oben rechts
      const tx = m.tx != null ? m.tx : CONFIG.layout.eggX, flip = tx > m.x ? -1 : 1;   // fliegt nach rechts → spiegeln
      ctx.save();
      ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = m.alpha * (0.35 + m.heat * 0.65);
      const gs = m.r * (2.6 + m.heat * 1.8 + Math.sin(this.t * 12) * 0.2 * m.heat);
      ctx.drawImage(softBlob('#ff7a2f'), m.x - gs, m.y - gs, gs * 2, gs * 2);
      ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = m.alpha;
      const iw = m.r * 4.4, ih = iw * im.naturalHeight / im.naturalWidth;
      ctx.translate(m.x, m.y); ctx.scale(flip, 1); ctx.rotate(Math.sin(this.t * 3) * 0.03);
      ctx.drawImage(im, -iw * 0.3, -ih * 0.73, iw, ih);
      ctx.restore();
      return;
    }
    ctx.save(); ctx.globalAlpha = m.alpha;
    const dirx = 1, diry = -0.75, len = m.r * (3 + m.heat * 4);
    for (let i = 8; i >= 1; i--) {
      const k = i / 8, x = m.x + dirx * len * k, y = m.y + diry * len * k, s = m.r * (1.6 - k) * 1.3;
      ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = m.alpha * (1 - k) * (0.5 + m.heat * 0.5);
      ctx.drawImage(softBlob(i > 4 ? '#ff5a2f' : '#ffb13d'), x - s, y - s, s * 2, s * 2);
    }
    ctx.globalAlpha = m.alpha * (0.4 + m.heat * 0.6);
    const gs = m.r * (2.6 + m.heat * 1.6 + Math.sin(this.t * 12) * 0.15 * m.heat);
    ctx.drawImage(softBlob('#ff8a3d'), m.x - gs, m.y - gs, gs * 2, gs * 2);
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = m.alpha;
    ctx.fillStyle = '#6b4a5e'; ctx.strokeStyle = OUTLINE; ctx.lineWidth = Math.max(2, m.r * 0.12);
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#4e3346';
    for (const [dx, dy, rr2] of [[-0.3, -0.2, 0.22], [0.3, 0.25, 0.16], [0.05, 0.45, 0.12]]) { ctx.beginPath(); ctx.arc(m.x + dx * m.r, m.y + dy * m.r, rr2 * m.r, 0, TAU); ctx.fill(); }
    ctx.strokeStyle = `rgba(255,170,80,${0.4 + m.heat * 0.6})`; ctx.lineWidth = m.r * 0.18;
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r * 0.9, -2.4, 0.2); ctx.stroke();
    ctx.restore();
  },
};

/* ==========================================================================
   9. Users, Bestenlisten, Sammlungen, Persistenz
   ========================================================================== */
const Persist = {
  muted: {},                                  // id → Name (für das Panel)
  noPic: {},                                  // id → Name: Profilbild ausgeblendet (Name bleibt sichtbar)
  isMuted(id) { return Object.prototype.hasOwnProperty.call(this.muted, id); },
  isNoPic(id) { return Object.prototype.hasOwnProperty.call(this.noPic, id); },
};

const Users = {
  map: new Map(),
  _active: 0, _activeAt: -9,
  touch(ev) {
    const raw = (CONFIG.names.useNickname && ev.nick) ? ev.nick : (ev.name || ev.nick || String(ev.uid));
    let u = this.map.get(ev.uid);
    if (!u) {
      const c = NameFilter.clean(raw);
      const bot = String(ev.uid).startsWith('bot:');
      u = { id: ev.uid, raw, name: c.name, filtered: c.filtered, muted: Persist.isMuted(ev.uid), team: 0, lastActive: 0,
            lastHitAt: -1e9, greeted: bot, likeBuf: 0, helper: null, hue: hashStr(String(ev.uid)) % 360, interactions: 0, bot };
      this.map.set(ev.uid, u);
    } else if (raw !== u.raw) { const c = NameFilter.clean(raw); u.raw = raw; u.name = c.name; u.filtered = c.filtered; }
    if (ev.avatar) u.hasAvatar = true;          // Bridge kennt ein Profilbild → wird bei Bedarf geladen
    u.lastActive = gnow(); u.interactions++;
    return u;
  },
  label(u) { return !u || u.muted ? CONFIG.names.anonymous : u.name; },
  activeCount() {
    const tn = gnow();
    if (tn - this._activeAt > 1) {
      const lim = tn - CONFIG.hp.activeWindowSec; let n = 0;
      for (const u of this.map.values()) if (u.lastActive >= lim) n++;
      this._active = n; this._activeAt = tn;
    }
    return this._active;
  },
  refilter() { NameFilter.invalidate(); for (const u of this.map.values()) { const c = NameFilter.clean(u.raw); u.name = c.name; u.filtered = c.filtered; if (u.helper) u.helper.name = u.name; } },
  setMuted(id, m) {
    const u = this.map.get(id);
    if (m) Persist.muted[id] = u ? u.raw : String(id); else delete Persist.muted[id];
    if (u) { u.muted = m; if (m && u.helper) { u.helper.leave(); } }
    Game.boardDirty = true;
  },
  recent(n = 30) { return [...this.map.values()].sort((a, b) => b.lastActive - a.lastActive).slice(0, n); },
};

/* --------------------------------------------------------------------------
   Profilbilder: kommen über die Bridge (/avatar/<uid>, zwischengespeichert).
   Schutz: nur wenn eingeschaltet, nie bei stummen/gefilterten Nutzern oder
   bei "Bild aus" im Panel. Ohne Bild: farbiger Kreis mit Anfangsbuchstabe.
   Im Testmodus gibt es erzeugte Platzhalter-Gesichter (für den Layout-Test).
   -------------------------------------------------------------------------- */
const Avatars = {
  map: new Map(), fakes: new Map(),
  allowed(u) { return !!(CONFIG.avatars.enabled && u && !u.muted && !u.filtered && !Persist.isNoPic(u.id)); },
  base() {
    try { const w = new URL(Net.url()); return (w.protocol === 'wss:' ? 'https:' : 'http:') + '//' + w.host; } catch (e) { return null; }
  },
  /* liefert ein zeichenbares Bild oder null */
  get(u) {
    if (!this.allowed(u)) return null;
    if (u.hasAvatar && Net.state === 'connected') {
      let e = this.map.get(u.id);
      if (!e) e = this.load(u.id);
      return e && e.state === 'ok' ? e.img : null;
    }
    if (Net.testMode && String(u.id).startsWith('sim')) return this.fake(u);
    return null;
  },
  load(id) {
    const base = this.base(); if (!base) return null;
    if (this.map.size > 800) { let n = 0; for (const k of this.map.keys()) { this.map.delete(k); if (++n >= 200) break; } }
    const img = new Image(), e = { img, state: 'loading' };
    img.crossOrigin = 'anonymous';                 // Bridge sendet CORS-Header → Canvas bleibt sauber
    img.onload = () => { e.state = 'ok'; Game.boardDirty = true; };
    img.onerror = () => { e.state = 'fail'; };
    img.src = base + '/avatar/' + encodeURIComponent(id);
    this.map.set(id, e);
    return e;
  },
  /* Platzhalter-Gesicht für simulierte Zuschauer */
  fake(u) {
    let c = this.fakes.get(u.id); if (c) return c;
    c = document.createElement('canvas'); c.width = c.height = 96; const g = c.getContext('2d'), r = mulberry32(hashStr(String(u.id)));
    const hue = Math.floor(r() * 360), skin = pick(['#f6d2b4', '#e8b48f', '#c98e64', '#8d5a3c', '#ffe0c8']);
    g.fillStyle = hsl(hue, 70, 74); g.fillRect(0, 0, 96, 96);
    g.fillStyle = hsl(hue, 45, 42); g.beginPath(); g.arc(48, 106, 42, 0, TAU); g.fill();
    g.fillStyle = skin; g.beginPath(); g.arc(48, 46, 22, 0, TAU); g.fill();
    g.fillStyle = hsl((hue + 150) % 360, 50, 32); g.beginPath(); g.moveTo(25, 46); g.quadraticCurveTo(48, 6 + r() * 10, 71, 46); g.quadraticCurveTo(60, 30, 48, 30); g.quadraticCurveTo(36, 30, 25, 46); g.fill();
    g.fillStyle = OUTLINE; g.beginPath(); g.arc(40, 48, 3, 0, TAU); g.arc(56, 48, 3, 0, TAU); g.fill();
    g.strokeStyle = OUTLINE; g.lineWidth = 3; g.lineCap = 'round'; g.beginPath(); g.moveTo(40, 57); g.quadraticCurveTo(48, 63, 56, 57); g.stroke();
    this.fakes.set(u.id, c); return c;
  },
  /* runder Avatar; u kann null sein (→ "?") */
  draw(ctx, u, x, y, r, ring = OUTLINE) {
    const img = this.get(u);
    ctx.save();
    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU);
    if (img) {
      ctx.save(); ctx.clip(); ctx.drawImage(img, x - r, y - r, r * 2, r * 2); ctx.restore();
    } else {
      const ok = !!(u && !u.muted && !u.filtered);   // "Bild aus" → Buchstabe bleibt; stumm/gefiltert → "?"
      ctx.fillStyle = ok ? hsl(u.hue != null ? u.hue : hashStr(String(u.id)) % 360, 65, 58) : '#8a84a8'; ctx.fill();
      const letter = ok ? (Array.from(String(u.name || '').replace(/^[^\p{L}\p{N}]+/u, ''))[0] || '?').toUpperCase() : '?';
      drawText(ctx, letter, x, y + r * 0.06, { size: Math.round(r * 1.15), strokeWidth: Math.max(3, r * 0.18), drop: false });
    }
    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.lineWidth = Math.max(3, r * 0.14); ctx.strokeStyle = ring; ctx.stroke();
    ctx.restore();
    return !!img;
  },
};

/* Bestenlisten: heute & gesamt (persistiert), aktuelles Ei (aus Egg.contrib) */
const Board = {
  today: { date: todayStr(), map: {} },
  all: {},
  add(u, pts) {
    if (this.today.date !== todayStr()) this.today = { date: todayStr(), map: {} };
    const t = this.today.map[u.id] || (this.today.map[u.id] = { n: u.name, p: 0 }); t.n = u.name; t.p += pts;
    const a = this.all[u.id] || (this.all[u.id] = { n: u.name, p: 0, d: 0 }); a.n = u.name; a.p += pts;
    Game.boardDirty = true;
  },
  top(kind, n = 5) {
    let entries;
    if (kind === 'egg') {
      const m = new Map();
      for (const e of Game.eggs) for (const [id, c] of e.contrib) { const o = m.get(id) || { n: c.n, p: 0 }; o.p += c.d; m.set(id, o); }
      entries = [...m.entries()];
    } else entries = Object.entries(kind === 'today' ? this.today.map : this.all);
    return entries.filter(([id]) => !Persist.isMuted(id)).sort((a, b) => b[1].p - a[1].p).slice(0, n).map(([id, v]) => ({ id, name: v.n, pts: v.p }));
  },
  prune() {
    const ids = Object.keys(this.all);
    if (ids.length > 1000) { ids.sort((a, b) => this.all[b].p - this.all[a].p).slice(1000).forEach(id => delete this.all[id]); }
  },
};

/* Sammlung pro Nutzer + Lexikon + "Erste ihrer Art" */
const Coll = {
  users: {},        // id → {n, c: {"art|seltenheit": anzahl}, t: gesamt}
  lexikon: {},      // art → anzahl
  firsts: {},       // "art|seltenheit" → true
  record(u, species, rarity) {
    const out = { total: 0, newSpecies: false, firstCombo: false };
    if (!this.lexikon[species]) out.newSpecies = true;
    this.lexikon[species] = (this.lexikon[species] || 0) + 1;
    const combo = species + '|' + rarity;
    if (!this.firsts[combo]) { this.firsts[combo] = true; out.firstCombo = true; }
    if (u) {
      const c = this.users[u.id] || (this.users[u.id] = { n: u.name, c: {}, t: 0 });
      c.n = u.name; c.c[combo] = (c.c[combo] || 0) + 1; c.t++; out.total = c.t;
      const a = Board.all[u.id] || (Board.all[u.id] = { n: u.name, p: 0, d: 0 }); a.d = c.t;
    }
    const ids = Object.keys(this.users);
    if (ids.length > 2000) ids.sort((a, b) => this.users[a].t - this.users[b].t).slice(0, ids.length - 2000).forEach(id => delete this.users[id]);
    return out;
  },
  discovered() { return SPECIES.filter(s => this.lexikon[s.key]).length; },
};

/* ==========================================================================
   Egg – ein Ei im Spiel
   ========================================================================== */
const EGG_SIZES = { normal: [150, 195], boss: [185, 240], duel: [118, 152] };

class Egg {
  constructor(o) {
    this.mode = o.mode; this.team = o.team || 0; this.boss = o.mode === 'boss';
    const sz = EGG_SIZES[o.mode] || EGG_SIZES.normal;
    this.rx = sz[0]; this.ry = sz[1];
    this.x = o.x; this.groundY = CONFIG.layout.groundY;
    this.maxHp = o.maxHp; this.hp = o.hp != null ? o.hp : o.maxHp;
    this.seed = o.seed || randInt(1, 1e9);
    this.palIdx = o.palIdx != null ? o.palIdx : randInt(0, EGG_PALETTES.length - 1);
    this.pattern = o.pattern || pick(EGG_PATTERNS);
    const pal = EGG_PALETTES[this.palIdx % EGG_PALETTES.length];
    this.img = pal.img;
    this.color = this.boss ? '#57536a' : pal.base; this.color2 = this.boss ? '#b46bff' : pal.pat;
    this.retex();
    this.cracks = EggArt.genCracks(this.seed, this.rx, this.ry);
    this.stageAt = [-9, -9, -9, -9];
    this.stage = 0;
    this.contrib = new Map(o.contrib || []);   // id → {n, d}
    this.lastHitter = o.last || null;            // {id, n}
    this.a = 0; this.va = 0; this.h = 0; this.vh = 0; this.flash = 0; this.bigCrack = 0; this.squash = 0;
    this.phase = rand(0, TAU);
    this.state = 'drop'; this.dropT = 0; this.drop = 1400; this.burstT = 0; this.rollDir = 1; this.alpha = 1;
    // Stufen aus gespeichertem Fortschritt wiederherstellen (ohne Effekte)
    const st = Math.min(4, Math.floor(this.progress / 0.2 + 1e-9)); this.stage = st;
  }
  get progress() { return clamp(1 - this.hp / this.maxHp, 0, 1); }
  get cy() { return this.groundY - this.ry * 0.95; }
  /* Textur (neu) bauen – z. B. wenn das Ei-Bild erst nach dem Start fertig geladen ist */
  retex() {
    this.tex = EggArt.texture({ rx: this.rx, ry: this.ry, base: this.color, pat: this.color2, pattern: this.pattern, seed: this.seed, boss: this.boss, img: this.img });
    this._crK = null;
  }
  get wantsImg() { return !this.tex.isImg && Assets.has(this.boss ? 'egg_boss' : this.img); }
}

/* Helfer-Dino eines Zuschauers */
class Helper {
  constructor(u) {
    this.uid = u.id; this.name = u.name; this.hue = u.hue;
    this.fromLeft = Math.random() < 0.5;
    this.x = this.fromLeft ? -60 : 1140; this.y = CONFIG.layout.groundY - 30; this.tx = this.x; this.ty = this.y; this.scale = 1;
    this.state = 'walk'; this.t = rand(0, 10); this.walk = 1; this.face = this.fromLeft ? 1 : -1;
    this.peckT = 0; this.hop = 0; this.vh = 0; this.cheerT = 0; this.lastAct = gnow(); this.tagUntil = now() + CONFIG.helpers.tagSec + 2;
    this.slot = null; this.dead = false; this.blinkT = rand(1, 5); this.blink = 0; this.joinedAt = gnow();
    this.species = DINO_KEYS[hashStr(String(u.id)) % DINO_KEYS.length];   // jeder Zuschauer hat "seine" Art
    this.dh = 100;                                                         // zuletzt gezeichnete Höhe (für Namensschild/Krone)
  }
  setSlot(s) { this.slot = s; this.tx = s.x; this.ty = s.y; this.scale = s.scale; if (this.state !== 'leave') this.state = 'walk'; }
  leave() { this.state = 'leave'; this.tx = this.x < 540 ? -120 : 1200; this.slot = null; }
  peck() { this.peckT = 0.28; this.tagUntil = now() + CONFIG.helpers.tagSec; }
  update(dt, eggX) {
    this.t += dt;
    this.blinkT -= dt; if (this.blinkT < 0) { this.blink = 0.13; this.blinkT = rand(2, 5); } if (this.blink > 0) this.blink -= dt;
    if (this.peckT > 0) this.peckT = Math.max(0, this.peckT - dt);
    if (this.cheerT > 0) { this.cheerT -= dt; if (this.hop <= 0 && Math.random() < dt * 6) this.vh = rand(260, 380); }
    this.vh -= 1500 * dt; this.hop += this.vh * dt; if (this.hop <= 0) { this.hop = 0; this.vh = 0; }
    if (this.state === 'walk' || this.state === 'leave') {
      const dx = this.tx - this.x, dy = this.ty - this.y, d = Math.hypot(dx, dy);
      const sp = (this.state === 'leave' ? 260 : 240) * dt;
      if (d <= sp) { this.x = this.tx; this.y = this.ty; if (this.state === 'leave') this.dead = true; else this.state = 'idle'; }
      else { this.x += dx / d * sp; this.y += dy / d * sp; if (Math.abs(dx) > 1) this.face = dx > 0 ? 1 : -1; }
      this.walk = 1;
    } else {
      this.walk = 0;
      if (eggX != null) this.face = eggX > this.x ? 1 : -1;
      if (this.hop <= 0 && Math.random() < dt * 0.12) this.vh = rand(110, 190);   // kleine Freudensprünge, auch ohne Treffer
    }
  }
  draw(ctx) {
    const k = this.peckT > 0 ? Math.sin((1 - this.peckT / 0.28) * Math.PI) : 0;
    const x = this.x + this.face * k * 12;
    if (DinoArt.has(this.species)) {
      const size = 114 * this.scale, p = DinoArt.pose(this.species, this.t, this.walk, size);
      ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.beginPath(); ctx.ellipse(this.x, this.y + 2, size * 0.42 * (1 - Math.min(this.hop, 60) / 150), 8 * this.scale, 0, 0, TAU); ctx.fill();
      this.dh = DinoArt.draw(ctx, this.species, x, this.y - this.hop - p.bob, { size, face: this.face, rot: (p.rot + k * 0.32) * this.face, sx: p.sx, sy: p.sy }) + p.bob;
      if (Game.kings.has(this.uid) && this.state !== 'leave') Icon.draw(ctx, 'crown', x + this.face * 4, this.y - this.hop - this.dh - 14 + Math.sin(this.t * 4) * 3, 40);
      return;
    }
    ctx.fillStyle = 'rgba(30,50,20,0.25)'; ctx.beginPath(); ctx.ellipse(this.x, this.y + 2, 30 * this.scale, 7 * this.scale, 0, 0, TAU); ctx.fill();
    const kind = this.walk ? 'w' : this.blink > 0 ? 'b' : 'i';
    const i = this.walk ? Math.floor((((this.t * 12) / TAU) % 1) * 6) : kind === 'i' ? Math.floor((((this.t * 3) / TAU) % 1) * 4) : 0;
    const img = helperFrame(this.hue, kind, i);
    ctx.save(); ctx.translate(x, this.y - this.hop); ctx.scale(this.face * this.scale, this.scale); if (k) ctx.rotate(k * 0.55);
    ctx.drawImage(img, HELP_SPR.x0, HELP_SPR.y0, HELP_SPR.w, HELP_SPR.h);
    ctx.restore();
    if (Game.kings.has(this.uid) && this.state !== 'leave') {            // Krone für den Top-Knacker dieses Eis
      const cy = this.y - 88 * this.scale - this.hop + Math.sin(this.t * 4) * 3, cx = x + this.face * 6;
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(this.face * -0.12);
      ctx.beginPath(); ctx.moveTo(-20, 10); ctx.lineTo(-22, -10); ctx.lineTo(-10, 0); ctx.lineTo(0, -16); ctx.lineTo(10, 0); ctx.lineTo(22, -10); ctx.lineTo(20, 10); ctx.closePath();
      ctx.fillStyle = '#ffd23f'; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = OUTLINE; ctx.stroke();
      ctx.fillStyle = '#ff5f8a'; ctx.beginPath(); ctx.arc(0, 3, 4, 0, TAU); ctx.fill();
      ctx.restore();
    }
  }
  /* Namensschild – wird separat gezeichnet (max. 6 gleichzeitig, versetzt, damit nichts überlappt) */
  /* Platz, den das Schild bräuchte (wird vom HUD überlappungsfrei verteilt) */
  tagBox(ctx) {
    const king = Game.kings.has(this.uid);
    const a = king ? 1 : clamp((this.tagUntil - now()) / 0.6, 0, 1);
    const w = Math.min(330, measureText(ctx, this.name, 27) + 34 + (king ? 34 : 0)), h = 40;
    const y = this.y - this.hop - (this.dh || 100 * this.scale) - (king ? 54 : 26);
    return { h: this, king, a, w, hgt: h, x: clamp(this.x, 104 + w / 2, 936 - w / 2), y };
  }
  drawTag(ctx, box) {
    if (box.a <= 0.01) return;
    Glass.tag(ctx, this.name, box.x, box.y, { size: 27, alpha: box.a, icon: box.king ? 'crown' : null, color: box.king ? '#ffd35c' : '#f4ede4', border: box.king ? 'rgba(255,211,92,0.7)' : null, maxW: 330 });
  }
}

/* ==========================================================================
   10. Game – Spielablauf
   ========================================================================== */
const Game = {
  t: 0, phase: 'boot', phaseT: 0, mode: 'normal', eggs: [], duration: 240, timeLeft: 240,
  paused: false, override: null, normalsSince: 0, specialIdx: 0, eggNumber: 0, softer: 1,
  helpers: [], pops: [], popOverflow: 0, popOverflowAt: 0, toasts: [], toastQueue: [],
  announce: null, hatchInfo: null, impactInfo: null, meteor: null,
  shake: 0, flash: 0, flashColor: '#ffffff', activity: [], boardDirty: true,
  totals: { eggs: 0, hatches: 0, impacts: 0 }, lastLikeFlush: 0, lastRescale: 0, lastTick: -1,
  hatchTimes: [], greetBuf: [], greetAt: 0, lastSaveAt: 0, sessionUsers: new Set(),
  callouts: [], flyHearts: [], kings: new Set(), kingsAt: 0, recentEv: [], lastDamageAt: 0, urgentSaid: false,

  /* ---------- Rundensteuerung ---------- */
  pickNextMode() {
    if (this.override) { const m = this.override; this.override = null; if (m !== 'normal') this.normalsSince = 0; return m; }
    const R = CONFIG.rotation;
    if (this.normalsSince >= R.normalsBeforeSpecial) {
      const sp = []; if (R.bossEnabled) sp.push('boss'); if (R.duelEnabled) sp.push('duel');
      if (sp.length) { const m = sp[this.specialIdx % sp.length]; this.specialIdx++; this.normalsSince = 0; return m; }
    }
    this.normalsSince++;
    return 'normal';
  },
  peekNextMode() {
    if (this.override) return this.override;
    const R = CONFIG.rotation; const sp = []; if (R.bossEnabled) sp.push('boss'); if (R.duelEnabled) sp.push('duel');
    return this.normalsSince >= R.normalsBeforeSpecial && sp.length ? sp[this.specialIdx % sp.length] : 'normal';
  },
  eggXs(mode) { const x = CONFIG.layout.eggX; return mode === 'duel' ? [290, 710] : mode === 'boss' ? [x - 25] : [x]; },

  startRound(mode) {
    this.mode = mode; this.eggNumber++; this.totals.eggs++;
    const R = CONFIG.rotation;
    const dur = mode === 'boss' ? R.bossAnnounceSec : mode === 'duel' ? R.duelAnnounceSec : R.normalAnnounceSec;
    this.phase = 'intro'; this.phaseT = 0; this.introDur = dur;
    this.eggs = []; this.hatchInfo = null; this.impactInfo = null;
    this.announce = { mode, t: 0, dur };
    this.meteor = { x: 150, y: 660, r: 8, heat: 0, alpha: 0, state: 'sky', t: 0 };
    Sound.announce(mode); Sound.setUrgency(0);
    Hype.reset(); Missions.cancel(); Bubbles.cur = null; this.urgentSaid = false; this.kings = new Set();
    if (mode === 'duel') {
      for (const u of Users.map.values()) u.team = 0;
      for (const h of this.helpers) { const u = Users.map.get(h.uid); if (u) u.team = Math.random() < 0.5 ? 1 : 2; }
    }
    this.layoutHelpers();
    this.boardDirty = true;
    StatsLog.mark('round', { mode, egg: this.eggNumber });
  },
  computeMaxHp(mode, soft = this.softer) {
    const H = CONFIG.hp, act = Math.max(1, Users.activeCount());
    const eff = H.smallGroup > 0 ? act * act / (act + H.smallGroup) : act;
    let hp = H.base + H.perUser * Math.pow(eff, H.exponent);
    if (mode === 'boss') hp *= H.bossMult;
    if (mode === 'duel') hp *= H.duelMult;
    hp *= soft;                                   // < 1 direkt nach einem Meteor-Einschlag
    return clamp(Math.round(hp), H.min, H.max);
  },
  spawnEggs(restore) {
    const xs = this.eggXs(this.mode);
    this.duration = restore ? restore.duration : CONFIG.timer[this.mode] || CONFIG.timer.normal;
    this.timeLeft = restore ? restore.timeLeft : this.duration;
    const used = new Set(this.lastPals || []);          // neue Farbe: nicht wie das letzte Ei
    this.eggs = xs.map((x, i) => {
      const r = restore && restore.eggs[i];
      let palIdx = r ? r.palIdx : randInt(0, EGG_PALETTES.length - 1);
      while (!r && used.has(palIdx)) palIdx = (palIdx + 1) % EGG_PALETTES.length;
      used.add(palIdx);
      const e = new Egg({ mode: this.mode, team: this.mode === 'duel' ? i + 1 : 0, x, maxHp: r ? r.maxHp : this.computeMaxHp(this.mode), hp: r ? r.hp : undefined,
        seed: r ? r.seed : undefined, palIdx, pattern: r ? r.pattern : undefined, contrib: r ? r.contrib : undefined, last: r ? r.last : undefined });
      e.dropT = -i * 0.25;
      e.soft = r ? (r.soft || 1) : this.softer;
      return e;
    });
    this.lastPals = this.eggs.map(e => e.palIdx);
    this.softer = 1;
    this.phase = 'play'; this.phaseT = 0; this.lastRescale = this.t; this.lastDamageAt = gnow();
    this.layoutHelpers();
    Sound.whoosh(0.5);
    Missions.nextAt = gnow() + rand(22, 40);                   // erste Mission kommt früh
    if (this.mode === 'boss') Bubbles.say('Ich bin das BOSS-EI!', true, this.eggs[0]);
    else if (this.mode === 'normal' && Math.random() < 0.6) Bubbles.say(pick(['Hallo! Knack mich!', 'Ich bin bereit!', 'Wer hilft mir hier raus?']), true, this.eggs[0]);
  },
  rescaleHp() {
    // HP passt sich der Zahl aktiver Nutzer an; der Fortschritt in % bleibt erhalten
    for (const e of this.eggs) {
      if (e.state !== 'idle' && e.state !== 'drop') continue;
      const target = this.computeMaxHp(this.mode, e.soft || 1);
      if (Math.abs(target - e.maxHp) / e.maxHp < 0.03) continue;
      const nm = clamp(target, e.maxHp * 0.8, e.maxHp * 1.5);     // nach oben schneller (Stream-Start)
      const ratio = e.hp / e.maxHp; e.maxHp = Math.round(nm); e.hp = Math.max(0.01, ratio * e.maxHp);
    }
  },

  /* ---------- Eingehende Events ---------- */
  handleEvent(ev) {
    if (!ev || !ev.type || ev.uid == null) return;
    const isBot = String(ev.uid).startsWith('bot:');
    if (isBot && !Bots.ids.includes(ev.uid)) return;          // Bot ist schon gegangen
    if (!isBot) StatsLog.count(ev);
    if (ev.type === 'member') return;                     // reiner Beitritt ohne Interaktion
    const u = Users.touch(ev);
    this.sessionUsers.add(u.id);
    const W = { chat: 1, like: Math.min(ev.count || 1, 20) * 0.25, follow: 3, share: 2, gift: 3 }[ev.type] || 1;
    this.activity.push({ t: this.t, w: W, team: u.team });
    this.recentEv.push({ t: gnow(), type: ev.type, n: ev.type === 'like' ? Math.max(1, ev.count || 1) : 1, uid: u.id });
    Missions.count(ev, u);
    Hype.add({ chat: 1, like: Math.min(1.2, (ev.count || 1) * 0.08), follow: 3, share: 2.5, gift: 2 }[ev.type] || 0);
    const D = CONFIG.damage;
    switch (ev.type) {
      case 'chat': {
        if (!u.greeted) { u.greeted = true; this.greet(u); }
        if (this.mode === 'duel' && (this.phase === 'play' || this.phase === 'intro')) {
          const team = parseTeam(ev.text);
          if (team && team !== u.team) { u.team = team; this.teamPop(u, team); if (u.helper) this.layoutHelpers(); }
        }
        const tn = gnow() * 1000;
